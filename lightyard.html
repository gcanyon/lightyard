<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lightyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10;
  --panel:#12141b;
  --panel2:#181b24;
  --line:#262a36;
  --text:#e8e9ee;
  --dim:#8b8fa3;
  --dimmer:#5a5e70;
  --accent:#6ee7ff;
  --R:#ff4d4d; --G:#32e428; --B:#4d4dfe; --C:#28f0ff; --M:#e45cff; --Y:#ffd94d; --W:#f5f6fa;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
button, input, select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:4px;}

#app{display:flex;flex-direction:column;height:100vh;}

/* ---- Header ---- */
header{
  display:flex;align-items:center;gap:20px;
  padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;border-radius:7px;outline:none;}
.brand:hover h1,.brand:focus-visible h1{color:var(--accent);}
.brand:focus-visible{box-shadow:0 0 0 2px var(--accent);}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:0.3px;}
.beam{height:3px;width:120px;border-radius:2px;
  background:linear-gradient(90deg,var(--R),var(--Y),var(--G),var(--C),var(--B),var(--M),var(--R));
  background-size:200% 100%;
  animation:flow 6s linear infinite;}
@keyframes flow{to{background-position:200% 0;}}

nav.modes{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;}
nav.modes button{
  border:none;background:transparent;color:var(--dim);padding:7px 14px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
nav.modes button.active{background:var(--bg);color:var(--text);}
nav.modes button:hover:not(.active){color:var(--text);}
nav.modes .short-label{display:none;}
nav.detail-nav{display:none;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;}
nav.detail-nav button{
  border:none;background:transparent;color:var(--text);padding:7px 12px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
}
nav.detail-nav button:hover:not(:disabled){background:var(--bg);color:var(--accent);}
nav.detail-nav button:disabled{color:var(--dimmer);cursor:default;}
nav.detail-nav .short-label{display:none;}
header.detail-open nav.modes{display:none;}
header.detail-open nav.detail-nav{display:flex;}

.spacer{flex:1;}

.runbar{display:flex;align-items:center;gap:14px;}
.runbar .ticks{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);
  background:var(--panel2);padding:6px 10px;border-radius:7px;min-width:96px;text-align:center;}
.runbar .ticks b{color:var(--text);}
.speedwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
.speedwrap input[type=range]{width:130px;accent-color:var(--accent);}
.iconbtn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);}
.iconbtn:disabled{opacity:.35;cursor:default;}
.iconbtn:disabled:hover{border-color:var(--line);color:var(--text);}
.iconbtn.primary{background:var(--accent);color:#04222b;border-color:var(--accent);}

/* ---- Layout ---- */
#body{flex:1;display:flex;min-height:0;}
aside{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px;}
aside.right{border-right:none;border-left:1px solid var(--line);}
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;
  background:
    radial-gradient(circle at 50% 0%, #0e1018 0%, #08090d 70%);}
#gridCanvas{border-radius:12px;background:#0d0f16;box-shadow:0 0 0 1px #626979, 0 20px 60px -20px #000;}
.mobile-tabs{display:none;}

h2.side-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dimmer);
  margin:0 0 10px 0;font-weight:600;}
h3.sub{font-size:12px;color:var(--dim);margin:16px 0 8px;font-weight:600;}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;}
.card p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5;}

.btn{
  display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  margin-bottom:6px;transition:.12s;
}
.btn:hover{border-color:var(--accent);}
.btn.solid{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;text-align:center;}
.btn.solid:hover{filter:brightness(1.08);}
.btn.danger{color:#ff8080;}
.btn.danger:hover{border-color:#ff8080;}
.btn.small{padding:6px 9px;font-size:12px;display:inline-block;width:auto;margin-right:6px;}
.btn.tool{display:flex;align-items:center;gap:9px;}
.btn.tool.active{border-color:var(--accent);background:#132229;}
.btn.tool:disabled{opacity:0.4;cursor:not-allowed;}
.btn.tool:disabled:hover{border-color:var(--line);}
.toolicon{width:20px;height:20px;flex-shrink:0;}

input[type=text], input[type=number]{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:7px 9px;border-radius:7px;font-size:13px;margin-bottom:8px;
}
label.field{display:block;font-size:11px;color:var(--dimmer);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
label.field.sequence-heading{color:var(--dim);}

.dirgrid{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);gap:2px;margin-bottom:8px;}
.dirbtn{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:5px;
  cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
.dirbtn.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}

.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.color-code{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
  font-weight:800;color:var(--color-code-ink,#fff);text-shadow:0 1px 2px #000b;}
.swatch.color-code{font-size:13px;}

.prism-seq-row{display:flex;gap:8px;margin-bottom:10px;}
.prism-slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;}
.prism-slot:hover:not(:disabled){border-color:var(--accent);}
.prism-slot:disabled{cursor:default;opacity:0.65;}
.prism-slot.off svg rect{transition:stroke .15s;}
.orientation-program{display:grid;gap:7px;margin-bottom:10px;}
.orientation-choice-row{display:grid;grid-template-columns:24px repeat(5,minmax(42px,1fr));gap:6px;align-items:center;}
.orientation-step{color:var(--dimmer);font-size:12px;font-weight:700;text-align:center;}
.orientation-choice{min-width:0;min-height:42px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.orientation-choice:hover:not(:disabled){border-color:var(--accent);}
.orientation-choice.selected{border-color:#8beeff;background:#24586a;
  box-shadow:inset 0 0 0 1px #b8f5ff99,0 0 10px #6ee7ff33;}
.orientation-choice.selected svg{filter:brightness(1.45) saturate(1.2);}
.orientation-choice:disabled{cursor:default;opacity:.62;}
.orientation-choice.blank{font-size:18px;color:var(--dimmer);}
.swatch:hover{border-color:#fff;}
.chipline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:28px;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px;}
.chip{width:22px;height:22px;border-radius:5px;cursor:pointer;position:relative;flex-shrink:0;}
.chip.color-code{font-size:11px;}
.chip::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#0009;font-size:12px;opacity:0;font-weight:900;}
.chip:hover::after{opacity:1;}
.chip-empty{color:var(--dimmer);font-size:11px;padding:4px;}

.radiorow{display:flex;gap:6px;margin-bottom:8px;}
.radiorow button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  padding:7px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;}
.radiorow button.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}
.mirror-orientation-editor{margin-bottom:8px;}
.mirror-orientation-editor .radiorow{margin-bottom:6px;}
.mirror-orientation-row button{min-height:62px!important;}
.mirror-orientation-single svg{width:52px;height:52px;display:block;}
.mirror-orientation-sequence{display:flex;align-items:center;justify-content:center;gap:7px;}
.mirror-orientation-sequence svg{width:32px;height:32px;display:block;}
.mirror-orientation-sequence .sequence-arrow{font-size:20px;font-weight:800;line-height:1;}
.mirror-orientation-row button.on svg{filter:brightness(1.2) drop-shadow(0 0 4px #dcefff88);}

.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin-bottom:8px;cursor:pointer;}

.puzlist .item, .sollist .item{
  border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;
}
.puzlist .item:hover, .sollist .item:hover{border-color:var(--accent);}
.sollist .item.active-sol{border-color:var(--accent);background:#132229;}
.puzlist .item .name{font-weight:600;font-size:13.5px;}
.puzlist .item .meta{font-size:11px;color:var(--dimmer);margin-top:3px;}
.sollist .item .name{font-weight:600;font-size:13px;}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.badge.solved{background:#123b26;color:#32e428;}
.badge.progress{background:#2b2410;color:#ffd94d;}
.board-solved-badge{flex:none;margin-left:3px;}
.rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

.empty-hint{color:var(--dimmer);font-size:12.5px;text-align:center;padding:30px 10px;}

.storage-warning{position:fixed;z-index:150;left:12px;right:12px;bottom:12px;max-width:780px;margin:auto;
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid #ff8888;border-radius:10px;background:#391d21;color:#fff;box-shadow:0 10px 35px #000b;font-size:14px;}
.storage-warning button{flex:none;border:1px solid #ffc2c2;border-radius:7px;padding:8px 10px;background:#fff;color:#551d25;font-weight:700;cursor:pointer;}

.dialog-backdrop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:340px;}
.dialog h3{margin:0 0 12px;font-size:15px;}
.dialog .rowbtns{justify-content:flex-end;}
.clipboard-notice{position:fixed;z-index:150;left:12px;right:12px;bottom:12px;margin:auto;max-width:520px;
  display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px #0008;font-size:13px;}
.clipboard-notice span{flex:1;}
.clipboard-notice .btn{flex:none;}
.clipboard-paste-dialog{width:min(420px,calc(100vw - 24px));}
.clipboard-paste-dialog textarea{width:100%;min-height:140px;max-height:35dvh;resize:vertical;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:10px;font:11px 'JetBrains Mono',monospace;}
.arrange-dialog{width:min(390px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;}
.arrange-preview{display:block;max-width:100%;max-height:min(24dvh,190px);width:auto;height:auto;margin:0 auto 10px;border-radius:8px;background:#0d0f16;}
.arrange-caption{text-align:center;font-size:12px;color:var(--dim);margin:0 0 12px;}
.arrange-section{font-size:11px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.6px;margin:13px 0 7px;}
.arrange-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.arrange-buttons .btn{min-height:44px;padding:9px 7px;font-size:12px;}
.arrange-buttons .btn:only-child{grid-column:1 / -1;}
.arrange-dialog .btn:disabled{opacity:.35;cursor:default;}
.arrange-dialog .btn:disabled:hover{border-color:var(--line);}
.arrange-dialog .rowbtns .btn{width:auto;min-width:76px;margin:0;}
.arrange-note{font-size:11.5px;color:var(--dim);line-height:1.45;margin:10px 0;}

.puzzle-setup-dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;}
.puzzle-intro-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 0 8px;}
.puzzle-intro-tools .hint{font-size:11.5px;color:var(--dimmer);margin-right:2px;}
.puzzle-intro-insert{width:32px;height:32px;border:1px solid #69707f;border-radius:8px;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font:800 14px 'JetBrains Mono',monospace;box-shadow:inset 0 0 0 1px #ffffff20;}
.puzzle-intro-insert.element{width:42px;height:42px;background:#10131a;}
.puzzle-intro-insert.element svg{display:block;width:38px;height:38px;}
.puzzle-intro-surface{box-sizing:border-box;width:100%;height:280px;overflow-y:auto;overscroll-behavior:contain;
  border:1px solid #626979;border-radius:12px;background:#11131a;color:#fff;padding:18px 20px;
  font-size:20px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
.puzzle-intro-editor{outline:none;cursor:text;caret-color:var(--accent);}
.puzzle-intro-editor:focus{border-color:var(--accent);box-shadow:0 0 0 2px #6ee7ff25;}
.puzzle-intro-editor:empty::before{content:attr(data-placeholder);color:#858b99;pointer-events:none;}
.puzzle-intro-symbol{display:inline-flex;vertical-align:.08em;align-items:center;justify-content:center;
  min-width:1.42em;height:1.42em;margin:0 .08em;border-radius:.3em;border:1px solid #ffffff50;
  font:800 .68em 'JetBrains Mono',monospace;line-height:1;box-shadow:0 1px 5px #0008;}
.puzzle-intro-element{display:inline-flex;vertical-align:-.52em;align-items:center;justify-content:center;
  width:1.9em;height:1.9em;margin:0 .09em;border:1px solid #555c6a;border-radius:.35em;
  background:#10131a;box-shadow:0 1px 5px #0008;}
.puzzle-intro-element svg{display:block;width:100%;height:100%;}
.puzzle-intro-paragraph{min-height:1.5em;}
.puzzle-intro-paragraph + .puzzle-intro-paragraph{margin-top:.55em;}
.puzzle-intro-overlay{position:absolute;z-index:45;inset:0;display:block;
  background:rgba(5,6,11,.48);cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;}
.puzzle-intro-card{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;width:min(560px,calc(100% - 28px));height:min(340px,55%);max-height:calc(100% - 28px);
  min-height:130px;border:2px solid #858c9c;border-radius:16px;background:#1c1f28;color:#fff;
  box-shadow:0 24px 70px #000c;overflow:hidden;cursor:pointer;}
.puzzle-intro-card .puzzle-intro-surface{flex:1;min-height:0;height:auto;border:0;border-radius:0;background:#1c1f28;color:#fff;cursor:pointer;}
.puzzle-intro-dismiss{border-top:1px solid #3d424e;padding:10px 16px;text-align:center;color:var(--accent);
  font-size:12px;font-weight:700;letter-spacing:.2px;background:#11131a;}
.board-stage.intro-open{overflow:hidden;}

.sizewrap{display:flex;gap:10px;}
.sizewrap > div{flex:1;}

.help-backdrop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.help-backdrop.show{display:flex;}
.help-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px -20px #000;}
.help-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
.help-head h2{margin:0;font-size:18px;}
.help-head .ver{font-size:11px;color:var(--dimmer);background:var(--panel2);padding:3px 9px;border-radius:20px;font-weight:600;}
.help-body{overflow-y:auto;padding:6px 24px 20px;flex:1;}
.help-body h3{font-size:14px;color:var(--accent);margin:24px 0 8px;letter-spacing:.2px;}
.help-body h3:first-child{margin-top:16px;}
.help-body h4{font-size:12.5px;color:var(--text);margin:16px 0 5px;font-weight:700;}
.help-body p{font-size:13px;color:var(--dim);line-height:1.65;margin:6px 0;}
.help-body ul{margin:6px 0;padding-left:20px;}
.help-body li{font-size:13px;color:var(--dim);line-height:1.6;margin:3px 0;}
.help-body strong{color:var(--text);}
.help-body a{color:var(--accent);}
.hs{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 1px;}
.help-ex{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;color:var(--dim);}
.help-piece{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);}
.help-piece:first-of-type{border-top:none;}
.help-piece .pn{font-weight:700;color:var(--text);font-size:13px;min-width:130px;flex-shrink:0;}
.help-piece .pd{font-size:12.5px;color:var(--dim);line-height:1.6;}
.help-ui-shot{position:relative;margin:12px 0 10px;border:1px solid #626979;border-radius:12px;background:#0a0b10;overflow:hidden;box-shadow:0 12px 30px #0007;}
.help-ui-top,.help-ui-play,.help-ui-tools{display:flex;align-items:center;gap:5px;padding:6px 7px;background:#12141b;border-bottom:1px solid #303646;min-width:max-content;}
.help-ui-title{flex:1;min-width:130px;color:#e8e9ee;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.help-ui-pill,.help-ui-tool{border:1px solid #343a49;border-radius:6px;background:#181b24;color:#c4c7d1;font-size:8px;font-weight:650;padding:5px 7px;white-space:nowrap;text-align:center;}
.help-ui-pill.primary{background:#123544;border-color:#6ee7ff;color:#bff6ff;}
.help-ui-play{background:#101219;}
.help-ui-meter{height:4px;width:70px;border-radius:3px;background:linear-gradient(90deg,#6ee7ff 39%,#343a49 39%);}
.help-ui-tools{overflow:hidden;}
.help-ui-tool{min-width:52px;padding:6px 4px;}
.help-ui-board{height:205px;margin:14px auto 16px;width:min(72%,300px);border:1px solid #626979;border-radius:7px;
  background-color:#0d0f16;background-image:linear-gradient(#444957 1px,transparent 1px),linear-gradient(90deg,#444957 1px,transparent 1px);background-size:14.285% 14.285%;position:relative;}
.help-ui-piece-dot{position:absolute;width:17px;height:17px;border:2px solid #bfc3cc;background:#2a2c33;transform:translate(-50%,-50%) rotate(45deg);}
.help-ui-piece-dot.mirror{border:0;border-radius:0;background:linear-gradient(135deg,transparent 44%,#dcefff 45% 55%,transparent 56%);transform:translate(-50%,-50%);}
.help-ui-piece-dot.fixed{border-radius:4px;border-color:#6ee7ff;background:#1a2230;transform:translate(-50%,-50%);}
.help-ui-label{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;background:#ffd94d;color:#141414;border:2px solid #fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px #000;}
.help-ui-legend{margin:8px 0 16px!important;padding-left:25px!important;}
.help-ui-legend li{padding-left:3px;}
.help-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
.help-foot .credit{font-size:11.5px;color:var(--dimmer);line-height:1.5;}
.help-foot .btn{width:auto;margin:0;padding:9px 16px;}
.settings-dialog-backdrop{z-index:120;}

/* ---- About / opening screen ---- */
.about-backdrop{position:fixed;inset:0;z-index:115;display:none;overflow:hidden;cursor:pointer;
  align-items:center;justify-content:center;background:
  radial-gradient(circle at 50% 42%,#182130 0%,#0b0e15 38%,#05060a 78%);}
.about-backdrop.show{display:flex;}

/* ---- Solved celebration ---- */
.celebration-layer{position:fixed;inset:0;z-index:95;overflow:hidden;pointer-events:auto;}
.confetti-piece{position:fixed;left:var(--start-x);top:var(--start-y);width:var(--w);height:var(--h);
  border-radius:2px;background:var(--color);box-shadow:0 0 0 1px #ffffff18;
  animation:confetti-fall var(--duration) cubic-bezier(.16,.65,.33,1) var(--delay) forwards;}
@keyframes confetti-fall{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r0)) scale(.3);}
  8%{opacity:1;}
  28%{transform:translate(var(--mid-x),var(--rise)) rotate(var(--r1)) scale(1);}
  100%{opacity:.95;transform:translate(var(--end-x),calc(100vh + 90px)) rotate(var(--r2)) scale(.88);}
}
.victory-dialog{position:fixed;z-index:2;left:var(--dialog-x);top:var(--dialog-y);transform:translate(-50%,-50%);
  width:min(360px,calc(100vw - 32px));padding:27px 28px 22px;text-align:center;pointer-events:auto;
  cursor:pointer;
  border:2px solid #ffd94d;border-radius:22px;color:#fff;background:
    radial-gradient(circle at 50% -20%,#6ee7ff36,transparent 48%),linear-gradient(145deg,#242030,#11151d 68%);
  box-shadow:0 0 0 5px #ffd94d22,0 24px 80px #000d;animation:victory-arrive .42s cubic-bezier(.2,1.35,.45,1) both;}
.victory-dialog::before,.victory-dialog::after{content:'✦';position:absolute;color:#ffd94d;font-size:24px;text-shadow:0 0 14px #ffd94d99;}
.victory-dialog::before{left:18px;top:15px;transform:rotate(-16deg);}
.victory-dialog::after{right:18px;top:15px;transform:rotate(16deg);}
.victory-message{font-size:clamp(28px,7vw,42px);font-weight:800;line-height:1.08;letter-spacing:-1px;text-wrap:balance;}
.victory-name{display:block;color:#ffd94d;margin-top:4px;overflow-wrap:anywhere;}
.victory-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px;font:700 14px 'JetBrains Mono',monospace;}
.victory-stat{padding:7px 10px;border:1px solid #ffffff22;border-radius:10px;background:#0b0e1588;color:#f5f6fa;}
.victory-stat.elements.equal{color:#7d7daf;border-color:#4d4dfe55;}
.victory-stat.elements.better{color:#4d4dfe;border-color:#4d4dfebb;text-shadow:0 0 10px #4d4dfe55;}
.victory-stat.ticks.equal{color:#a86f6f;border-color:#ff4d4d55;}
.victory-stat.ticks.better{color:#ff4d4d;border-color:#ff4d4dbb;text-shadow:0 0 10px #ff4d4d55;}
.victory-callouts{margin-top:12px;font-size:14px;font-weight:700;line-height:1.4;}
.victory-callout + .victory-callout{margin-top:4px;}
.victory-callout.elements.equal{color:#7d7daf;}.victory-callout.elements.better{color:#4d4dfe;}
.victory-callout.ticks.equal{color:#a86f6f;}.victory-callout.ticks.better{color:#ff4d4d;}
.victory-dialog .btn{width:auto;margin:20px auto 0;padding:9px 20px;text-align:center;}
@keyframes victory-arrive{from{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-2deg);}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}}

.collection-heading .kebab-menu-button:focus-visible,.list-drag-handle:focus-visible{
  outline:3px solid var(--list-accent);outline-offset:-3px;
}
.tree-chevron{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;
  margin:-4px -6px -4px 0;color:#b6bbc5;transition:color .15s;}
.tree-head:hover .tree-chevron,.tree-puzzle-head:hover .tree-chevron{color:#f2f4f7;}
.tree-chevron::before{content:'';width:9px;height:9px;border:solid currentColor;border-width:0 2.5px 2.5px 0;
  transform:rotate(-45deg);transition:transform .18s ease;}
.tree-chevron.expanded::before{transform:rotate(45deg);}
.tree-copy{min-width:0;flex:1;}
.tree-name{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree-name-line{display:flex;align-items:baseline;gap:10px;min-width:0;}
.tree-name-line .tree-name{flex:1;min-width:0;}
.tree-goal{flex:none;color:#b0b3be;font:700 10.5px 'JetBrains Mono',monospace;white-space:nowrap;}
.tree-meta{display:block;font-size:12px;color:var(--list-muted);margin-top:3px;line-height:1.4;}
.tree-stars{display:block;font-size:16px;letter-spacing:2px;line-height:1;color:#898d98;margin-top:5px;}
.tree-stars .solved{color:#ffd94d;}
.tree-body{padding:6px 12px 12px 30px;border-top:1px solid #484d57;}
.tree-puzzle{position:relative;border:1px solid var(--list-rule);border-left:3px solid #7b808b;
  border-radius:9px;background:#202228;margin-top:9px;overflow:hidden;}
.tree-puzzle-body{padding:0 12px 5px 86px;background:#1a1c22;border-top:1px solid #414650;}
.tree-solution{min-height:54px;padding:9px 7px;background:transparent;color:var(--list-ink);border-top:1px solid #414650;}
.tree-solution:first-child{border-top:0;}
.tree-solution:hover{background:#2c3038;}
.tree-list-preview{display:block;flex:none;width:72px;height:72px;border:1px solid #414650;border-radius:6px;pointer-events:none;}
.tree-solution .tree-list-preview{width:64px;height:64px;}
.tree-puzzle-head .tree-name-line{flex-wrap:wrap;gap:3px 7px;}
.tree-puzzle-head .tree-name-line .tree-name{flex:1 1 0;white-space:normal;overflow-wrap:anywhere;}
.tree-puzzle-head .tree-goal{flex-basis:100%;white-space:normal;}
.tree-solution .tree-name{white-space:normal;overflow-wrap:anywhere;}
.tree-solution .badge{white-space:nowrap;}
.tree-star{font-size:20px;color:#898d98;flex:none;}
.tree-star.solved{color:#ffd94d;}
.tree-star.goal-elements,.tree-stars .goal-elements,.tree-star.goal-ticks,.tree-stars .goal-ticks{display:inline-block;position:relative;}
.goal-elements-equal{--goal-blue:#7d7daf;}
.goal-elements-better{--goal-blue:#4d4dfe;}
.goal-ticks-equal{--goal-red:#a86f6f;}
.goal-ticks-better{--goal-red:#ff4d4d;}
.tree-star.goal-elements:not(.goal-ticks),.tree-stars .goal-elements:not(.goal-ticks){text-shadow:2px 0 0 var(--goal-blue);}
.tree-star.goal-ticks:not(.goal-elements),.tree-stars .goal-ticks:not(.goal-elements){text-shadow:2px 0 0 var(--goal-red);}
.tree-star.goal-elements.goal-ticks,.tree-stars .goal-elements.goal-ticks{
  text-shadow:1.5px 0 0 var(--goal-blue),3px 0 0 var(--goal-red);}
.tree-empty{font-size:13px;color:var(--list-muted);padding:12px;}
.tree-set .kebab-menu-button,.tree-puzzle .kebab-menu-button,.collection-heading .kebab-menu-button{
  background:transparent;border:0;color:#c5c9d1;border-radius:7px;
}
.tree-set .kebab-menu-button:hover,.tree-puzzle .kebab-menu-button:hover,.collection-heading .kebab-menu-button:hover{
  background:#3c404a;color:#f4f5f8;
}
.list-drag-handle{position:absolute;z-index:2;right:9px;top:10px;width:36px;height:36px;border:0;border-radius:7px;
  background:transparent;color:#adb1bc;font-size:18px;line-height:1;cursor:grab;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.tree-puzzle > .list-drag-handle{right:8px;top:8px;}
.list-drag-handle:hover{background:#3c404a;color:#f4f5f8;}
.list-drag-handle:active{cursor:grabbing;}
.tree-set > .list-drag-handle + .tree-head,.tree-puzzle > .list-drag-handle + .tree-puzzle-head{padding-right:48px;}
.tree-puzzle > .btn.small{background:#2b2f37;color:#e7e9ef;border-color:#626873;font-weight:700;}
.tree-puzzle > .btn.small:hover{background:#393e48;border-color:#a4abb8;}
.list-drag-ghost{position:fixed;z-index:100;max-width:min(320px,70vw);padding:8px 12px;border:1px solid var(--accent);
  border-radius:8px;background:var(--panel2);color:var(--text);font-size:13px;font-weight:700;pointer-events:none;
  box-shadow:0 10px 28px #000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.94;}
.list-drag-destination{display:block;color:#b9c8d4;font-size:11px;font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;}
.list-drop-marker{position:fixed;z-index:99;height:0;border-top:3px solid var(--accent);pointer-events:none;
  filter:drop-shadow(0 0 4px #6ee7ff99);}
.list-drop-marker::before,.list-drop-marker::after{content:'';position:absolute;top:-6px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);}
.list-drop-marker::before{left:-3px;}
.list-drop-marker::after{right:-3px;}
.list-dragging{opacity:.45;}
@media (max-width:800px){

  }

  .board-chrome{padding:7px 8px;}
  .board-stage{padding:10px;}
  .board-row{gap:5px;}
  .board-title{font-size:14px;}
  .puzzle-rule-button{width:40px;height:40px;}

  .board-name-selects{gap:1px;}
  .board-name-select-wrap{max-width:calc(50% - 7px);}
  .board-name-select{font-size:14px;padding:7px 15px 7px 3px;}
  .board-name-select-wrap::after{right:3px;font-size:8px;}
  .board-name-separator{font-size:12px;padding:0;}
  .mobile-tool-strip{width:100%;overflow:visible;gap:4px;}

  .header-more-wrap{flex:none;min-width:0;}
  .mobile-tool-strip-scroll{display:flex;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;}
  .mobile-tool-strip-scroll::-webkit-scrollbar{display:none;}
  #rightPanel,#body.editing > #rightPanel{max-height:calc(100dvh - var(--inspector-top,96px) - 8px - env(safe-area-inset-bottom));}
  .sheet-head{position:relative;}
  .sheet-body{max-height:calc(100dvh - var(--inspector-top,96px) - 66px - env(safe-area-inset-bottom));}
  .sheet-body.sequence-sheet{padding:10px 12px;}
  .sequence-sheet .card{padding:8px 10px;margin-bottom:7px;}
  .sequence-sheet .orientation-program{gap:4px;margin-bottom:0;}
  .sequence-sheet .orientation-choice-row{gap:4px;}
  .sequence-sheet .orientation-choice{min-height:36px;}
  .sequence-sheet .orientation-choice svg{width:30px;height:30px;}
  .board-row .btn.small{padding:8px 9px;white-space:nowrap;}
  .board-row .iconbtn{width:40px;height:40px;}
  .board-chrome .runbar{width:100%;display:flex;gap:5px;}
  #leftPanel.library-list{padding:14px 10px calc(20px + env(safe-area-inset-bottom));}
  .tree-body{padding-left:24px;padding-right:10px;}
  .tree-puzzle-head,.tree-solution{gap:7px;}
  .tree-list-preview,.tree-solution .tree-list-preview{width:52px;height:52px;}
  .tree-puzzle-body{padding-left:40px;padding-right:8px;}
  .tree-puzzle-head .tree-chevron{width:24px;}
  .tree-puzzle-head .tree-name{font-size:14px;}
  .library-actions,.scope-actions{gap:6px;}
  .help-body p,.help-body li{font-size:17px;line-height:1.55;}
  .help-piece .pn{font-size:17px;}
  .help-piece .pd,.help-ex{font-size:16px;line-height:1.55;}
  .help-body h3{font-size:17px;}
  .help-body h4{font-size:16px;}
  .hs{width:15px;height:15px;}
}

/* ---- Mode-specific header palette ---- */
header,.board-chrome{
  --panel:#191b24;--panel2:#323642;--bg:#323642;--line:#444c5a;
  --text:#9fa3be;--dim:#9fa3be;--dimmer:#9fa3be;
  background:var(--panel);color:var(--text);
}
header.create-mode,main#boardPanel.puzzle-design .board-chrome{--panel:#211d1b;}
header.create-mode + #body.library-list-open,
header.create-mode + #body #leftPanel.library-list{background:#292624;}
header nav.detail-nav button,header nav.modes button,header nav.modes button.active,header nav.detail-nav button:hover:not(:disabled),
header .iconbtn,header .iconbtn.primary,header .iconbtn:hover,
.board-chrome .iconbtn,.board-chrome .iconbtn.primary,.board-chrome .iconbtn:hover,
.board-chrome .mobile-tool-button,.board-chrome .mobile-tool-button.active,
.board-chrome .mobile-more-button,.board-chrome .header-more-button{

}
header nav.modes,header nav.detail-nav{background:transparent;padding:0;gap:6px;}
header nav.modes button,header nav.detail-nav button{border:1px solid var(--line);}
header nav.detail-nav button{flex:0 1 auto;}
header nav.modes button.active,header nav.modes button:hover:not(.active),
.board-chrome .mobile-tool-button.active,
.board-chrome .mobile-tool-button:hover:not(:disabled):not(.locked-solution-tool){
  background:#132229;border-color:var(--accent);color:var(--accent);
}
header nav.modes button.active,.board-chrome .mobile-tool-button.active{

}
.board-chrome .mobile-tool-glyph{color:inherit;}
.board-chrome .mobile-tool-strip{margin-top:6px;}
header nav.detail-nav button:disabled{opacity:.35;}
.board-chrome .speedwrap{background:var(--panel2);border-radius:7px;padding:6px;}

/* ---------- online ---------- */
#onlineBtn[hidden],.online-more[hidden]{display:none !important;}
.online-backdrop{z-index:110;}
.online-dialog{width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);display:flex;flex-direction:column;}
.online-body{display:flex;flex-direction:column;min-height:0;flex:1;}
.online-scroll{overflow-y:auto;flex:1;min-height:120px;}
.online-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}

.online-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px;font-weight:600;}

<script>
(function(){
"use strict";

// Captured before the app renders anything dynamic. Save as Web App uses this
// clean source—not the mutated live DOM—as the shell for a standalone copy.
const SOURCE_APP_HTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const BUILT_IN_APP_DATA = /*__LIGHTYARD_EMBED_START__*/ null /*__LIGHTYARD_EMBED_END__*/;

/* ============================== CONSTANTS ============================== */
const MAX_PACKET_SEQUENCE = 10;
const DIRS = ['N','E','S','W'];
const DIRWORD = {N:'north',E:'east',S:'south',W:'west'};
const VEC = {N:{dr:-1,dc:0}, E:{dr:0,dc:1}, S:{dr:1,dc:0}, W:{dr:0,dc:-1}};
const OPP = {N:'S',E:'W',S:'N',W:'E'};
const CW  = {N:'E',E:'S',S:'W',W:'N'};
const CCW = {N:'W',W:'S',S:'E',E:'N'};
const NE_SW_MAP = {N:'E',E:'N',S:'W',W:'S'};
const NW_SE_MAP = {N:'W',W:'N',S:'E',E:'S'};
const CORNER_CW = {NW:'NE',NE:'SE',SE:'SW',SW:'NW'};
const CORNER_SIDES = {NW:['N','W'],NE:['N','E'],SE:['S','E'],SW:['S','W']};
function legacyHalfMirrorFacing(el){
  const orient=el.orientation||'NE_SW';
  const upper=(el.reflectiveSide||'upper')==='upper';
  return orient==='NE_SW' ? (upper?'NW':'SE') : (upper?'NE':'SW');
}
function halfMirrorFacing(el){ return el.curFacing||el.facing||legacyHalfMirrorFacing(el); }
function halfMirrorOrientation(facing){ return facing==='NW'||facing==='SE' ? 'NE_SW' : 'NW_SE'; }
function halfMirrorReflects(el,inputSide){
  return CORNER_SIDES[halfMirrorFacing(el)].includes(inputSide);
}
function isMirrorElement(el){return el?.type==='mirrorDiag'||el?.type==='mirrorHalf';}
function mirrorColorFor(el){
  return isMirrorElement(el)&&Number.isInteger(el.mirrorColor)&&el.mirrorColor>=1&&el.mirrorColor<=7?el.mirrorColor:null;
}
function mirrorColorMatches(el,color){
  const coating=mirrorColorFor(el);
  return coating==null||(color&coating)===coating;
}
function mirrorReflectsPacket(el,packet){
  return mirrorColorMatches(el,packet.color)&&(el.type==='mirrorDiag'||halfMirrorReflects(el,OPP[packet.dir]));
}
function normalizeMirrorColor(el){
  if(isMirrorElement(el)&&mirrorColorFor(el)==null)delete el.mirrorColor;
  return el;
}

// colors as bitmask: R=1 G=2 B=4
const COL = {R:1,G:2,B:4,Y:3,M:5,C:6,W:7,K:'black'};
const COLNAME = {1:'R',2:'G',4:'B',3:'Y',5:'M',6:'C',7:'W',black:'Black'};
const COLLETTER = {1:'R',2:'G',4:'B',3:'Y',5:'M',6:'C',7:'W',black:'K'};
const COLHEX  = {1:'#ff4d4d',2:'#32e428',4:'#4d4dfe',3:'#ffd94d',5:'#e45cff',6:'#28f0ff',7:'#f5f6fa',black:'#050507'};
const COLORS_ORDER = [1,2,4,3,5,6,7]; // R G B Y M C W
// Neutral materials do not imply a packet/filter color. Fixed optical pieces
// share a subtle cell background, independent of their runtime orientation.
const PIECE_STYLE = {
  prismFill:'#2a2c33', prismStroke:'#bfc3cc',
  clearFill:'#bfc3cc33', clearStroke:'#d1d4db',
  blackFill:'#000000', blackStroke:'#787878', fixedCellFill:'#252832'
};
// The transformer's spectrum: red -> yellow -> green -> cyan -> blue -> magenta.
// No wraparound — stepping past either end (or white, which isn't on the
// spectrum at all) is a failure, handled by stepSpectrum returning null.
const SPECTRUM = [COL.R, COL.Y, COL.G, COL.C, COL.B, COL.M];
function stepSpectrum(color, direction){
  const idx = SPECTRUM.indexOf(color);
  if(idx===-1) return null; // white, or anything else off the spectrum
  const next = direction==='up' ? idx+1 : idx-1;
  if(next<0 || next>=SPECTRUM.length) return null;
  return SPECTRUM[next];
}

function splitTable(x){
  // returns [p1color,p2color] for a D-side prism hit
  if(x===6) return [2,4];   // Cyan -> Green(P1) + Blue(P2)
  if(x===5) return [4,1];   // Magenta -> Blue(P1) + Red(P2)
  if(x===3) return [1,2];   // Yellow -> Red(P1) + Green(P2)
  return [x,x];             // R,G,B,W -> same color both sides
}
function blendAll(colors){ let c=0; for(const x of colors) c|=x; return c; }

// Two packets each moving in a straight line (start -> end) during the same
// interval: find the frac in (0,1) where their positions coincide, if any.
// Handles unequal speeds (e.g. one at half speed leaving a crystal, the
// other at full speed approaching it) as well as the simple equal-speed
// case — a straight line segment intersection in position-vs-frac space.
function computeCrossFrac(startA, endA, startB, endB){
  const EPS = 1e-9;
  const ddr = (endA.r-startA.r) - (endB.r-startB.r);
  const ddc = (endA.c-startA.c) - (endB.c-startB.c);
  const dr0 = startB.r - startA.r;
  const dc0 = startB.c - startA.c;
  let f;
  if(Math.abs(ddr) > EPS){
    f = dr0/ddr;
    const colA = startA.c + f*(endA.c-startA.c);
    const colB = startB.c + f*(endB.c-startB.c);
    if(Math.abs(colA-colB) > 1e-6) return null;
  } else if(Math.abs(ddc) > EPS){
    if(Math.abs(dr0) > 1e-6) return null;
    f = dc0/ddc;
  } else {
    return null; // same relative velocity: never newly meet
  }
  if(!(f > EPS && f < 1-EPS)) return null;
  return f;
}

let idCounter = 1;
function uid(){ return 'id'+(idCounter++)+'_'+Date.now().toString(36); }

// A puzzle's id identifies the puzzle; this hash identifies one exact design.
// Object keys and element order are normalized so inconsequential serialization
// differences do not make equivalent configurations look different.
function stableStringify(value){
  if(value===null || typeof value!=='object') return JSON.stringify(value);
  if(Array.isArray(value)) return '['+value.map(stableStringify).join(',')+']';
  return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stableStringify(value[k])).join(',')+'}';
}
function puzzleConfigurationHash(puzzle){
  const elements=((puzzle&&puzzle.elements)||[]).map(el=>{
    const copy=JSON.parse(JSON.stringify(el));delete copy.fixed;
    // The neutral default has no serialized color, preserving legacy hashes.
    if(isMirrorElement(copy)&&copy.mirrorColor==null)delete copy.mirrorColor;
    return copy;
  }).sort((a,b)=>stableStringify(a).localeCompare(stableStringify(b)));
  const canonical=stableStringify({
    rows:Number(puzzle&&puzzle.rows)||7,cols:Number(puzzle&&puzzle.cols)||7,
    strict:!!(puzzle&&puzzle.strict),noPrisms:puzzle&&puzzle.noPrisms!=null?!!puzzle.noPrisms:!!(puzzle&&puzzle.mirrorsOnly),
    noHalfMirrors:!!(puzzle&&puzzle.noHalfMirrors),elements,
    ...(puzzle&&puzzle.includeMirrorColors?{includeMirrorColors:true}:{}),
    // Keep existing configuration hashes when the new rule is off.
    ...(puzzle&&puzzle.noCollisions?{noCollisions:true}:{}),
    ...(puzzle&&puzzle.strictCrystals?{strictCrystals:true}:{}),
    // Multi-entry receivers advance their entry only between ticks.
    ...(elements.some(el=>el.type==='receiver'&&new Set(el.dirs||[]).size>1)?{receiverEntryOrder:'clockwise-one-per-tick'}:{})
  });
  let a=0x811c9dc5,b=0x9e3779b9;
  for(let i=0;i<canonical.length;i++){
    const c=canonical.charCodeAt(i);a=Math.imul(a^c,0x01000193);b=Math.imul(b^c,0x85ebca6b);
  }
  return 'cfg-'+(a>>>0).toString(36).padStart(7,'0')+(b>>>0).toString(36).padStart(7,'0');
}

/* ============================== EXPORT / IMPORT ============================== */
// Self-describing JSON files: a "schema"+"schemaVersion" envelope around a plain
// snapshot of the stored objects, so any element type this app knows about today
// or adds later round-trips automatically — nothing here hardcodes a field list.
const EXPORT_SCHEMA_VERSION = 1;
// Keep published updates on the same origin in one browser storage area.
const PUBLISHED_STORAGE_NAMESPACE = 'app-lightyard-public';

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadTextFile(text,filename,mimeType){
  const blob=new Blob([text],{type:mimeType||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function canonicalPuzzleId(p){ return p&&p._builtIn?p._sourceId:p&&p.id; }
function canonicalSetId(s){ return s&&s._builtIn?s._sourceId:s&&s.id; }
function portablePuzzle(p,setId){
  const copy=JSON.parse(JSON.stringify(p));
  copy.id=canonicalPuzzleId(p);copy.setId=setId==null?(p._builtIn?p._sourceSetId:p.setId):setId;
  delete copy._builtIn;delete copy._sourceId;delete copy._sourceSetId;delete copy.configurationHash;
  return copy;
}
function allSets(){ return [...State.builtInSets,...State.sets]; }
function allPuzzles(){ return [...State.builtInPuzzles,...State.puzzles]; }
function findSetByRuntimeId(id){ return allSets().find(s=>s.id===id)||null; }
function findPuzzleByRuntimeId(id){ return allPuzzles().find(p=>p.id===id)||null; }
function puzzlesForSet(set){
  const source=set&&set._builtIn?State.builtInPuzzles:State.puzzles;
  return source.filter(p=>p.setId===set.id);
}
function puzzleMatchesSolution(p,solution){
  return !!p && !!solution && solution.puzzleId===canonicalPuzzleId(p);
}
function puzzleForSolution(solution){
  const current=findPuzzleByRuntimeId(State.currentPuzzleId);
  if(puzzleMatchesSolution(current,solution))return current;
  return allPuzzles().find(p=>puzzleMatchesSolution(p,solution))||null;
}
function embeddedPuzzleGoal(puzzle){
  if(!puzzle||puzzle.goalElements==null||puzzle.goalTicks==null)return null;
  const elements=Number(puzzle&&puzzle.goalElements),ticks=Number(puzzle&&puzzle.goalTicks);
  return Number.isFinite(elements)&&elements>=0&&Number.isFinite(ticks)&&ticks>=0
    ? {elements:Math.floor(elements),ticks:Math.floor(ticks)}
    : null;
}
function puzzleGoalForWebApp(puzzle){
  const embedded=embeddedPuzzleGoal(puzzle);
  let elements=embedded?embedded.elements:Infinity;
  let ticks=embedded?embedded.ticks:Infinity;
  for(const solution of solutionsForPuzzle(puzzle)){
    if(solution.status!=='solved')continue;
    elements=Math.min(elements,(solution.elements||[]).length);
    if(solution.ticksToSolve!=null&&Number.isFinite(Number(solution.ticksToSolve)))ticks=Math.min(ticks,Math.max(0,Math.floor(Number(solution.ticksToSolve))));
  }
  return Number.isFinite(elements)&&Number.isFinite(ticks)?{elements,ticks}:null;
}
function portableWebAppPuzzle(puzzle,setId){
  const copy=portablePuzzle(puzzle,setId);
  const goal=puzzleGoalForWebApp(puzzle);
  if(goal){copy.goalElements=goal.elements;copy.goalTicks=goal.ticks;}
  else{delete copy.goalElements;delete copy.goalTicks;}
  return copy;
}
function downloadWebApp(includeUnsolved){
  const catalogSets=allSets().map(set=>({
    set,puzzles:puzzlesForSet(set).filter(p=>includeUnsolved||solvedPuzzle(p))
  })).filter(({puzzles})=>includeUnsolved||puzzles.length>0);
  if(!catalogSets.some(({puzzles})=>puzzles.length)){
    alert(includeUnsolved?'There are no puzzles to include.':'There are no solved puzzles to include.');
    return false;
  }
  const usedSetIds=new Set();
  const catalog=catalogSets.map(({set,puzzles},index)=>{
    const base=canonicalSetId(set)||('set-'+index);let id=base,n=2;
    while(usedSetIds.has(id))id=base+'~'+n++;
    usedSetIds.add(id);return {set,puzzles,id};
  });
  const embedded={
    storageNamespace:PUBLISHED_STORAGE_NAMESPACE,
    firstLaunchId:uid(),
    playerName:State.playerName||undefined,
    colorblind:!!State.colorblind,
    showElementSequences:!!State.showElementSequences,
    soundEnabled:!!State.soundEnabled,
    sets:catalog.map(({set,id})=>({id,name:set.name,createdAt:set.createdAt||Date.now()})),
    puzzles:catalog.flatMap(({puzzles,id})=>puzzles.map(p=>portableWebAppPuzzle(p,id)))
  };
  // Escaping '<' prevents script-closing text in a puzzle or set name from
  // terminating the inline script in the generated app.
  const json=JSON.stringify(embedded).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const start='/*__LIGHTYARD_EMBED_START__*/',end='/*__LIGHTYARD_EMBED_END__*/';
  const startAt=SOURCE_APP_HTML.indexOf(start),endAt=SOURCE_APP_HTML.indexOf(end,startAt+start.length);
  if(startAt<0||endAt<0){alert('This copy of Lightyard could not prepare a standalone app.');return false;}
  const html=SOURCE_APP_HTML.slice(0,startAt+start.length)+' '+json+' '+SOURCE_APP_HTML.slice(endAt);
  downloadTextFile(html,'lightyard-web-app.html','text/html');
  return true;
}
function saveAsWebApp(){
  const backdrop=document.createElement('div');backdrop.className='dialog-backdrop';
  const dialog=document.createElement('div');dialog.className='dialog';
  dialog.innerHTML='<h3>Save as Web App</h3><label class="checkline"><input id="webAppIncludeUnsolved" type="checkbox" checked> Include unsolved puzzles</label><p style="font-size:12px;color:var(--dim);line-height:1.45;margin:8px 0 14px;">When unchecked, only puzzles with a saved solved solution are included. Saved solutions themselves are never included.</p><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn solid" data-act="save">Save Web App</button></div>';
  backdrop.appendChild(dialog);document.body.appendChild(backdrop);
  const close=()=>backdrop.remove();
  dialog.querySelector('[data-act=cancel]').addEventListener('click',close);
  backdrop.addEventListener('click',event=>{if(event.target===backdrop)close();});
  dialog.querySelector('[data-act=save]').addEventListener('click',()=>{
    if(downloadWebApp(dialog.querySelector('#webAppIncludeUnsolved').checked))close();
  });
  setTimeout(()=>dialog.querySelector('#webAppIncludeUnsolved').focus(),0);
}
function slugify(s){
  return (String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')) || 'untitled';
}

function puzzleExportData(puzzle){
  return {
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'puzzle',
    exportedAt: Date.now(),
    puzzle: portablePuzzle(puzzle,canonicalSetId(findSetByRuntimeId(puzzle.setId)))
  };
}
function exportPuzzle(puzzle){
  downloadJSON(puzzleExportData(puzzle), slugify(puzzle.name)+'.lightyard-puzzle.json');
}
function solutionExportData(solution){
  const puzzle = puzzleForSolution(solution);
  return {
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'solution',
    exportedAt: Date.now(),
    setId:puzzle?canonicalSetId(findSetByRuntimeId(puzzle.setId)):null,
    setName:puzzle?findSetByRuntimeId(puzzle.setId)?.name||null:null,
    puzzle: puzzle ? portablePuzzle(puzzle,canonicalSetId(findSetByRuntimeId(puzzle.setId))) : null,
    solution: JSON.parse(JSON.stringify(solution))
  };
}
function exportSolution(solution){
  const puzzle = puzzleForSolution(solution);
  downloadJSON(solutionExportData(solution), slugify((puzzle?puzzle.name+'-':'')+solution.name)+'.lightyard-solution.json');
}
function puzzleSolutionsExportData(puzzle){
  const solutions = solutionsForPuzzle(puzzle);
  return {
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'solutions',
    exportedAt: Date.now(),
    setId:canonicalSetId(findSetByRuntimeId(puzzle.setId)),
    setName:findSetByRuntimeId(puzzle.setId)?.name||null,
    puzzle: portablePuzzle(puzzle,canonicalSetId(findSetByRuntimeId(puzzle.setId))),
    solutions: JSON.parse(JSON.stringify(solutions))
  };
}
function exportAllSolutions(puzzle){
  downloadJSON(puzzleSolutionsExportData(puzzle), slugify(puzzle.name)+'-solutions.json');
}

// Imports receive fresh ids and must be playable by this version of Lightyard.
// Reject malformed pieces rather than saving invisible or unsafe board data.
function sanitizePuzzleData(raw, setId){
  if(!raw || typeof raw!=='object'||Array.isArray(raw)) throw new Error('missing puzzle data');
  if(!Number.isInteger(raw.rows)||raw.rows<5||raw.rows>15||!Number.isInteger(raw.cols)||raw.cols<5||raw.cols>11)throw new Error('puzzle dimensions must be 5–15 rows by 5–11 columns');
  if(!Array.isArray(raw.elements)||raw.elements.length>raw.rows*raw.cols)throw new Error('invalid puzzle elements');
  const rows=raw.rows,cols=raw.cols;
  const elements=sanitizeBoardElements(raw.elements,rows,cols);
  const goal=embeddedPuzzleGoal(raw);
  if((raw.goalElements!=null||raw.goalTicks!=null)&&!goal)throw new Error('invalid puzzle goal');
  return {
    id: uid(),
    setId: setId,
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Puzzle',
    rows, cols,
    createdAt: Date.now(),
    elements,
    strict: !!raw.strict,
    strictCrystals: !!raw.strictCrystals,
    noCollisions: !!raw.noCollisions,
    noPrisms: raw.noPrisms!=null ? !!raw.noPrisms : !!raw.mirrorsOnly,
    noHalfMirrors: !!raw.noHalfMirrors,
    includeMirrorColors: !!raw.includeMirrorColors,
    introText: raw.introText==null ? '' : String(raw.introText),
    ...(goal?{goalElements:goal.elements,goalTicks:goal.ticks}:{})
  };
}
function sanitizeBoardElements(elements,rows,cols){
  const occupied=new Set();
  return elements.map(el=>{
    const copy=sanitizeElementData(el,true);
    if(copy.r>=rows||copy.c>=cols)throw new Error(`element at (${copy.r},${copy.c}) is outside the grid`);
    const key=copy.r+','+copy.c;
    if(occupied.has(key))throw new Error(`more than one element at (${copy.r},${copy.c})`);
    occupied.add(key);return copy;
  });
}
function sanitizeElementData(el,strict=false){
  if(strict){
    if(!el||typeof el!=='object'||Array.isArray(el)||!Number.isInteger(el.r)||!Number.isInteger(el.c)||el.r<0||el.c<0)throw new Error('an element has invalid coordinates');
    const type=el.type==='crystalColored'?'crystal':el.type;
    if(!['emitter','receiver','mirrorDiag','mirrorHalf','crystal','transformer','prism'].includes(type))throw new Error('unknown element type');
    if(type==='emitter'||type==='receiver'){
      // The editor permits empty queues and no selected directions. Preserve
      // those designs on import, including inactive emitters and receivers.
      if(!Array.isArray(el.colors)||el.colors.length>MAX_PACKET_SEQUENCE||!el.colors.every(c=>Number.isInteger(c)&&c>=1&&c<=7))throw new Error('invalid packet sequence');
      if(!Array.isArray(el.dirs)||!el.dirs.every(d=>DIRS.includes(d)))throw new Error('invalid emitter or receiver directions');
    }
    if(type==='mirrorDiag'&&!['NE_SW','NW_SE'].includes(el.orientation))throw new Error('invalid mirror orientation');
    if(type==='mirrorHalf'&&el.facing!=null&&!['NW','NE','SE','SW'].includes(el.facing))throw new Error('invalid half-mirror facing');
    if(el.mirrorColor!=null&&(!['mirrorDiag','mirrorHalf'].includes(type)||!Number.isInteger(el.mirrorColor)||el.mirrorColor<1||el.mirrorColor>7))throw new Error('invalid mirror color');
    if(type==='prism'&&(!DIRS.includes(el.base)||(el.seq!=null&&(!Array.isArray(el.seq)||el.seq.length>3||!el.seq.every(d=>d==null||DIRS.includes(d))))))throw new Error('invalid prism facing sequence');
    if(type==='transformer'&&!['up','down'].includes(el.direction))throw new Error('invalid transformer direction');
    if(type==='crystal'&&(el.filterColor!=null&&el.filterColor!==COL.K&&(!Number.isInteger(el.filterColor)||el.filterColor<1||el.filterColor>7)))throw new Error('invalid crystal filter');
    if(type==='crystal'&&el.maxHits!=null&&el.maxHits!=='inf'&&(!Number.isInteger(el.maxHits)||el.maxHits<1||el.maxHits>99))throw new Error('invalid crystal durability');
  }
  if(!el || typeof el!=='object' || typeof el.type!=='string') return null;
  if(!Number.isInteger(el.r) || !Number.isInteger(el.c)||el.r<0||el.c<0) return null;
  if(el.type==='wood') return null;
  const copy = JSON.parse(JSON.stringify(el));
  delete copy.fixed; // runtime-only marker, reassigned by buildWorkingGrid
  normalizeCrystalType(copy); // 'crystalColored' from an older export folds into 'crystal'
  normalizeHalfMirrorData(copy);
  normalizeMirrorColor(copy);
  normalizePacketSequence(copy);
  return copy;
}
function normalizePacketSequence(el){
  if(!el || (el.type!=='emitter' && el.type!=='receiver') || !Array.isArray(el.colors))return false;
  if(el.colors.length<=MAX_PACKET_SEQUENCE)return false;
  el.colors=el.colors.slice(0,MAX_PACKET_SEQUENCE);
  return true;
}
// Clear and colored crystals used to be two separate element types; they're
// now one 'crystal' type with filterColor null (clear) or a color. Anything
// still carrying the old type name — from localStorage or an older export —
// gets folded in here rather than breaking.
function normalizeCrystalType(el){
  if(el && el.type==='crystalColored'){ el.type='crystal'; }
  if(el && el.type==='crystal'){
    if(el.maxHits==null) el.maxHits='inf';
    else if(el.maxHits!=='inf') el.maxHits=clamp(parseInt(el.maxHits)||1,1,99);
  }
  return el;
}
// Half-mirrors were originally stored as a diagonal plus an upper/lower
// reflective side and an optional two-state switch. Convert that model to a
// corner facing and a prism-style four-slot program as old saves are loaded.
function normalizeHalfMirrorData(el){
  if(!el || el.type!=='mirrorHalf') return el;
  const corners=['NW','NE','SE','SW'];
  const facing=corners.includes(el.facing) ? el.facing : legacyHalfMirrorFacing(el);
  let seq=Array.isArray(el.seq) ? el.seq.slice(0,3) : null;
  if(!seq && el.switching){
    const oldNext=(el.reflectiveSide||'upper')==='upper'
      ? (facing==='NW'?'NE':'NW')
      : (facing==='SE'?'SW':'SE');
    seq=[oldNext,null,null];
  }
  el.facing=facing;
  el.seq=(seq||[null,null,null]).map(v=>corners.includes(v)?v:null);
  delete el.orientation; delete el.reflectiveSide; delete el.switching;
  return el;
}
function sanitizeSolutionData(raw, puzzleRef){
  if(!raw || typeof raw!=='object'||Array.isArray(raw)) throw new Error('missing solution data');
  const puzzle=typeof puzzleRef==='object'?puzzleRef:findPuzzleByRuntimeId(puzzleRef)||State.puzzles.find(p=>p.id===puzzleRef);
  if(!puzzle)throw new Error('solution has no matching puzzle');
  if(!Array.isArray(raw.elements)||raw.elements.length>15*11)throw new Error('invalid solution elements');
  // A pasted attempt may come from a larger puzzle. Validate its coordinates,
  // then let fitSolutionToPuzzle remove controls outside this destination.
  const elements=sanitizeBoardElements(raw.elements,15,11);
  const solved=raw.status==='solved'&&typeof raw.puzzleHash==='string'&&raw.puzzleHash===puzzleConfigurationHash(puzzle);
  const puzzleId=puzzle?canonicalPuzzleId(puzzle):puzzleRef;
  const solution = {
    id: uid(),
    puzzleId,
    puzzleHash:puzzleConfigurationHash(puzzle),
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Solution',
    elements,
    status: solved ? 'solved' : 'in-progress',
    createdAt: Date.now()
  };
  if(solved && raw.ticksToSolve!=null && Number.isFinite(Number(raw.ticksToSolve))){ solution.ticksToSolve=Math.max(0,Math.floor(Number(raw.ticksToSolve))); }
  if(raw.onlineSource&&typeof raw.onlineSource==='object'&&typeof raw.onlineSource.player==='string'&&typeof raw.onlineSource.solutionId==='string'){
    const source=raw.onlineSource;solution.onlineSource={api:String(source.api||'').slice(0,300),solutionId:source.solutionId.slice(0,80),puzzleHash:String(source.puzzleHash||'').slice(0,80),player:source.player.slice(0,80),playerId:typeof source.playerId==='string'?source.playerId.slice(0,80):null,importedAt:Number(source.importedAt)||Date.now()};
  }
  enforcePuzzleSolutionRules(puzzle,solution);
  fitSolutionToPuzzle(puzzle,solution);
  return solution;
}
function enforcePuzzleSolutionRules(puzzle,solution){
  if(!puzzle || !solution) return false;
  const disallowed=new Set();
  if(puzzle.noPrisms)disallowed.add('prism');
  if(puzzle.noHalfMirrors)disallowed.add('mirrorHalf');
  const before=(solution.elements||[]).length;
  solution.elements=(solution.elements||[]).filter(el=>!disallowed.has(el.type));
  let recolored=false;
  if(!puzzle.includeMirrorColors){
    for(const el of solution.elements)if(mirrorColorFor(el)!=null){delete el.mirrorColor;recolored=true;}
  }
  if(solution.elements.length===before&&!recolored) return false;
  solution.status='in-progress';
  delete solution.ticksToSolve;
  return true;
}
function fitSolutionToPuzzle(puzzle,solution){
  if(!puzzle||!solution)return 0;
  const occupied=new Set((puzzle.elements||[]).map(el=>`${el.r},${el.c}`));
  const kept=[];
  let removed=0;
  for(const element of solution.elements||[]){
    const fits=Number.isInteger(element.r)&&Number.isInteger(element.c)&&
      element.r>=0&&element.c>=0&&element.r<puzzle.rows&&element.c<puzzle.cols;
    const key=`${element.r},${element.c}`;
    if(!fits||occupied.has(key)){removed++;continue;}
    occupied.add(key);kept.push(element);
  }
  solution.elements=kept;
  if(removed){solution.status='in-progress';delete solution.ticksToSolve;delete solution.solvedAt;}
  return removed;
}
function reconcilePuzzleSolutions(puzzle){
  if(!puzzle)return false;
  const hash=puzzleConfigurationHash(puzzle);
  let changed=false;
  for(const solution of State.solutions){
    if(solution.puzzleId!==canonicalPuzzleId(puzzle))continue;
    const designChanged=solution.puzzleHash!==hash;
    const removed=fitSolutionToPuzzle(puzzle,solution);
    const restricted=enforcePuzzleSolutionRules(puzzle,solution);
    if(designChanged||removed||restricted){
      solution.status='in-progress';delete solution.ticksToSolve;delete solution.solvedAt;
      solution.puzzleHash=hash;changed=true;
    }
  }
  return changed;
}

function targetSetForQuickImport(){
  // Used for imports that don't carry their own set context (a single
  // puzzle or solution file) — land in whichever set is currently open, or
  // fall back to a catch-all set rather than asking, since this path is
  // meant to be quick and low-friction for a single item.
  if(State.currentSetId && State.sets.some(s=>s.id===State.currentSetId)) return State.currentSetId;
  let s = State.sets.find(x=>x.name==='Imported');
  if(!s){ s = {id:uid(), name:'Imported', createdAt:Date.now()}; State.sets.push(s); }
  return s.id;
}

function importPuzzlePayload(data){
  const puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
  State.puzzles.push(puzzle);
  persistData();
  return puzzle;
}
function importSolutionPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
  }
  if(!data.solution) throw new Error('this file has no solution data in it');
  const puzzleId = puzzle ? puzzle.id : (typeof data.solution.puzzleId==='string' ? data.solution.puzzleId : null);
  if(!puzzleId) throw new Error('this solution file has no puzzle attached to it');
  const solution = sanitizeSolutionData(data.solution, puzzle||puzzleId);
  State.solutions.push(solution);
  persistData();
  return {puzzle, solution};
}
function importSolutionsPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
  }
  const puzzleId = puzzle ? puzzle.id : (typeof data.puzzleId==='string' ? data.puzzleId : null);
  if(!puzzleId) throw new Error('this solutions file has no puzzle attached to it');
  const raws = Array.isArray(data.solutions) ? data.solutions : [];
  const imported = [];
  for(const raw of raws){
    const solution = sanitizeSolutionData(raw, puzzle||puzzleId);
    State.solutions.push(solution);
    imported.push(solution);
  }
  persistData();
  return {puzzle, solutions: imported};
}
