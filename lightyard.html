/* ---------- Clipboard sharing ---------- */
async function writeClipboardText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(error){}
  }
  const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');
  area.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';document.body.appendChild(area);area.select();
  let copied=false;try{copied=!!document.execCommand('copy');}catch(error){}area.remove();return copied;
}
async function copyLightyardData(data,label){
  const copied=await writeClipboardText(JSON.stringify(statelessClipboardData(data),null,2));
  alert(copied?`${label} copied to the clipboard.`:`Could not copy ${label.toLowerCase()} automatically. Clipboard access may be blocked in this browser.`);
}
function statelessClipboardData(data){
  const copy=JSON.parse(JSON.stringify(data));
  const reset=solution=>{
    if(!solution||typeof solution!=='object')return;
    solution.status='in-progress';delete solution.ticksToSolve;delete solution.solvedAt;
  };
  if(copy.kind==='solution')reset(copy.solution);
  if(copy.kind==='solutions'||copy.kind==='setSolutions')for(const solution of copy.solutions||[])reset(solution);
  if(copy.kind==='allSolutions')for(const solution of copy.solutions||[])reset(solution);
  return copy;
}
function importLightyardText(text,scope){
  let data;
  try{data=JSON.parse(text);}catch(error){alert('The clipboard does not contain valid JSON.');return;}
  if(!data||data.schema!=='lightyard'||!data.kind){alert('The clipboard does not contain a Lightyard export.');return;}
  handleImportedData(data,scope);
}
let clipboardPastePending=false;
function dismissClipboardNotice(){document.querySelector('.clipboard-notice')?.remove();}
function showClipboardNotice(scope,label,message){
  dismissClipboardNotice();
  const notice=document.createElement('div');notice.className='clipboard-notice';notice.setAttribute('role','status');
  const text=document.createElement('span');text.textContent=message;notice.appendChild(text);
  const manual=document.createElement('button');manual.type='button';manual.className='btn small';manual.textContent='Paste manually';
  manual.addEventListener('click',()=>{dismissClipboardNotice();showClipboardPasteDialog(scope,label);});notice.appendChild(manual);
  const dismiss=document.createElement('button');dismiss.type='button';dismiss.className='btn small';dismiss.textContent='×';dismiss.setAttribute('aria-label','Dismiss paste message');
  dismiss.addEventListener('click',dismissClipboardNotice);notice.appendChild(dismiss);document.body.appendChild(notice);
}
function showClipboardPasteDialog(scope,label){
  const existing=document.querySelector('.clipboard-paste-dialog');
  if(existing){existing.querySelector('textarea').focus();return;}
  const backdrop=document.createElement('div');backdrop.className='dialog-backdrop';
  const dialog=document.createElement('div');dialog.className='dialog clipboard-paste-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label',`Paste ${label}`);
  dialog.innerHTML=`<h3>Paste ${escapeHtml(label)}</h3><p style="font-size:12px;color:var(--dim);line-height:1.45;">Use your browser’s Paste command in the field below. Your data will import immediately.</p><textarea aria-label="Lightyard data" placeholder="Paste here"></textarea><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button></div>`;
  backdrop.appendChild(dialog);document.body.appendChild(backdrop);
  const area=dialog.querySelector('textarea');
  const close=()=>backdrop.remove();dialog.querySelector('[data-act=cancel]').addEventListener('click',close);
  area.addEventListener('paste',event=>{
    const text=event.clipboardData?.getData('text/plain');
    if(text==null)return;event.preventDefault();
    if(!text.trim())return;
    close();importLightyardText(text,scope);
  });
  // Some input methods insert clipboard text without dispatching a paste event.
  area.addEventListener('input',()=>{
    try{const data=JSON.parse(area.value);if(!data||data.schema!=='lightyard'||!data.kind)return;}catch(error){return;}
    const text=area.value;close();importLightyardText(text,scope);
  });
  dialog.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();close();}});
  backdrop.addEventListener('click',event=>{if(event.target===backdrop)close();});area.focus();
}
async function pasteLightyardData(scope,label){
  // Never start competing reads while Safari's native Paste prompt is open.
  if(clipboardPastePending)return;
  const existing=document.querySelector('.clipboard-paste-dialog');
  if(existing){existing.querySelector('textarea').focus();return;}
  dismissClipboardNotice();
  if(navigator.clipboard&&typeof navigator.clipboard.readText==='function'){
    clipboardPastePending=true;
    let text;
    try{
      // Keep the read in the menu click's user activation, before any await.
      text=await navigator.clipboard.readText();
    }catch(error){
      // Dismissing the browser's prompt is a cancellation, not a request to
      // open a second dialog. Manual pasting is an explicit fallback only.
      showClipboardNotice(scope,label,'Paste wasn’t completed. Try again or paste manually.');return;
    }finally{clipboardPastePending=false;}
    if(text&&text.trim())importLightyardText(text,scope);
    else showClipboardNotice(scope,label,'The clipboard contains no text to paste.');
    return;
  }
  // Browsers without clipboard reads still support the native paste event.
  showClipboardPasteDialog(scope,label);
}

/* ---------- Sets: import ---------- */
// Every set-bearing export kind (and the older, name-less bulk "puzzles"
// export from a previous version) normalizes to the same shape: a list of
// {name, puzzles, solutions} bundles, so one dialog and one apply routine
// handles all of them.
function normalizeIncomingSets(data){
  if(data.kind==='set'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: [] }];
  }
  if(data.kind==='sets'){
    return (data.sets||[]).map(s=>({ name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: [] }));
  }
  if(data.kind==='setSolutions'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: data.solutions||[] }];
  }
  if(data.kind==='allSolutions'){
    return (data.sets||[]).map(s=>{
      const ids = new Set((s.puzzles||[]).map(p=>p.id));
      return { name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: (data.solutions||[]).filter(sol=>ids.has(sol.puzzleId)) };
    });
  }
  if(data.kind==='puzzles'){
    return [{ name: 'Imported Puzzles', puzzles: data.puzzles||[], solutions: [] }];
  }
  return [];
}
function uniqueSetName(name){
  const base = name || 'Imported Set';
  if(!State.sets.some(s=>s.name===base)) return base;
  let n=2;
  while(State.sets.some(s=>s.name===base+' ('+n+')')) n++;
  return base+' ('+n+')';
}
// Builds and shows the New / Replace / Merge choice dialog for one or more
// incoming sets, then calls onConfirm with a parallel array of
// {mode:'new'|'replace'|'merge', targetSetId} once the user confirms.
function showImportSetsDialog(incomingSets, onConfirm){
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.style.width = 'min(480px, 92vw)';
  dialog.style.maxHeight = '80vh';
  dialog.style.overflowY = 'auto';
  const h = document.createElement('h3');
  h.textContent = incomingSets.length>1 ? 'Import '+incomingSets.length+' sets' : 'Import set';
  dialog.appendChild(h);
  const rowState = incomingSets.map((s,i)=>{
    const match = State.sets.find(x=>x.name===s.name);
    const solTxt = s.solutions.length ? ', '+s.solutions.length+' solution'+(s.solutions.length!==1?'s':'') : '';
    const row = document.createElement('div');
    row.className='card'; row.style.marginBottom='10px'; row.style.padding='10px';
    const p = document.createElement('p');
    p.style.margin='0 0 8px'; p.style.fontSize='13px';
    p.innerHTML = '<strong>'+escapeHtml(s.name)+'</strong> — '+s.puzzles.length+' puzzle'+(s.puzzles.length!==1?'s':'')+solTxt;
    row.appendChild(p);
    const modeSel = document.createElement('select');
    let opts = '<option value="new">Add as a new set'+(match?' (renamed to avoid a name clash)':'')+'</option>';
    if(match) opts += '<option value="replace">Replace existing set "'+escapeAttr(s.name)+'"</option>';
    opts += '<option value="merge">Add its puzzles to an existing set…</option>';
    modeSel.innerHTML = opts;
    if(match) modeSel.value = 'replace';
    row.appendChild(modeSel);
    const mergeSel = document.createElement('select');
    mergeSel.style.marginTop='6px'; mergeSel.style.display='none';
    mergeSel.innerHTML = State.sets.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join('');
    row.appendChild(mergeSel);
    modeSel.addEventListener('change', ()=>{ mergeSel.style.display = modeSel.value==='merge' ? 'block' : 'none'; });
    dialog.appendChild(row);
    return {modeSel, mergeSel};
  });
  const btnRow = document.createElement('div');
  btnRow.className='rowbtns';
  const cancelBtn=document.createElement('button'); cancelBtn.className='btn'; cancelBtn.textContent='Cancel';
  const confirmBtn=document.createElement('button'); confirmBtn.className='btn solid'; confirmBtn.textContent='Import';
  btnRow.appendChild(cancelBtn); btnRow.appendChild(confirmBtn);
  dialog.appendChild(btnRow);
  backdrop.appendChild(dialog);
  document.body.appendChild(backdrop);
  cancelBtn.addEventListener('click', ()=>backdrop.remove());
  confirmBtn.addEventListener('click', ()=>{
    const choices = rowState.map(({modeSel,mergeSel})=>({ mode: modeSel.value, targetSetId: mergeSel.value }));
    backdrop.remove();
    onConfirm(choices);
  });
}
function applyIncomingSets(incomingSets, choices){
  let totalPuzzles=0, totalSolutions=0;
  const replacedPuzzles=[];
  for(let i=0;i<incomingSets.length;i++){
    const s = incomingSets[i];
    const choice = choices[i];
    let targetSetId;
    if(choice.mode==='replace'){
      const existing = State.sets.find(x=>x.name===s.name);
      targetSetId = existing.id;
      replacedPuzzles.push(...State.puzzles.filter(p=>p.setId===targetSetId));
      State.puzzles = State.puzzles.filter(p=>p.setId!==targetSetId);
    } else if(choice.mode==='merge'){
      targetSetId = choice.targetSetId;
    } else {
      const newSet = {id:uid(), name: uniqueSetName(s.name), createdAt:Date.now()};
      State.sets.push(newSet);
      targetSetId = newSet.id;
    }
    const idMap = new Map();
    for(const rawP of s.puzzles){
      const puzzle = sanitizePuzzleData(rawP, targetSetId);
      if(rawP && typeof rawP.id==='string') idMap.set(rawP.id, puzzle);
      State.puzzles.push(puzzle);
      totalPuzzles++;
    }
    for(const rawSol of s.solutions){
      const newPuzzle = idMap.get(rawSol.puzzleId);
      if(!newPuzzle) continue; // solution's puzzle wasn't part of this bundle
      const solution = sanitizeSolutionData(rawSol, newPuzzle);
      State.solutions.push(solution);
      totalSolutions++;
    }
  }
  if(replacedPuzzles.length){
    State.solutions=State.solutions.filter(sol=>!replacedPuzzles.some(p=>puzzleMatchesSolution(p,sol))||allPuzzles().some(p=>puzzleMatchesSolution(p,sol)));
  }
  persistSets(); persistPuzzles(); persistSolutions();
  alert('Imported '+totalPuzzles+' puzzle'+(totalPuzzles!==1?'s':'')+
    (totalSolutions?' and '+totalSolutions+' solution'+(totalSolutions!==1?'s':''):'')+
    ' across '+incomingSets.length+' set'+(incomingSets.length!==1?'s':'')+'.');
  State.selectedCell=null; State.selectedTool=null;
  State.currentSetId=null; State.currentPuzzleId=null; State.currentSolutionId=null;
  State.screen='setList';
  renderScreen();
}

function sourcePuzzleMatches(raw, local){
  if(!raw || !local) return false;
  if(typeof raw.id==='string' && raw.id===canonicalPuzzleId(local) && puzzleConfigurationHash(raw)===puzzleConfigurationHash(local)) return true;
  return String(raw.name||'')===String(local.name||'') &&
    Number(raw.rows)===Number(local.rows) && Number(raw.cols)===Number(local.cols) &&
    puzzleConfigurationHash(raw)===puzzleConfigurationHash(local);
}
function solutionBundlesFromFile(data){
  if(data.kind==='solution')return [{name:data.setName||null,setId:data.setId||null,puzzles:data.puzzle?[data.puzzle]:[],solutions:data.solution?[data.solution]:[]}];
  if(data.kind==='solutions')return [{name:data.setName||null,setId:data.setId||null,puzzles:data.puzzle?[data.puzzle]:[],solutions:Array.isArray(data.solutions)?data.solutions:[]}];
  return normalizeIncomingSets(data).map((s,i)=>({
    name:(data.kind==='allSolutions'?data.sets[i]?.name:data.setName)||null,
    setId:(data.kind==='allSolutions'?data.sets[i]?.id:data.setId)||null,
    puzzles:s.puzzles||[],solutions:s.solutions||[]
  }));
}
function importedSolutionCandidates(bundle,allowed,scope){
  // A selected set/puzzle is an explicit destination, including after a rename.
  if(scope.kind!=='allSolutions')return allowed;
  const sourceSetIds=new Set([bundle.setId,...bundle.puzzles.map(p=>p?.setId)]
    .filter(id=>typeof id==='string'&&id));
  let sets=allSets().filter(set=>sourceSetIds.has(canonicalSetId(set)));
  if(!sets.length&&bundle.name)sets=allSets().filter(set=>set.name===bundle.name);
  if(sets.length===1)return allowed.filter(p=>p.setId===sets[0].id);
  // Never choose among duplicate set names or fall back from a named source
  // set to an unrelated collection containing a similar puzzle.
  if(sets.length||bundle.name||bundle.setId)return [];
  // Older individual-solution exports have no set name or stable set ID.
  // They can still use a unique puzzle ID/name match across the catalog.
  return allowed;
}
function matchImportedSolutionPuzzle(rawSol,rawPuzzle,candidates){
  const byId=candidates.filter(p=>canonicalPuzzleId(p)===rawSol.puzzleId);
  if(byId.length)return byId.length===1?byId[0]:null;
  if(!rawPuzzle||typeof rawPuzzle.name!=='string')return null;
  const byName=candidates.filter(p=>p.name===rawPuzzle.name);
  const exact=byName.filter(p=>puzzleConfigurationHash(rawPuzzle)===puzzleConfigurationHash(p));
  if(exact.length)return exact.length===1?exact[0]:null;
  // A unique name can identify an edited design. Sanitization marks any
  // nonmatching configuration in progress and removes pieces that no longer fit.
  return byName.length===1?byName[0]:null;
}
function importScopedSolutions(data,scope){
  const allowed = scope.kind==='puzzleSolutions'
    ? allPuzzles().filter(p=>p.id===scope.puzzleId)
    : scope.kind==='setSolutions'
      ? allPuzzles().filter(p=>p.setId===scope.setId)
      : allPuzzles();
  let imported=0,trimmed=0,skipped=0,firstImported=null;
  if(scope.kind==='puzzleSolutions'&&scope.acceptAnyPuzzleSource){
    const target=allowed[0];
    if(target){
      for(const bundle of solutionBundlesFromFile(data))for(const rawSol of bundle.solutions||[]){
        const freshRaw={...rawSol,status:'in-progress'};delete freshRaw.ticksToSolve;delete freshRaw.solvedAt;
        const solution=sanitizeSolutionData(freshRaw,target);
        trimmed+=fitSolutionToPuzzle(target,solution);
        State.solutions.push(solution);imported++;
        if(!firstImported)firstImported=solution;
      }
    }
    persistSolutions();
    alert(imported
      ? `Pasted ${imported} solution${imported!==1?'s':''} into this puzzle${trimmed?`, skipping ${trimmed} control${trimmed!==1?'s':''} that did not fit`:''}.`
      : 'The clipboard did not contain any solutions.');
    if(scope.openFirstSolution&&firstImported){openPuzzleBoard(target,firstImported.id);return;}
    renderScreen();return;
  }
  for(const bundle of solutionBundlesFromFile(data)){
    const rawById=new Map((bundle.puzzles||[]).filter(Boolean).map(p=>[p.id,p]));
    const candidates=importedSolutionCandidates(bundle,allowed,scope);
    for(const rawSol of bundle.solutions||[]){
      const rawPuzzle=rawById.get(rawSol.puzzleId) || null;
      const target=matchImportedSolutionPuzzle(rawSol,rawPuzzle,candidates);
      if(!target){skipped++;continue;}
      const solution=sanitizeSolutionData(rawSol,target);
      trimmed+=fitSolutionToPuzzle(target,solution);
      State.solutions.push(solution);
      imported++;
      if(!firstImported)firstImported=solution;
    }
  }
  persistSolutions();
  alert(imported
    ? `Imported ${imported} solution${imported!==1?'s':''}.${skipped?` Skipped ${skipped} solution${skipped!==1?'s':''} without a unique puzzle match in the target set.`:''}`
    : scope.kind==='allSolutions'
      ? 'No solutions matched the source sets and puzzle names or IDs. Use the destination set menu if its name differs from the export.'
      : 'No solutions matched a unique puzzle name or ID in the selected scope.');
  if(scope.openFirstSolution&&firstImported){openPuzzleBoard(allowed[0],firstImported.id);return;}
  if(!scope.returnToBoard){ State.screen='setList'; State.currentPuzzleId=null; State.currentSolutionId=null; }
  renderScreen();
}
function puzzleGroupsFromImport(data){
  const grouped=[];
  const ungrouped=[];
  if(data.kind==='set'||data.kind==='sets'||data.kind==='setSolutions'||data.kind==='allSolutions'){
    for(const bundle of normalizeIncomingSets(data)){
      if((bundle.puzzles||[]).length)grouped.push({name:bundle.name||'Imported Set',puzzles:bundle.puzzles});
    }
  }else if(data.kind==='puzzle'&&data.puzzle){
    ungrouped.push(data.puzzle);
  }else if(data.kind==='puzzles'){
    ungrouped.push(...(Array.isArray(data.puzzles)?data.puzzles:[]));
  }else if((data.kind==='solution'||data.kind==='solutions')&&data.puzzle){
    ungrouped.push(data.puzzle);
  }
  return {grouped,ungrouped};
}
function puzzleBundlesFromData(data){
  if(data.kind==='puzzle')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:[]}];
  if(data.kind==='solution')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:data.solution?[data.solution]:[]}];
  if(data.kind==='solutions')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:Array.isArray(data.solutions)?data.solutions:[]}];
  return normalizeIncomingSets(data);
}
function puzzleImportEntries(data){
  const entries=[];
  for(const bundle of puzzleBundlesFromData(data)){
    const puzzles=(bundle.puzzles||[]).filter(Boolean);
    for(const rawPuzzle of puzzles){
      let solutions=(bundle.solutions||[]).filter(solution=>solution&&solution.puzzleId===rawPuzzle.id);
      if(puzzles.length===1&&!solutions.length)solutions=(bundle.solutions||[]).filter(Boolean);
      entries.push({groupName:bundle.name||null,rawPuzzle,solutions});
    }
  }
  return entries;
}
function showPuzzleOverlapDialog(overlapCount,onChoice){
  const backdrop=document.createElement('div');backdrop.className='dialog-backdrop';
  const dialog=document.createElement('div');dialog.className='dialog';
  dialog.innerHTML=`<h3>Existing puzzles found</h3><p>${overlapCount} imported puzzle${overlapCount!==1?'s':''} overlap${overlapCount===1?'s':''} with puzzle${overlapCount===1?'':'s'} already in Lightyard.</p><p style="font-size:12px;color:var(--dim);line-height:1.45;">You can add their solutions to the existing puzzles, or create duplicate puzzle designs and attach the imported solutions to those copies.</p><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn" data-act="solutions">Import solutions only</button><button class="btn solid" data-act="duplicates">Create duplicate puzzles</button></div>`;
  backdrop.appendChild(dialog);document.body.appendChild(backdrop);
  const finish=choice=>{backdrop.remove();if(choice)onChoice(choice);};
  dialog.querySelector('[data-act=cancel]').addEventListener('click',()=>finish(null));
  dialog.querySelector('[data-act=solutions]').addEventListener('click',()=>finish('solutions'));
  dialog.querySelector('[data-act=duplicates]').addEventListener('click',()=>finish('duplicates'));
  backdrop.addEventListener('click',event=>{if(event.target===backdrop)finish(null);});
}
function applySolvePuzzleImport(entries,scope,overlapMode){
  let puzzlesAdded=0,solutionsAdded=0,trimmed=0,overlapsUsed=0;
  const groupSetIds=new Map();
  const setForEntry=entry=>{
    if(scope.kind==='solvePuzzlesIntoSet')return scope.setId;
    const key=entry.groupName||'__loose__';
    if(groupSetIds.has(key))return groupSetIds.get(key);
    if(!entry.groupName){
      const existing=State.sets.find(set=>set.name==='Added Puzzles');
      if(existing){groupSetIds.set(key,existing.id);return existing.id;}
    }
    const set={id:uid(),name:entry.groupName?uniqueSetName(entry.groupName):'Added Puzzles',createdAt:Date.now()};
    State.sets.push(set);groupSetIds.set(key,set.id);return set.id;
  };
  for(const entry of entries){
    let target=entry.overlap||null;
    if(target&&overlapMode==='solutions')overlapsUsed++;
    else{
      target=sanitizePuzzleData(entry.rawPuzzle,setForEntry(entry));
      State.puzzles.push(target);puzzlesAdded++;
    }
    for(const rawSolution of entry.solutions){
      const solution=sanitizeSolutionData(rawSolution,target);
      trimmed+=fitSolutionToPuzzle(target,solution);
      State.solutions.push(solution);solutionsAdded++;
    }
  }
  persistSets();persistPuzzles();persistSolutions();
  const parts=[];
  if(puzzlesAdded)parts.push(`${puzzlesAdded} puzzle${puzzlesAdded!==1?'s':''}`);
  if(solutionsAdded)parts.push(`${solutionsAdded} solution${solutionsAdded!==1?'s':''}`);
  if(overlapsUsed&&!solutionsAdded)parts.push(`no solutions for ${overlapsUsed} overlapping puzzle${overlapsUsed!==1?'s':''}`);
  alert(`Imported ${parts.join(' and ')||'no items'}${trimmed?`; skipped ${trimmed} control${trimmed!==1?'s':''} that did not fit`:''}.`);
  State.screen='setList';State.currentPuzzleId=null;State.currentSolutionId=null;State.selectedCell=null;State.selectedTool=null;
  renderScreen();
}
function importSolvePuzzles(data,scope){
  const entries=puzzleImportEntries(data);
  if(!entries.length){alert('That data did not contain any puzzles.');return;}
  const existing=allPuzzles().slice();
  for(const entry of entries)entry.overlap=existing.find(puzzle=>sourcePuzzleMatches(entry.rawPuzzle,puzzle))||null;
  const overlapCount=entries.filter(entry=>entry.overlap).length;
  if(overlapCount)showPuzzleOverlapDialog(overlapCount,mode=>applySolvePuzzleImport(entries,scope,mode));
  else applySolvePuzzleImport(entries,scope,'duplicates');
}
function importPuzzlesIntoSet(data,setId){
  const found=puzzleGroupsFromImport(data);
  const raws=found.grouped.flatMap(group=>group.puzzles).concat(found.ungrouped);
  for(const raw of raws) State.puzzles.push(sanitizePuzzleData(raw,setId));
  persistPuzzles();
  alert(raws.length
    ? `Imported ${raws.length} puzzle${raws.length!==1?'s':''}.`
    : 'That file did not contain any puzzles.');
  State.expandedSetIds.add(setId); State.screen='setList'; renderScreen();
}
function importCreateData(data){
  const found=puzzleGroupsFromImport(data);
  let imported=0;
  for(const group of found.grouped){
    const set={id:uid(),name:String(group.name||'Imported Set').slice(0,80),createdAt:Date.now()};
    State.sets.push(set);State.expandedSetIds.add(set.id);
    for(const raw of group.puzzles){State.puzzles.push(sanitizePuzzleData(raw,set.id));imported++;}
  }
  if(found.ungrouped.length){
    const set={id:uid(),name:'Added Puzzles',createdAt:Date.now()};
    State.sets.push(set);State.expandedSetIds.add(set.id);
    for(const raw of found.ungrouped){State.puzzles.push(sanitizePuzzleData(raw,set.id));imported++;}
  }
  if(!imported){alert('That file did not contain any puzzles.');return;}
  persistSets();persistPuzzles();
  alert(`Added ${imported} puzzle${imported!==1?'s':''}.`);
  State.selectedCell=null;State.selectedTool=null;State.currentSetId=null;State.currentPuzzleId=null;State.currentSolutionId=null;
  State.screen='setList';renderScreen();
}
function handleImportedData(data,scope){
  try{
    validateIncomingData(data,scope);
    if(scope&&scope.kind==='addCreateData'){
      importCreateData(data);
      return;
    }
    if(scope&&scope.kind==='sets'){
      const incoming=normalizeIncomingSets(data).filter(set=>(set.puzzles||[]).length);
      if(!incoming.length){alert('That export does not contain any puzzle sets.');return;}
      showImportSetsDialog(incoming,choices=>applyIncomingSets(incoming,choices));
      return;
    }
    if(scope&&(scope.kind==='addSolvePuzzles'||scope.kind==='solvePuzzlesIntoSet')){
      importSolvePuzzles(data,scope);
      return;
    }
    if(scope && (scope.kind==='allSolutions' || scope.kind==='setSolutions' || scope.kind==='puzzleSolutions')){
      importScopedSolutions(data,scope);
      return;
    }
    if(scope && scope.kind==='puzzlesIntoSet'){
      importPuzzlesIntoSet(data,scope.setId);
      return;
    }
    if(data.kind==='puzzle'){
      const puzzle = importPuzzlePayload(data);
      alert('Imported puzzle "'+puzzle.name+'".');
      State.currentSetId = puzzle.setId;
      State.selectedCell=null; State.selectedTool=null;
      State.screen='puzzleList';
      renderScreen();
    } else if(data.kind==='solution'){
      const {puzzle, solution} = importSolutionPayload(data);
      alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" and solution "'+solution.name+'".');
      setActiveMode('solve');
      State.currentPuzzleId = solution.puzzleId;
      const owner = puzzle || State.puzzles.find(p=>p.id===solution.puzzleId);
      if(owner) State.currentSetId = owner.setId;
      warnIfStrictPacketTotalsMismatch(owner);
      State.currentSolutionId = solution.id;
      State.selectedCell=null; State.selectedTool='mirrorDiag';
      State.screen='solutionEdit';
      renderScreen();
    } else if(data.kind==='solutions'){
      const {puzzle, solutions} = importSolutionsPayload(data);
      alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" with '+solutions.length+' solution'+(solutions.length!==1?'s':'')+'.');
      setActiveMode('solve');
      State.currentPuzzleId = solutions.length ? solutions[0].puzzleId : (puzzle ? puzzle.id : null);
      const owner = puzzle || State.puzzles.find(p=>p.id===State.currentPuzzleId);
      if(owner) State.currentSetId = owner.setId;
      warnIfStrictPacketTotalsMismatch(owner);
      State.currentSolutionId = solutions.length ? solutions[0].id : 'BLANK';
      State.selectedCell=null; State.selectedTool='mirrorDiag';
      State.screen='solutionEdit';
      renderScreen();
    } else if(data.kind==='set' || data.kind==='sets' || data.kind==='setSolutions' || data.kind==='allSolutions' || data.kind==='puzzles'){
      const incoming = normalizeIncomingSets(data).filter(s=>s.puzzles.length>0 || s.solutions.length>0);
      if(incoming.length===0){
        alert('That export has no puzzles to import.');
        return;
      }
      if(data.kind==='setSolutions' || data.kind==='allSolutions') setActiveMode('solve');
      showImportSetsDialog(incoming, (choices)=>applyIncomingSets(incoming, choices));
    } else {
      alert('Unrecognized Lightyard export type: "'+data.kind+'".');
    }
  } catch(error){
    alert('Could not import that data: '+error.message);
  }
}
function validateIncomingData(data,scope){
  if(data.schemaVersion!=null&&data.schemaVersion!==EXPORT_SCHEMA_VERSION)throw new Error('unsupported export version');
  const bundles=puzzleBundlesFromData(data);
  for(const bundle of bundles){
    if(!Array.isArray(bundle.puzzles)||!Array.isArray(bundle.solutions))throw new Error('invalid puzzle or solution list');
    const byId=new Map();
    for(const raw of bundle.puzzles){
      const checked=sanitizePuzzleData(raw,'validation');
      if(raw.id!=null)byId.set(raw.id,checked);
    }
    for(const raw of bundle.solutions){
      if(!raw||typeof raw!=='object')throw new Error('invalid solution data');
      const target=byId.get(raw.puzzleId)||
        (bundle.puzzles.length===1?byId.values().next().value:null)||
        (scope&&scope.puzzleId?findPuzzleByRuntimeId(scope.puzzleId):null)||
        allPuzzles().find(p=>canonicalPuzzleId(p)===raw.puzzleId);
      if(!target)throw new Error('solution has no matching puzzle');
      sanitizeSolutionData(raw,target);
    }
  }
}

function handleImportedFile(file,scope){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    if(!data || data.schema!=='lightyard' || !data.kind){
      alert('That file does not look like a Lightyard export.');
      return;
    }
    handleImportedData(data,scope);
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}

/* ---------- persistence ---------- */
function storageKey(kind){
  const ns=BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.storageNamespace;
  return ns?`lightyard_${ns}_${kind}`:`lightyard_${kind}`;
}
let storageWarningShown=false;
function showStorageFailure(error, overrideMessage){
  if(storageWarningShown)return;
  storageWarningShown=true;
  const banner=document.createElement('div');banner.className='storage-warning';banner.setAttribute('role','alert');
  const message=document.createElement('span');message.textContent=overrideMessage||'Lightyard could not save changes in this browser. Keep this page open and download a backup of your current puzzles and solutions.';
  const button=document.createElement('button');button.type='button';button.textContent='Download backup';
  button.addEventListener('click',()=>{
    const backup={schema:'lightyard',schemaVersion:EXPORT_SCHEMA_VERSION,kind:'allSolutions',exportedAt:Date.now(),
      sets:State.sets.map(set=>({name:set.name,puzzles:State.puzzles.filter(p=>p.setId===set.id).map(p=>portablePuzzle(p,set.id))})),
      solutions:JSON.parse(JSON.stringify(State.solutions))};
    downloadJSON(backup,'lightyard-recovery.json');
  });
  banner.append(message,button);document.body.appendChild(banner);
  console.error('Lightyard local save failed',error);
}
function readStorage(kind){try{return localStorage.getItem(storageKey(kind));}catch(error){showStorageFailure(error);return null;}}
function writeStorage(kind,value){
  try{localStorage.setItem(storageKey(kind),value);return true;}
  catch(error){showStorageFailure(error);return false;}
}
let lastPersistedDataRaw=null;
function persistData(){
  // One atomic browser write keeps sets, puzzles, and solutions together.
  // An older tab must not replace a newer tab's entire snapshot on its next edit.
  try{
    if(localStorage.getItem(storageKey('data'))!==lastPersistedDataRaw){
      showStorageFailure(new Error('Saved Lightyard data changed in another tab'),
        'Another Lightyard tab changed saved data. This tab cannot save without overwriting it. Download a backup of this tab before closing, then reload to see the latest saved data.');
      return false;
    }
  }catch(error){showStorageFailure(error);return false;}
  const raw=JSON.stringify({version:1,sets:State.sets,puzzles:State.puzzles,solutions:State.solutions});
  if(!writeStorage('data',raw))return false;
  lastPersistedDataRaw=raw;
  return true;
}
function migrateLegacyPublishedStorage(){
  if(!BUILT_IN_APP_DATA || BUILT_IN_APP_DATA.storageNamespace!==PUBLISHED_STORAGE_NAMESPACE)return;
  try{
    if(localStorage.getItem(storageKey('data'))!==null)return;
    const builtInIds=new Set(State.builtInPuzzles.map(canonicalPuzzleId));
    const candidates=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      const match=/^lightyard_(app-([a-z0-9]+)-[a-z0-9]+)_data$/.exec(key||'');
      if(!match)continue;
      let data;
      try{data=JSON.parse(localStorage.getItem(key));}catch(error){continue;}
      if(data?.version!==1||!Array.isArray(data.sets)||!Array.isArray(data.puzzles)||!Array.isArray(data.solutions))continue;
      const matches=data.solutions.filter(s=>s&&builtInIds.has(s.puzzleId)).length;
      candidates.push({namespace:match[1],time:parseInt(match[2],36)||0,data,matches});
    }
    // A shared puzzle ID identifies older exports of this catalog. If only
    // one old app exists here, also preserve its local work before a solution
    // has been made. Never guess among several unrelated, unmatched apps.
    let relevant=candidates.filter(candidate=>candidate.matches>0);
    if(!relevant.length&&candidates.length===1)relevant=candidates;
    if(!relevant.length)return;
    relevant.sort((a,b)=>a.time-b.time);
    const sets=new Map(),puzzles=new Map(),solutions=new Map();
    for(const {data} of relevant){
      for(const item of data.sets)if(item&&typeof item.id==='string')sets.set(item.id,item);
      for(const item of data.puzzles)if(item&&typeof item.id==='string')puzzles.set(item.id,item);
      for(const item of data.solutions)if(item&&typeof item.id==='string')solutions.set(item.id,item);
    }
    const snapshot={version:1,sets:[...sets.values()],puzzles:[...puzzles.values()],solutions:[...solutions.values()]};
    if(!writeStorage('data',JSON.stringify(snapshot)))return;
    const newest=relevant[relevant.length-1].namespace;
    for(const kind of ['playerName','colorblind','showElementSequences','soundEnabled']){
      const value=localStorage.getItem(`lightyard_${newest}_${kind}`);
      if(value!==null)writeStorage(kind,value);
    }
    // Old keys remain as a recoverable backup. Future updates read the
    // stable namespace and skip migration entirely.
  }catch(error){showStorageFailure(error);}
}
function loadBuiltInCatalog(){
  State.builtInSets=[];State.builtInPuzzles=[];
  if(!BUILT_IN_APP_DATA)return;
  const rawSets=Array.isArray(BUILT_IN_APP_DATA.sets)?BUILT_IN_APP_DATA.sets:[];
  const setRuntimeBySource=new Map();
  rawSets.forEach((raw,index)=>{

// All sounds are synthesized at playback time so Lightyard remains one

let gameAudioContext=null;

function ensureGameAudio(){

  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return null;
  if(!gameAudioContext)gameAudioContext=new AudioCtor();
  if(gameAudioContext.state==='suspended')gameAudioContext.resume().catch(()=>{});
  return gameAudioContext;
}
function soundEnvelope(ctx,when,duration,peak){

  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);

}

}

function playGameSound(type){

    const zap=soundOsc(ctx,'sawtooth',155,62,now,.27,.055);
    zap.osc.detune.setValueAtTime(180,now);zap.osc.detune.linearRampToValueAtTime(-240,now+.27);
  }else if(type==='crystalDown'){
    soundOsc(ctx,'sine',820,250,now,.24,.055);soundOsc(ctx,'triangle',1230,375,now,.2,.018);
  }else if(type==='receiverUp'){
    soundOsc(ctx,'sine',310,930,now,.28,.06);soundOsc(ctx,'triangle',465,1240,now+.025,.24,.022);
  }else if(type==='emitterGong'){
    soundOsc(ctx,'sine',205,194,now,.55,.065);soundOsc(ctx,'sine',308,291,now,.42,.033);soundOsc(ctx,'sine',487,460,now,.3,.012);
  }else if(type==='warble'){

  osc.type='sawtooth';osc.frequency.setValueAtTime(freq,when);
  filter.type='lowpass';filter.frequency.setValueAtTime(850,when);

  filter.frequency.exponentialRampToValueAtTime(700,when+duration);

  gain.gain.setValueAtTime(.0001,when);
  gain.gain.linearRampToValueAtTime(peak,when+.045);
  gain.gain.setValueAtTime(peak*.82,when+Math.max(.06,duration-.12));

function playVictoryFanfare(){

/* ============================== GEOMETRY HELPERS ============================== */
function makeGrid(rows,cols){
  const g=new Array(rows);
  for(let r=0;r<rows;r++){ g[r]=new Array(cols).fill(null); }
  return g;
}
function inBounds(r,c,rows,cols){ return r>=0&&r<rows&&c>=0&&c<cols; }

function buildWorkingGrid(){
  const rows=State.gridRows, cols=State.gridCols;
  const g = makeGrid(rows,cols);
  const puzzle = getCurrentPuzzle();
  if(puzzle){
    for(const el of puzzle.elements){
      if(inBounds(el.r,el.c,rows,cols)) g[el.r][el.c] = cloneElement(el, true);
    }
  }
  if(State.screen==='solutionEdit'){
    const sol = getCurrentSolution();
    if(sol){
      for(const el of sol.elements){
        if(puzzle && ((puzzle.noPrisms&&el.type==='prism')||(puzzle.noHalfMirrors&&el.type==='mirrorHalf'))) continue;
        // Puzzle elements always win. This protects fixed pieces from an old
        // or imported solution that happens to claim the same square.
        if(inBounds(el.r,el.c,rows,cols)&&g[el.r][el.c]==null) g[el.r][el.c] = cloneElement(el, false);
      }
    }
  } else if(State.screen==='puzzleEdit'){
    // only puzzle fixed elements, already added above
  }
  State.grid = g;
  resetRuntime();
}

function cloneElement(el, fixed){
  const copy = JSON.parse(JSON.stringify(el));

  copy.fixed = fixed;
  return copy;
}

    State.firstFailure={tick:State.tick,frac,message:message||'The puzzle has failed.'};

  }
  // Preview and resolution of one arrival share its visual, but a later
  // packet of the same color must get its own approach animation.

  const seenMarks=new Set(State.failureMarks.map(markKey));
  for(const mark of marks||[]){
    const full={r:mark.r,c:mark.c,color:mark.color,
      fromR:mark.fromR==null?mark.r:mark.fromR,fromC:mark.fromC==null?mark.c:mark.fromC,
      tick:State.tick,showFrac:mark.showFrac==null?frac:mark.showFrac,

    const key=markKey(full);

  }
  const seenCells=new Set(State.failureCells.map(c=>`${c.r},${c.c}`));
  for(const cell of cells||[]){
    const key=`${cell.r},${cell.c}`;
    if(!seenCells.has(key)){State.failureCells.push({r:cell.r,c:cell.c,tick:State.tick,showFrac:cell.showFrac==null?frac:cell.showFrac});seenCells.add(key);}

// crystal absorption, receiver registration, multiple packets blending together
// at a plain cell, or several packets meeting at a mirror) must not become
// visible until the packet has actually
// reached the center of that cell. Mirrors/crystal/bounces don't need this —
// they only change direction, which is invisible until the packet starts
// moving away anyway. So those interactions resolve immediately; these ones
// go through a one-tick "pending" hold: the packet finishes its approach
// still showing its own original color(s), and only at the start of the
// *next* tick — exactly when it's sitting at the cell's center — does the
// transform actually happen, immediately followed by that tick's normal
// movement in the new direction. Total travel time is unchanged; only what's
// displayed during the approach is corrected.
// The saved noCollisions field also represents the renamed No Interactions rule.
function cellCollisionParticipants(el,list){
  if(!getCurrentPuzzle()?.noCollisions||list.length<2)return [];
  const groups=new Map();
  const add=(key,i)=>{if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);};
  if(el?.type==='emitter')return []; // Already an unconditional failure.
  if(el?.type==='transformer')return []; // Each packet steps independently; no mixing or merging.
  if(el?.type==='mirrorDiag'){
    // A transmitted packet crosses the mirror, so the two faces are no
    // longer isolated. Reflection is decided from each incoming color.
    if(list.some(a=>!mirrorReflectsPacket(el,a)))return list.map((_,i)=>i);
    list.forEach((a,i)=>{
      const side=OPP[a.dir];
      const first=el.curOrient==='NE_SW'?['N','W']:['N','E'];
      add(first.includes(side)?0:1,i);
    });
  }else if(el?.type==='receiver'){
    // Receivers consume packets at their entry faces; separate faces never meet.
    list.forEach((a,i)=>add(a.dir,i));
  }else if(el?.type==='prism'){
    const base=el.curBase,branches=[CCW[base],CW[base]];
    const baseInputs=[],otherInputs=[];
    list.forEach((a,i)=>(OPP[a.dir]===base?baseInputs:otherInputs).push(i));
    const hit=new Set();
    if(baseInputs.length>1)baseInputs.forEach(i=>hit.add(i));
    if(otherInputs.length>1)otherInputs.forEach(i=>hit.add(i));
    if(baseInputs.length&&otherInputs.some(i=>branches.includes(OPP[list[i].dir]))){
      [...baseInputs,...otherInputs].forEach(i=>hit.add(i));
    }
    // A single packet splitting is not a collision. Opposite-point traffic
    // is also separate from the prism's split branches.
    return [...hit];
  }else{
    // These cells mix or merge simultaneous packets. Matching colors do
    // not exempt a meeting from the interaction rule.
    return list.map((_,i)=>i);
  }
  return [...groups.values()].filter(g=>g.length>1).flat();
}

function recordPacketCollision(r,c,packets,frac){
  if(!getCurrentPuzzle()?.noCollisions)return;
  if(!State.collisionEvents)State.collisionEvents=new Set();
  const key=[State.tick+frac,r,c].map(x=>Number(x).toFixed(7)).join(':');
  if(State.collisionEvents.has(key))return;
  State.collisionEvents.add(key);
  const marks=packets.map(p=>({r,c,fromR:r,fromC:c,
    color:p.preCrossColor!=null?p.preCrossColor:p.color,showFrac:frac,holdOnly:true}));
  const cells=Number.isInteger(r)&&Number.isInteger(c)?[{r,c,showFrac:frac}]:[];
  recordRunFailure(`No Interactions: packets interacted at (${r},${c}).`,marks,cells,frac);
  scheduleTickSound('fail',frac,100);
}

function transitContactFrac(a0,a1,b0,b1){
  const dr=(a1.r-a0.r)-(b1.r-b0.r),dc=(a1.c-a0.c)-(b1.c-b0.c);
  const rr=b0.r-a0.r,cc=b0.c-a0.c,eps=1e-9;
  let f;
  if(Math.abs(dr)>eps)f=rr/dr;
  else if(Math.abs(dc)>eps)f=cc/dc;
  else return Math.abs(rr)<eps&&Math.abs(cc)<eps ? .5 : null;
  if(f<-eps||f>1+eps||Math.abs(a0.r+f*(a1.r-a0.r)-b0.r-f*(b1.r-b0.r))>1e-7||
    Math.abs(a0.c+f*(a1.c-a0.c)-b0.c-f*(b1.c-b0.c))>1e-7)return null;
  return Math.max(0,Math.min(1,f));
}

function detectTransitCollisions(packets){
  // Inspect the actual piecewise motion, including crystal entry, slow
  // transit, and exit. Cell-end meetings are handled by arrival resolution.
  const position=(p,f)=>packetDisplayPos(p,p.exiting?Math.min(f/.5,1):f);
  for(let i=0;i<packets.length;i++)for(let j=0;j<i;j++){
    const a=packets[i],b=packets[j];
    for(const [start,end] of [[0,.5],[.5,1]]){
      if((a.exiting||b.exiting)&&start>=.5)continue;
      const a0=position(a,start),a1=position(a,end),b0=position(b,start),b1=position(b,end);
      const local=transitContactFrac(a0,a1,b0,b1);
      if(local==null)continue;
      const f=start+local*(end-start);
      if(f<=1e-9||f>=1-1e-9)continue; // Birth and separated mirror faces.
      const pos=position(a,f);
      recordPacketCollision(pos.r,pos.c,[a,b],f);
      break;
    }
  }
}

function resolveTransformingElement(el, r, c, list, grid, strict, resolutionTick){
  // Every packet resolving here is still just "approaching" (r,c) — it
  // hasn't actually arrived in a visual sense until this resolution's own
  // moment, which the final frozen frame (if this tick fails) treats as
  // the center of this cell. Recording each one's own real origin lets
  // that frame show it partway along its own approach rather than
  // teleported to wherever the resolution's OUTCOME would place it.
  for(const a of list){
    // A crystal's pending packet is already partway inside the crystal.
    // Treat that displayed endpoint as its current position so absorption
    // failures freeze in place instead of jumping back to the entrance.
    const crystalCurrent=el&&el.type==='crystal'&&a.displayToR!=null;
    const fr = crystalCurrent?a.displayToR:(a.displayFromR!=null ? a.displayFromR : (a.fromR!=null?a.fromR:(a.origin?a.origin.r:r)));
    const fc = crystalCurrent?a.displayToC:(a.displayFromC!=null ? a.displayFromC : (a.fromC!=null?a.fromC:(a.origin?a.origin.c:c)));
    State._violCollector.pendingApproaches.push({fromR:fr, fromC:fc, r, c, color:a.color,
      failCategory:null,visualRecorded:!!a.suppressVisual});
  }
  const approachEntry = (i) => State._violCollector.pendingApproaches[State._violCollector.pendingApproaches.length-list.length+i];
  const colliding=cellCollisionParticipants(el,list);
  if(colliding.length){
    (State._violCollector.collisions||(State._violCollector.collisions=[])).push({
      r,c,packets:colliding.map(i=>list[i]),crystal:!!(el&&el.type==='crystal')
    });
  }

  if(!el){
    // All packets meeting in an empty cell share their combined color.
    // Packets leaving in different directions cross and remain separate;
    // packets leaving in the same direction occupy the same path and
    // coalesce into a single packet. This includes a full-speed packet
    // catching one that was slowed by a crystal which just disintegrated.
    const blended = blendAll(list.map(a=>a.color));
    const byDir=new Map();
    for(const a of list){
      if(!byDir.has(a.dir))byDir.set(a.dir,{dir:a.dir,color:blended});
    }
    const out=[...byDir.values()];
    if(out.length<list.length){
      State.strictCountDelta+=out.length-list.length;
      State._violCollector.hasMerge=true;
      State._violCollector.cells.push({r,c});
      list.forEach((a,i)=>{approachEntry(i).failCategory='merge';});
    }
    return out;
  }

  if(el.type==='emitter'){
    State.hardViolation = true; // a packet reaching an emitter is always a failure, strict or not
    State._violCollector.hasWERC = true;
    if(!State._violCollector.message){
      const colors = [...new Set(list.map(a=>COLNAME[a.color]))].join('/');
      State._violCollector.message = `A ${colors} packet hit the emitter at (${r},${c}).`;
    }
    list.forEach((a,i)=>{
      approachEntry(i).failCategory='werc';
    });
    State._violCollector.cells.push({r,c});
    return [];
  }
  if(el.type==='receiver'){
    const multipleEntries=new Set(el.dirs||[]).size>1;
    const receiverTick=resolutionTick==null?State.tick:resolutionTick;
    const tickEntry=receiverEntryForPacket(el);
    const pending=list.map((a,i)=>({a,i}));
    while(pending.length){
      // Check the entry that was open at the start of this tick first.
      // A multi-entry receiver cannot open its next entry until next tick.
      const expectedEntry=multipleEntries?tickEntry:receiverEntryForPacket(el);
      const next=pending.findIndex(({a})=>OPP[a.dir]===expectedEntry);
      const {a,i}=pending.splice(next<0?0:next,1)[0];
      let ok = false, failReason = null;
      if(!el.dirs || !el.dirs.includes(OPP[a.dir])){
        failReason = `arrived from a direction the receiver doesn't accept`;
      } else if(el.pointer >= el.colors.length){
        failReason = `arrived after the receiver's sequence was already complete`;
      } else if(multipleEntries && el.lastReceivedTick===receiverTick){
        el.marks[el.pointer]='fail';
        failReason = `arrived in the same tick as the previous accepted packet; the next entry opens on the following tick`;
      } else if(OPP[a.dir]!==expectedEntry){
        el.marks[el.pointer]='fail';
        failReason = `arrived from ${DIRWORD[OPP[a.dir]]}, but the next packet must enter from ${DIRWORD[expectedEntry]}`;
      } else {
        const expected = el.colors[el.pointer];
        if(a.color===expected){ el.marks[el.pointer]='ok'; el.pointer++; el.lastReceivedTick=receiverTick; ok=true; }
        else { el.marks[el.pointer]='fail'; failReason = `expected ${COLNAME[expected]} but got ${COLNAME[a.color]}`; }
      }
      // wrong direction, wrong color/order, or arriving after the receiver was
      // already done (superfluous) — always a failure, strict or not.
      if(!ok){
        el.failed=true;
        State.hardViolation = true;
        State._violCollector.hasWERC = true;
        const message=`The receiver at (${r},${c}) failed: a ${COLNAME[a.color]} packet ${failReason}.`;
        if(!State._violCollector.message)State._violCollector.message=message;
        approachEntry(i).failCategory = 'werc';
        State._violCollector.cells.push({r,c});
      }else State._violCollector.receiverSuccess=true;
    }
    return [];
  }
  if(el.type==='mirrorDiag'){
    if(list.length)State._violCollector.mirrorPrismHit=true;
    const map = el.curOrient==='NE_SW' ? NE_SW_MAP : NW_SE_MAP;
    if(mirrorColorFor(el)!=null&&list.some(a=>!mirrorReflectsPacket(el,a))){
      const blended=blendAll(list.map(a=>a.color)),byDir=new Map();
      for(const a of list){
        const dir=mirrorReflectsPacket(el,a)?map[a.dir]:a.dir;
        if(!byDir.has(dir))byDir.set(dir,{dir,color:blended});
      }
      const out=[...byDir.values()];
      if(out.length<list.length){
        State.strictCountDelta+=out.length-list.length;
        State._violCollector.hasMerge=true;State._violCollector.cells.push({r,c});
        list.forEach((a,i)=>{approachEntry(i).failCategory='merge';});
      }
      if(el.switching&&list.length){
        State._violCollector.orientationChange=true;el.flipFrom=el.curOrient;
        el.curOrient=el.curOrient==='NE_SW'?'NW_SE':'NE_SW';
      }
      return out;
    }
    // A diagonal mirror has two independent reflective faces. Packets that
    // reach the same face meet and mix; packets simultaneously striking
    // opposite faces are separated by the mirror and retain their colors.
    const faceFor = inputSide => el.curOrient==='NE_SW'
      ? ((inputSide==='N'||inputSide==='W') ? 0 : 1)
      : ((inputSide==='N'||inputSide==='E') ? 0 : 1);
    const blendedByFace=new Map();
    for(const face of [0,1]){
      const colors=list.filter(a=>faceFor(OPP[a.dir])===face).map(a=>a.color);
      if(colors.length)blendedByFace.set(face,blendAll(colors));
    }
    const out = list.map(a=>({dir:map[a.dir],color:blendedByFace.get(faceFor(OPP[a.dir]))}));
    if(el.switching && list.length){
      State._violCollector.orientationChange=true;
      el.flipFrom=el.curOrient;
      el.curOrient = el.curOrient==='NE_SW'?'NW_SE':'NE_SW';
    }
    return out;
  }
  if(el.type==='mirrorHalf'){
    if(list.length)State._violCollector.mirrorPrismHit=true;
    const blended=blendAll(list.map(a=>a.color));
    const map=halfMirrorOrientation(halfMirrorFacing(el))==='NE_SW'?NE_SW_MAP:NW_SE_MAP;
    const byDir=new Map();
    list.forEach(a=>{
      const dir=mirrorReflectsPacket(el,a)?map[a.dir]:a.dir;
      if(!byDir.has(dir)) byDir.set(dir,{dir,color:blended});
    });
    const out=[...byDir.values()];
    const delta=out.length-list.length;
    if(delta<0){
      State.strictCountDelta+=delta;
      State._violCollector.hasMerge=true;
      State._violCollector.cells.push({r,c});
      list.forEach((a,i)=>{approachEntry(i).failCategory='merge';});
    }
    if(list.length){
      const effSeq=halfMirrorEffectiveSequence(el);
      if(effSeq.length>1){
        State._violCollector.orientationChange=true;
        el.flipFrom=halfMirrorFacing(el);
        el.seqPos=((el.seqPos||0)+1)%effSeq.length;
        el.curFacing=effSeq[el.seqPos];
      }
    }
    return out;
  }
  if(el.type==='prism'){
    if(list.length)State._violCollector.mirrorPrismHit=true;
    const D = el.curBase, P1=CCW[D], P2=CW[D];
    const dArr=[], dIdx=[], otherArr=[], otherIdx=[];
    const otherInputSides = new Set();
    list.forEach((a,i)=>{
      const inputSide = OPP[a.dir];
      if(inputSide===D){ dArr.push(a); dIdx.push(i); } else { otherArr.push(a); otherIdx.push(i); }
      if(inputSide!==D) otherInputSides.add(inputSide);
    });
    const out = [];
    const hit = list.length>0;
    let split1=null, split2=null, combined=null;
    if(dArr.length){
      const color = blendAll(dArr.map(a=>a.color));
      [split1,split2] = splitTable(color);
    }
    if(otherArr.length){
      combined = blendAll(otherArr.map(a=>a.color));
    }
    if(dArr.length && otherArr.length){
      // The split branches only cross non-base traffic entering from the
      // corresponding side. Traffic entering at the point opposite the
      // base travels to the base without crossing either split branch.
      const crossesP1 = otherInputSides.has(P1);
      const crossesP2 = otherInputSides.has(P2);
      if(crossesP1 || crossesP2){
        const connected = blendAll([
          combined,
          ...(crossesP1 ? [split1] : []),
          ...(crossesP2 ? [split2] : [])
        ]);
        combined = connected;
        if(crossesP1) split1 = connected;
        if(crossesP2) split2 = connected;
      }
    }
    if(dArr.length){ out.push({dir:P1,color:split1}); out.push({dir:P2,color:split2}); }
    if(otherArr.length){ out.push({dir:D,color:combined}); }
    // Splitting (more packets out than in) or combining (fewer) both count
    // as the board's packet total changing — strict mode only tolerates
    // this if something else balances it out the same tick.
    if(out.length !== list.length){
      State._violCollector.cells.push({r,c});
      if(out.length > list.length){
        // Splitting: this cell's outgoing packets, once the tick has
        // actually reached (and passed) this cell's own center, continue
        // in their own two (or three) directions — recorded here so the
        // final frame can show that continuation, capped appropriately.
        State._violCollector.hasSplit = true;
        State._violCollector.splitResolutions = State._violCollector.splitResolutions || [];
        const input = dIdx.length ? approachEntry(dIdx[0]) : null;
        State._violCollector.splitResolutions.push({r, c, outputs: out.map(o=>({dir:o.dir,color:o.color})), failing:true});
        // The dArr inputs are also "approaching" entries (used if this
        // tick stops before even reaching this cell) — mark them so a
        // *different*, higher-priority failure elsewhere still shows this
        // cell correctly as "not yet split."
        dIdx.forEach(i => { approachEntry(i).failCategory = null; });
      } else {
        State._violCollector.hasMerge = true;
        otherIdx.forEach(i => { approachEntry(i).failCategory = 'merge'; });
      }
    } else if(dArr.length){
      // A balanced (non-failing) split still needs the same "hasn't
      // resolved yet" bookkeeping in case some other failure stops the
      // tick before this cell's own moment.
      State._violCollector.splitResolutions = State._violCollector.splitResolutions || [];
      State._violCollector.splitResolutions.push({r, c, outputs: out.map(o=>({dir:o.dir,color:o.color})), failing:false});
    }
    State.strictCountDelta += (out.length - list.length);
    if(hit){
      const effSeq = prismEffectiveSequence(el);
      if(effSeq.length>1){
        State._violCollector.orientationChange=true;
        el.flipFrom = el.curBase;
        el.seqPos = ((el.seqPos||0)+1) % effSeq.length;
        el.curBase = effSeq[el.seqPos];
      }
    }
    return out;
  }
  if(el.type==='crystal'){
    // Every entry goes through here now (not just simultaneous groups),
    // since even a lone packet needs to move from "just entered" (tick1's
    // endpoint) into its uniform half-speed crossing of the middle.
    const blended = blendAll(list.map(a=>a.color));
    const out = [];
    if(el.filterColor==null){
      // Clear — no filtering, just blends and slows. Opposing arrivals do
      // not change color at the crystal edge; they change at the midpoint
      // of this slow middle crossing, when their packets actually overlap.
      list.forEach(a=>out.push({dir:a.dir,color:blended,preCrossColor:a.color,
        crossFrac:list.length>1?0.5:null,crystalMid:true,fromR:a.displayToR,fromC:a.displayToC}));
    } else {
      list.forEach((a,i)=>{
        // Passes if the packet's color contains every component of the
        // crystal's own filter color. Absorption always fails with Strict
        // Crystals; otherwise it fails only if Strict Count is unbalanced.
        if(el.filterColor!==COL.K && (blended & el.filterColor) === el.filterColor){
          out.push({dir:a.dir, color:el.filterColor, preCrossColor:a.color,
            crossFrac:(list.length>1 || a.color!==el.filterColor)?0.5:null,
            crystalMid:true, fromR:a.displayToR, fromC:a.displayToC});
        } else {
          State.strictCountDelta--;
          State._violCollector.hasWERC = true;
          State._violCollector.crystalAbsorption = true;
          if(getCurrentPuzzle()?.strictCrystals){
            State.hardViolation = true;
            if(!State._violCollector.message)State._violCollector.message=`Strict Crystals: a ${COLNAME[a.color]} packet was absorbed by the crystal at (${r},${c}).`;
          }
          approachEntry(i).failCategory = 'werc';
          State._violCollector.cells.push({r,c});
        }
      });
    }
    // Every arriving packet is an impact, including packets the crystal
    // accepts. Resolve the whole simultaneous cohort before disintegrating.
    if(el.maxHits!=='inf' && Number.isFinite(el.hitsRemaining)){
      el.hitsRemaining-=list.length;
      if(el.hitsRemaining<=0)grid[r][c]=null;
    }
    return out;
  }
  if(el.type==='transformer'){
    const out = [];
    // Each packet travels through its own path. Simultaneous arrivals do
    // not blend inside a transformer before their spectrum steps.
    list.forEach((a,i)=>{
      const next = stepSpectrum(a.color, el.direction);
      if(next==null){
        State.hardViolation = true; // off the spectrum, or past either end — always a failure
        State._violCollector.hasWERC = true;
        const message=`A ${COLNAME[a.color]} packet hit the ${el.direction} transformer at (${r},${c}) with nowhere left to go.`;
        if(!State._violCollector.message)State._violCollector.message=message;
        approachEntry(i).failCategory = 'werc';
        State._violCollector.cells.push({r,c});
      } else {
        out.push({dir:a.dir, color:next});
      }
    });
    return out;
  }
  return [];
}

// Resolve the arrivals against a cloned grid before their approach animation
// is shown. This is only a look-ahead: it lets the renderer know that the
// movement now being constructed will fail, without committing receiver,
// crystal, prism, or mirror state before the packets visibly get there.
function previewArrivalResolutions(byCell, grid, strict){
  const savedCollector=State._violCollector;
  const savedDelta=State.strictCountDelta;
  const savedHard=State.hardViolation;
  const previewGrid=JSON.parse(JSON.stringify(grid));
  const collector={message:null,cells:[],hasExit:false,hasWERC:false,hasMerge:false,hasSplit:false,
    receiverSuccess:false,mirrorPrismHit:false,orientationChange:false,crystalAbsorption:false,
    pendingApproaches:[],splitResolutions:[],exitPackets:[]};
  State._violCollector=collector;
  State.strictCountDelta=0;
  State.hardViolation=false;
  const resolutions=[];
  byCell.forEach((list,key)=>{
    const [r,c]=key.split('_').map(Number);
    const el=previewGrid[r][c];
    let outputs;
    if(!el) outputs=resolveTransformingElement(null,r,c,list,previewGrid,strict);
    // These arrivals resolve next tick, after this tick's entry lock expires.
    else outputs=resolveTransformingElement(el,r,c,list,previewGrid,strict,State.tick+1);
    resolutions.push({r,c,type:el?el.type:null,inputs:list,outputs});
  });
  const result={collector,delta:State.strictCountDelta,hard:State.hardViolation,resolutions};
  State._violCollector=savedCollector;
  State.strictCountDelta=savedDelta;
  State.hardViolation=savedHard;
  return result;
}

function failureCategory(exitCollector, preview, strict){
  if(exitCollector.hasExit) return 'exit';
  if(preview.hard && preview.collector.hasWERC) return 'werc';
  if(strict && preview.delta!==0){
    if(preview.collector.hasWERC) return 'werc';
    if(preview.collector.hasMerge) return 'merge';
    if(preview.collector.hasSplit) return 'split';
  }
  return null;
}

function sceneTrack(fromR,fromC,toR,toC,color,opts){
  return Object.assign({r:toR,c:toC,fromR,fromC,color,holding:false},opts||{});
}

// Turn the just-computed movement into a self-contained animation ending at
// the precise failure instant. Because failure was detected before playback,
// nothing has to reach the center and then rewind to this frame.
function beginFailureScene(category, preview, gridSnapshot, arrivals, staying, exitCollector, strict){
  const edgeTime={exit:0,werc:0.05,merge:0.45,split:0.55}[category];
  const centerFrac=0.5+edgeTime;
  const stopCells = category==='exit' ? [] : preview.collector.cells;
  const stopKeys = new Set(stopCells.map(x=>x.r+'_'+x.c));
  const tracks=[];

  if(centerFrac<=1){
    for(const a of arrivals){
      const fr=a.displayFromR!=null?a.displayFromR:a.origin.r;
      const fc=a.displayFromC!=null?a.displayFromC:a.origin.c;
      const temp={r:a.r,c:a.c,fromR:fr,fromC:fc,animOutR:a.animOutR,animOutC:a.animOutC};
      const end=packetDisplayPos(temp,centerFrac);
      const originalCross=a.crossFrac;
      tracks.push(sceneTrack(fr,fc,end.r,end.c,a.color,{
        preCrossColor:a.preCrossColor,
        crossFrac:originalCross==null?null:originalCross/centerFrac,
        violating:stopKeys.has(a.r+'_'+a.c), violatingFromFrac:1
      }));
    }
    for(const p of staying){
      const start=packetDisplayPos(p,0), end=packetDisplayPos(p,Math.min(centerFrac,1));
      tracks.push(sceneTrack(start.r,start.c,end.r,end.c,p.color,{
        preCrossColor:p.preCrossColor,
        crossFrac:p.crossFrac==null?null:p.crossFrac/Math.min(centerFrac,1)
      }));
    }
  } else {
    const splitAdvance=centerFrac-1;
    for(const res of preview.resolutions){
      const breakAt=1/centerFrac;
      for(const a of res.inputs){
        const fr=a.displayFromR!=null?a.displayFromR:a.origin.r;
        const fc=a.displayFromC!=null?a.displayFromC:a.origin.c;
        tracks.push(sceneTrack(fr,fc,res.r,res.c,a.color,{hideAtFrac:breakAt}));
      }
      for(const o of res.outputs){
        const v=VEC[o.dir];
        tracks.push(sceneTrack(res.r,res.c,res.r+v.dr*splitAdvance,res.c+v.dc*splitAdvance,o.color,{
          showFromFrac:breakAt,
          motionStartFrac:breakAt,
          violating:stopKeys.has(res.r+'_'+res.c), violatingFromFrac:1
        }));
      }
    }
    for(const p of staying){
      const start=packetDisplayPos(p,0), end=packetDisplayPos(p,1);
      tracks.push(sceneTrack(start.r,start.c,end.r,end.c,p.color,{preCrossColor:p.preCrossColor,crossFrac:p.crossFrac}));
    }
  }

  for(const ep of exitCollector.exitPackets){
    const v=VEC[ep.dir];
    tracks.push(sceneTrack(ep.r,ep.c,ep.r+v.dr*0.5,ep.c+v.dc*0.5,ep.color,{violating:true,violatingFromFrac:1}));
  }

  State.grid=gridSnapshot;
  State.packets=tracks;
  const hard = category==='exit' || preview.hard;
  const message = category==='exit'
    ? (exitCollector.message || 'A packet left the grid.')
    : (hard
      ? (preview.collector.message || 'A packet was lost.')
      : `Strict Count: the packet count changed by ${preview.delta>0?'+':''}${preview.delta} this tick without balancing back to zero.`);
  State.violation={message,cells:stopCells};
  State.failureScene={duration:centerFrac,hard,strictFail:!hard};
}

function finishFailureScene(){
  if(!State.failureScene) return;
  const scene=State.failureScene;
  State.failureScene=null;
  State.frac=1;
  finishRun(false,false,scene.strictFail,scene.hard);
}

function doTick(){
  if(State.finished) return;
  const rows=State.gridRows, cols=State.gridCols, grid=State.grid;
  State.disintegratingCrystals=[];
  State.soundEvents=[];
  // flipFrom is animation-only state from the interval that just finished.
  // Clear it before taking any rollback snapshot: otherwise a failure in
  // this new interval can restore the previous flip marker and visually
  // replay that old orientation change even though the prism/mirror did
  // not change state again.
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el) el.flipFrom = null;
  }
  State.strictCountDelta = 0; // net change in on-board packet count this tick, tracked by crystal/prism/mirror interactions — emitting and receiving don't count
  State.hardViolation = false;
  // Collects, as this tick's events actually happen, everything needed to
  // reconstruct exactly where things stood if this turns out to be the
  // tick that ends the run — not just which cells and packets are at
  // fault, but every pending packet's own real approach (so it can be
  // shown partway there rather than snapped to an outcome that, from the
  // failure's own vantage point in time, hasn't actually happened yet).
  State._violCollector = {
    message:null, cells:[],
    hasExit:false, hasWERC:false, hasMerge:false, hasSplit:false,
    receiverSuccess:false,mirrorPrismHit:false,orientationChange:false,crystalAbsorption:false,
    pendingApproaches:[], // every packet resolving at some element this tick, whether it succeeds or fails
    splitResolutions:[],  // one entry per prism resolution that produced more outputs than inputs
    exitPackets:[]        // packets that left the grid this tick
  };
  const arrivals = []; // {r,c,dir,color,origin:{r,c}} OR a bounce entry (handled inline below)
  const staying = [];  // packets that remain in place (or mid-slow-entry) without resolution this tick
  const entering = []; // fresh moves that were intercepted because their target is a crystal
  let emissionCount=0;
  const puzzleForStrict = getCurrentPuzzle();
  const strict = !!(puzzleForStrict && puzzleForStrict.strict);

  function isCrystalEl(el){ return !!el && el.type==='crystal'; }

  function pushMove(r,c,dir,color,originR,originC,displayFrom,fromOverride){
    const v=VEC[dir]; const tr=r+v.dr, tc=c+v.dc;
    if(inBounds(tr,tc,rows,cols)){
      if(isCrystalEl(grid[tr][tc])){
        // A crystal doesn't slow anything until it's actually inside the
        // crystal's own square — the approach into it is ordinary full
        // speed. This move gets intercepted so it can be split: normal
        // speed up to the crystal's near edge, then half speed for the
        // rest of this tick (continuing over the next two ticks — see
        // below — to cross the crystal's own full width at half speed,
        // then instantly back to full speed once past its far edge).
        entering.push({r,c,dir,color,targetR:tr,targetC:tc,fromOverride});
        return;
      }
      const entry = {r:tr,c:tc,dir,color,origin:{r:originR,c:originC}};
      if(displayFrom){ entry.displayFromR=displayFrom.r; entry.displayFromC=displayFrom.c; }
      arrivals.push(entry);
    } else {
      // A packet that reaches the edge of the arena leaves play entirely —
      // that's always a failure, the same as hitting an emitter, and it's
      // the highest-priority one: if any packet is exiting this tick, the
      // whole tick stops at the very instant it reaches that boundary,
      // before anything else even gets the chance to happen.
      State.hardViolation = true;
      State._violCollector.hasExit = true;
      if(!State._violCollector.message){
        State._violCollector.message = `A ${COLNAME[color]} packet left the grid heading ${DIRWORD[dir]} from (${r},${c}).`;
      }
      State._violCollector.exitPackets.push({r,c,dir,color,
        fromR:fromOverride?fromOverride.r:r,fromC:fromOverride?fromOverride.c:c});
    }
  }

  // 0. Resolve any packets that finished their approach into a transforming
  // cell last tick (still sitting there, showing their own original
  // identity) — the transform happens now, at the exact moment they're at
  // the center, and they immediately continue moving this same tick.
  // A crystal's own entry (an "enter1" packet, below) is marked pending
  // too — grouping by cell here is exactly what lets several packets
  // entering the same crystal from different directions on the same tick
  // blend together, the same as any other simultaneous meeting.
  const pendingByCell = new Map();
  const midCarry = []; // packets partway through crossing a crystal's own width
  const normalMoving = [];
  for(const p of State.packets){
    if(p.exiting){
      continue; // its final half-cell movement was visual only
    } else if(p.pending){
      const k=p.r+'_'+p.c;
      if(!pendingByCell.has(k)) pendingByCell.set(k, []);
      pendingByCell.get(k).push(p);
    } else if(p.crystalPhase==='mid'){
      midCarry.push(p);
    } else {
      normalMoving.push(p);
    }
  }
  const justTransformed = [];
  pendingByCell.forEach((list, key)=>{
    const [r,c] = key.split('_').map(Number);
    const el = grid[r][c];
    const crystalBefore=el?.type==='crystal'?{...el}:null;
    const outputs = resolveTransformingElement(el, r, c, list, grid, strict);
    // Filtering resolves ahead of playback. Keep a spent crystal visible
    // through the first half of a surviving packet's slow middle crossing,
    // so its disappearance coincides with the midpoint and color change.
    // Absorbed packets have no middle crossing and leave no visual remnant.
    if(crystalBefore && !grid[r][c] && outputs.some(o=>o.crystalMid)){
      State.disintegratingCrystals.push({r,c,element:crystalBefore});
    }
    for(const o of outputs){
      if(o.crystalMid){
        // Just resolved (blend, or a colored crystal's own-color check)
        // exactly as the packet finished entering — now it spends one full
        // tick crossing the crystal's middle at uniform half speed. This
        // becomes the state for the *next* interval, so it goes to
        // `staying`, not `midCarry` (which only holds packets already
        // mid-crossing that need to advance further this same tick).
        const v = VEC[o.dir];
        const endR = o.fromR + v.dr*0.5, endC = o.fromC + v.dc*0.5;
        staying.push({
          r, c, dir:o.dir, color:o.color, holding:false,
          fromR:o.fromR, fromC:o.fromC, displayToR:endR, displayToC:endC,
          preCrossColor:o.preCrossColor, crossFrac:o.crossFrac,
          crystalPhase:'mid'
        });
      } else {
        justTransformed.push({r,c,dir:o.dir,color:o.color});
      }
    }
  });

  // 1. emit
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el = grid[r][c];
    if(el && el.type==='emitter' && el.emitIndex < el.colors.length && el.dirCursor){
      const dir = el.dirCursor;
      const color = el.colors[el.emitIndex];
      pushMove(r,c,dir,color,r,c);
      el.emitIndex++;
      emissionCount++;
      el.dirCursor = nextEnabledDir(el.dirs, el.dirCursor);
    }
  }

  // 2. advance existing (already-moving) packets
  for(const p of normalMoving){ pushMove(p.r,p.c,p.dir,p.color,p.r,p.c); }
  // 2a. advance packets that just transformed out of a pending hold this tick —
  // they start their move from the interaction cell they were sitting in.
  for(const jt of justTransformed){ pushMove(jt.r,jt.c,jt.dir,jt.color,jt.r,jt.c); }
  // 2b. finish crossing a crystal's middle, then immediately keep going —
  // full speed again the instant it's past the crystal's far edge. If the
  // very next cell is itself a crystal, this naturally becomes that
  // crystal's own entry interception (no gap in between); if it's the arena
  // edge, leaving play there is a failure like any other.
  for(const p of midCarry){
    const v = VEC[p.dir];
    const farEdgeR = p.r + v.dr*0.5, farEdgeC = p.c + v.dc*0.5;
    // A packet leaving a crystal and one entering through that same face
    // pass one another at the boundary halfway through the interval. Mix
    // the whole simultaneous crossing cohort before either continues.
    const crossingEntries = entering.filter(e=>
      e.targetR===p.r && e.targetC===p.c && e.dir===OPP[p.dir]
    );
    let outgoingPreCrossColor = null;
    let crossingFrac = null;
    if(crossingEntries.length){
      const pStart = {r:p.displayToR, c:p.displayToC};
      const pEnd = {r:p.r+v.dr, c:p.c+v.dc};
      const e0 = crossingEntries[0], ev=VEC[e0.dir];
      const eStart = e0.fromOverride || {r:e0.r,c:e0.c};
      const eNear = {r:e0.r+ev.dr*0.5,c:e0.c+ev.dc*0.5};
      const eEnd = {r:eNear.r+ev.dr*0.25,c:eNear.c+ev.dc*0.25};
      crossingFrac = computeCrossFrac(pStart,pEnd,eStart,eEnd);
      if(crossingFrac==null) crossingFrac=0.5;
      const mixed = blendAll([p.color, ...crossingEntries.map(e=>e.color)]);
      outgoingPreCrossColor = p.color;
      p.color = mixed;
      for(const e of crossingEntries){
        e.preCrossColor=e.color; e.color=mixed; e.crossFrac=crossingFrac;
      }
    }
    const beforeArrivals = arrivals.length;
    const beforeEntering = entering.length;
    pushMove(p.r, p.c, p.dir, p.color, p.r, p.c, null, {r:p.displayToR, c:p.displayToC});
    // pushMove only appends a normal arrival for a genuine, in-bounds,
    // non-crystal exit — upgrade that specific case to the two-phase
    // (still-slow, then full-speed) visual. A crystal-to-crystal handoff
    // routes through `entering` instead (no arrival to upgrade here), and
    // running off the edge doesn't produce one either.
    if(arrivals.length > beforeArrivals){
      const last = arrivals[arrivals.length-1];
      last.displayFromR = p.displayToR; last.displayFromC = p.displayToC;
      last.animOutR = farEdgeR; last.animOutC = farEdgeC;
      if(outgoingPreCrossColor!=null){ last.preCrossColor=outgoingPreCrossColor; last.crossFrac=crossingFrac; }
    } else if(entering.length > beforeEntering && outgoingPreCrossColor!=null){
      const last = entering[entering.length-1];
      last.preCrossColor=outgoingPreCrossColor; last.crossFrac=crossingFrac;
    }
  }
  // 2c. start a crystal's slow entry for anything freshly intercepted this
  // tick (from normal movement, a transform's continuation, emission, or a
  // crystal-to-crystal handoff): this whole tick shows normal speed up to
  // the crystal's near edge, then half speed for the remainder.
  for(const e of entering){
    const v = VEC[e.dir];
    const nearEdgeR = e.r + v.dr*0.5, nearEdgeC = e.c + v.dc*0.5;
    const endR = nearEdgeR + v.dr*0.25, endC = nearEdgeC + v.dc*0.25;
    const fr = e.fromOverride ? e.fromOverride.r : e.r, fc = e.fromOverride ? e.fromOverride.c : e.c;
    staying.push({
      r:e.targetR, c:e.targetC, dir:e.dir, color:e.color, holding:false, pending:true,
      fromR:fr, fromC:fc,
      animOutR:nearEdgeR, animOutC:nearEdgeC,
      displayToR:endR, displayToC:endC,
      preCrossColor:e.preCrossColor, crossFrac:e.crossFrac
    });
  }

  // 2d. mid-transit crossings: two packets moving directly toward each other
  // between the same pair of adjacent cells meet halfway and blend, each
  // continuing on in its own original direction. (Bounces are excluded —
  // their origin and target are the same cell, so they're not a real
  // cell-to-cell swap.)
  const arrivalByPath = new Map();
  for(const a of arrivals){ arrivalByPath.set(a.origin.r+'_'+a.origin.c+'>'+a.r+'_'+a.c, a); }
  const crossed = new Set();
  for(const a of arrivals){
    if(crossed.has(a)) continue;
    const revKey = a.r+'_'+a.c+'>'+a.origin.r+'_'+a.origin.c;
    const b = arrivalByPath.get(revKey);
    if(b && b!==a && !crossed.has(b)){
      const blended = blendAll([a.color,b.color]);
      a.preCrossColor=a.color; b.preCrossColor=b.color;
      a.color=blended; b.color=blended;
      a.crossFrac=0.5; b.crossFrac=0.5;
      crossed.add(a); crossed.add(b);
    }
  }

  // Note: cross-detection between a packet still entering a crystal and one
  // simultaneously exiting it (an asymmetric-speed case, like the previous
  // model's) isn't re-derived for this new three-phase geometry yet —
  // entries no longer produce a normal arrival at all (they're intercepted
  // before that point), so the previous version of this check is now
  // permanently a no-op and has been removed rather than left silently dead.

  // 3. group arrivals by cell & resolve
  const byCell = new Map();
  for(const a of arrivals){
    const k=a.r+'_'+a.c;
    if(!byCell.has(k)) byCell.set(k,[]);
    byCell.get(k).push(a);
  }

  // Look ahead on a cloned grid only to time and position failure markers.
  // The real arrivals still become pending packets below and resolve normally
  // on the next interval; unlike the former failure scene, this never stops or
  // rolls back the live simulation.
  const arrivalPreview=previewArrivalResolutions(byCell,grid,strict);
  // Show a rejected receiver as soon as the packet reaches its near edge.
  // The look-ahead runs on a cloned grid, so this only schedules a visual
  // cue; the real receiver still resolves its packet next tick.
  for(const approach of arrivalPreview.collector.pendingApproaches){
    if(approach.failCategory!=='werc')continue;
    const receiver=grid[approach.r][approach.c];
    if(receiver?.type==='receiver'&&!receiver.failVisibleAt){
      receiver.failVisibleAt={tick:State.tick+1,frac:.55};
    }
  }

  const resolved = [];
  function pushPending(r,c,a){
    resolved.push({r,c,dir:a.dir,color:a.color,holding:false,pending:true,
      fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,
      bounced:a.bounced,animOutR:a.animOutR,animOutC:a.animOutC,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
  }
  byCell.forEach((list, key)=>{
    const [r,c] = key.split('_').map(Number);
    const el = grid[r][c];
    if(!el){
      if(list.length>1){
        for(const a of list) pushPending(r,c,a); // blend is a transform: delay to center
      } else {
        const a=list[0];
        resolved.push({r,c,dir:a.dir,color:a.color,holding:false,fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,bounced:a.bounced,animOutR:a.animOutR,animOutC:a.animOutC,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
      }
      return;
    }
    if(el.type==='emitter'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='receiver'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='mirrorDiag' || el.type==='mirrorHalf'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='prism'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='transformer'){ for(const a of list) pushPending(r,c,a); return; }
    // Unrecognized element type (e.g. stale data from a removed element
    // like the old straight mirror) — pass packets through rather than
    // silently destroying them.
    for(const a of list) resolved.push({r,c,dir:a.dir,color:a.color,holding:false,fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
  });

  // Outgoing packets still have half a cell to travel before they fail.
  // Keep them visible for that half tick, but do not simulate them again.
  const exiting=State._violCollector.exitPackets.map(ep=>{
    const v=VEC[ep.dir];
    return {r:ep.r+v.dr*.5,c:ep.c+v.dc*.5,fromR:ep.fromR,fromC:ep.fromC,
      dir:ep.dir,color:ep.color,exiting:true};
  });
  State.packets = staying.concat(resolved,exiting);

  // If look-ahead says an approaching packet will fail, its failure marker
  // becomes its visible animation for this interval. Keep the real pending
  // packet in the simulation so the element resolves normally next tick, but
  // don't draw both copies (which used to make it vanish and then jump).
  const previewFailedApproaches=[];
  if(arrivalPreview.hard&&arrivalPreview.collector.hasWERC){
    previewFailedApproaches.push(...arrivalPreview.collector.pendingApproaches.filter(pa=>pa.failCategory==='werc'));
  }
  if(strict&&arrivalPreview.delta!==0&&!arrivalPreview.collector.hasSplit){
    const subtype=arrivalPreview.collector.hasWERC?'werc':'merge';
    previewFailedApproaches.push(...arrivalPreview.collector.pendingApproaches.filter(pa=>pa.failCategory===subtype));
  }
  const suppressed=new Set();
  for(const pa of previewFailedApproaches){
    const packet=State.packets.find(p=>!suppressed.has(p)&&p.pending&&p.r===pa.r&&p.c===pa.c&&p.color===pa.color&&
      Math.abs((p.displayFromR!=null?p.displayFromR:p.fromR)-pa.fromR)<.0001&&
      Math.abs((p.displayFromC!=null?p.displayFromC:p.fromC)-pa.fromC)<.0001);
