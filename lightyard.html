    if(packet){packet.suppressVisual=true;suppressed.add(packet);}
  }
  State.tick++;

  if(puzzleForStrict&&puzzleForStrict.noCollisions){
    // Arrivals meet at the end of their approach. Crystals instead meet
    // halfway through the following interval's half-speed middle crossing.
    for(const collision of arrivalPreview.collector.collisions||[]){
      recordPacketCollision(collision.r,collision.c,collision.packets,1);
    }
    for(const collision of State._violCollector.collisions||[]){
      if(collision.crystal)recordPacketCollision(collision.r,collision.c,collision.packets,.5);
    }
    detectTransitCollisions(State.packets);
  }

  // Failures are diagnostic events, not terminal states. Failed packets have
  // already produced no output (or, for Strict count changes, their normal
  // transformed outputs), while every unrelated packet remains in State.packets.
  // Keep a persistent ghost at each failed packet and let the simulation run.
  const vc=State._violCollector;
  if(State.hardViolation){
    const hardMarks=[];
    for(const pa of vc.pendingApproaches){
      if(pa.failCategory==='werc'&&!pa.visualRecorded)hardMarks.push({
        fromR:pa.fromR,fromC:pa.fromC,
        r:pa.fromR+(pa.r-pa.fromR)*.55,c:pa.fromC+(pa.c-pa.fromC)*.55,color:pa.color,showFrac:0
      });
    }
    for(const ep of vc.exitPackets){
      const v=VEC[ep.dir];hardMarks.push({fromR:ep.fromR,fromC:ep.fromC,r:ep.r+v.dr*.5,c:ep.c+v.dc*.5,color:ep.color,showFrac:.5,holdOnly:true});
    }
    const firstFrac=hardMarks.length?Math.min(...hardMarks.map(m=>m.showFrac)):0;
    const hardCells=vc.pendingApproaches.filter(pa=>pa.failCategory==='werc').map(pa=>({r:pa.r,c:pa.c,showFrac:0}));
    recordRunFailure(vc.message||'A packet failed.',hardMarks,hardCells,firstFrac);
  }
  if(strict && State.strictCountDelta!==0){
    const strictMarks=vc.pendingApproaches
      .filter(pa=>!pa.visualRecorded&&(pa.failCategory==='merge'||pa.failCategory==='werc'))
      .map(pa=>{
        const f=pa.failCategory==='merge'?.95:(vc.crystalAbsorption?0:.55);
        return {fromR:pa.fromR,fromC:pa.fromC,r:pa.fromR+(pa.r-pa.fromR)*f,c:pa.fromC+(pa.c-pa.fromC)*f,color:pa.color,showFrac:0};
      });
    for(const split of (vc.splitResolutions||[]).filter(s=>s.failing)){
      for(const output of split.outputs){
        const v=VEC[output.dir];
        strictMarks.push({fromR:split.r,fromC:split.c,r:split.r+v.dr*.05,c:split.c+v.dc*.05,color:output.color,showFrac:0});
      }
    }
    const failedOrigins=new Set(vc.cells.map(cell=>`${cell.r},${cell.c}`));
    State.packets=State.packets.filter(p=>!failedOrigins.has(`${p.displayFromR!=null?p.displayFromR:p.fromR},${p.displayFromC!=null?p.displayFromC:p.fromC}`));
    const d=State.strictCountDelta;
    const message=`Strict Count: the packet count changed by ${d>0?'+':''}${d} this tick without balancing back to zero.`;
    recordRunFailure(message,strictMarks,vc.cells,0);
  }
  if(arrivalPreview.hard&&arrivalPreview.collector.hasWERC){
    const pc=arrivalPreview.collector;
    const marks=pc.pendingApproaches.filter(pa=>pa.failCategory==='werc').map(pa=>({
      fromR:pa.fromR,fromC:pa.fromC,r:pa.fromR+(pa.r-pa.fromR)*.55,c:pa.fromC+(pa.c-pa.fromC)*.55,color:pa.color,showFrac:.55
    }));
    const cells=pc.pendingApproaches.filter(pa=>pa.failCategory==='werc').map(pa=>({r:pa.r,c:pa.c,showFrac:.55}));
    recordRunFailure(pc.message||'A packet failed.',marks,cells,.55);
  }
  if(strict&&arrivalPreview.delta!==0&&!arrivalPreview.collector.hasSplit){
    const pc=arrivalPreview.collector;
    const subtype=pc.hasWERC?'werc':'merge';
    const f=subtype==='merge'?.95:.55;
    const marks=pc.pendingApproaches.filter(pa=>pa.failCategory===subtype).map(pa=>({
      fromR:pa.fromR,fromC:pa.fromC,r:pa.fromR+(pa.r-pa.fromR)*f,c:pa.fromC+(pa.c-pa.fromC)*f,color:pa.color,showFrac:f
    }));
    const d=arrivalPreview.delta;
    recordRunFailure(`Strict Count: the packet count changed by ${d>0?'+':''}${d} this tick without balancing back to zero.`,marks,pc.cells,f);
  }

  // One interaction sound per tick, chosen by the requested priority.
  // Boundary sounds are separate because they occur partway through movement.
  if(strict&&State.strictCountDelta!==0)scheduleTickSound('fail',0,100);
  else if(vc.receiverSuccess)scheduleTickSound('receiverUp',0,90);
  else if(emissionCount)scheduleTickSound('emitterGong',0,80);
  else if(vc.hasMerge||vc.hasSplit)scheduleTickSound('warble',0,70);
  else if(vc.mirrorPrismHit&&vc.orientationChange)scheduleTickSound('flip',0,60);
  else if(vc.mirrorPrismHit)scheduleTickSound('reflect',0,50);
  if(entering.length)scheduleTickSound('crystalDown',.5,20);
  if(vc.exitPackets.length)scheduleTickSound('fail',.5,100);
  if(arrivalPreview.hard&&arrivalPreview.collector.hasWERC)scheduleTickSound('fail',.55,100);

  // Even after every receiver is full, let all remaining and not-yet-emitted
  // packets finish so each can independently succeed or fail.

  // check finish
  let anyEmitterPending=false;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el && el.type==='emitter' && el.emitIndex < el.colors.length) anyEmitterPending=true;
  }
  if(!anyEmitterPending && State.packets.every(packet=>packet.exiting)){
    // Wait until the outgoing packet reaches the boundary halfway through
    // this interval, then finish. It remains visible until that instant.
    if(vc.exitPackets.length)State.finishAfterAnimation=.5;
    else finishRun();
  } else if(State.tick>=99999){
    finishRun(true);
  }
}


function finishRun(overflow, leftoverPackets, strictFail, hardFail){
  State.finished=true; State.running=false;
  let solved=true;
  const rows=State.gridRows, cols=State.gridCols, grid=State.grid;
  let anyReceiver=false;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el && el.type==='receiver'){
      anyReceiver=true;
      if(el.failed || el.pointer < el.colors.length) solved=false;
      el.incomplete=el.pointer < el.colors.length;
    }
  }
  if(!anyReceiver)solved=false;
  if(overflow)solved=false;
  if(leftoverPackets)solved=false;
  if(strictFail)solved=false;
  if(hardFail)solved=false;
  if(State.runFailed) solved=false;
  if(!solved && !State.runFailed){
    recordRunFailure(overflow?'Stopped after 99,999 ticks.':'The receiver sequence was not completed.',[],[],0);
  }
  State.solved=solved;
  onRunFinished(overflow, leftoverPackets, strictFail, hardFail);
}

/* ============================== RENDERING ============================== */
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

function computeCellSize(){
  const mobile = window.matchMedia && window.matchMedia('(max-width:800px)').matches;
  const host = document.getElementById('boardStage');
  const maxW = host.clientWidth - (mobile ? 20 : 60);
  const maxH = host.clientHeight - (mobile ? 20 : 60);
  let size = Math.min(maxW/State.gridCols, maxH/State.gridRows);
  size = Math.max(mobile ? 24 : 30, Math.min(78, Math.floor(size)));
  return size;
}
function resizeCanvas(){
  const size = computeCellSize();
  canvas.width = size*State.gridCols;
  canvas.height = size*State.gridRows;
  canvas._cell = size;
  render();
  if(State.sheetOpen)positionInspectorSheet();
}
window.addEventListener('resize', resizeCanvas);

function render(frac){
  // During a run, an incidental render (step, resize, panel refresh) must
  // preserve the animation clock. Defaulting to 1 could momentarily show a
  // completed prism/mirror flip, after which playback at the still-stale
  // State.frac would replay the old-to-new transition a second time.
  if(frac==null) frac=State.runStarted ? State.frac : 1;
  mainPanel.classList.toggle('run-failed',runFailureVisible(frac));
  if(!State.grid){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const cell = canvas._cell || computeCellSize();
  const rows=State.gridRows, cols=State.gridCols;
  const crystalRemnants=new Map();
  if(frac<.5){
    for(const crystal of State.disintegratingCrystals){
      crystalRemnants.set(crystal.r+'_'+crystal.c,crystal.element);
    }
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // A lighter square identifies designer-placed mirrors, half-mirrors, and
  // prisms. Draw it behind the grid and pieces so borders and packets stay clear.
  ctx.fillStyle=PIECE_STYLE.fixedCellFill;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=State.grid[r][c];
    if(el?.fixed&&['mirrorDiag','mirrorHalf','prism'].includes(el.type)){
      ctx.fillRect(c*cell+1,r*cell+1,cell-2,cell-2);
    }
  }
  // grid lines
  ctx.strokeStyle='#444957';
  ctx.lineWidth=1;
  for(let r=0;r<=rows;r++){ ctx.beginPath(); ctx.moveTo(0,r*cell+.5); ctx.lineTo(cols*cell,r*cell+.5); ctx.stroke(); }
  for(let c=0;c<=cols;c++){ ctx.beginPath(); ctx.moveTo(c*cell+.5,0); ctx.lineTo(c*cell+.5,rows*cell); ctx.stroke(); }

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el = State.grid[r][c] || crystalRemnants.get(r+'_'+c);
    if(el) drawElement(el,r,c,cell,frac);
    if(State.selectedCell && State.selectedCell.r===r && State.selectedCell.c===c){
      ctx.save();
      ctx.strokeStyle='#6ee7ff'; ctx.lineWidth=2;
      ctx.strokeRect(c*cell+2,r*cell+2,cell-4,cell-4);
      ctx.restore();
    }
    if(State.selectedTool==='cloneElement' && State.cloneSourceCell && State.cloneSourceCell.r===r && State.cloneSourceCell.c===c){
      ctx.save();
      ctx.strokeStyle='#ffd94d';ctx.lineWidth=3;ctx.setLineDash([5,3]);
      ctx.strokeRect(c*cell+3,r*cell+3,cell-6,cell-6);
      ctx.restore();
    }
    if(State.dragOver && State.dragOver.r===r && State.dragOver.c===c){
      ctx.save();
      ctx.strokeStyle = State.dragOver.ok!==false ? '#32e428' : '#ff6b6b';
      ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.strokeRect(c*cell+2,r*cell+2,cell-4,cell-4);
      ctx.restore();
    }
  }
  // packets on top
  for(const p of State.packets){
    if(!p.suppressVisual)drawPacket(p, cell, frac);
  }
  // A failed packet travels normally up to its exact failure point, then
  // remains there with a red ring while live packets continue independently.
  // This is one continuous visual track rather than a hide-and-show swap.
  for(const mark of State.failureMarks){
    if(State.tick<mark.tick)continue;
    if(mark.holdOnly && State.tick===mark.tick && frac<mark.showFrac)continue;
    if(State.tick===mark.tick&&mark.showFrac>0&&frac<mark.showFrac){
      drawPacket({fromR:mark.fromR,fromC:mark.fromC,r:mark.r,c:mark.c,color:mark.color},cell,frac/mark.showFrac);
    }else{
      drawPacket({r:mark.r,c:mark.c,color:mark.color,violating:true},cell,1);
    }
  }
  // Keep crystal codes readable during playback too. Drawing them after
  // packets prevents a packet centered inside a crystal from hiding the
  // crystal's identity; a colored crystal's packet exits as this same color.
  if(State.colorblind){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const el=State.grid[r][c] || crystalRemnants.get(r+'_'+c);
      if(el&&el.type==='crystal'&&el.filterColor!=null){
        const {x,y}=cellCenter(r,c,cell);drawColorCode(el.filterColor,x,y,cell*.22);
      }
    }
  }
  // Strict changes and element interactions without a surviving packet get
  // persistent cell outlines. These do not stop or obscure the board.
  if(State.failureCells.length){
    ctx.save();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    for(const vc of State.failureCells){
      if(State.tick<vc.tick||(State.tick===vc.tick&&frac<vc.showFrac))continue;
      ctx.strokeRect(vc.c*cell+3, vc.r*cell+3, cell-6, cell-6);
    }
    ctx.restore();
  }
}

function cellCenter(r,c,cell){ return {x:c*cell+cell/2, y:r*cell+cell/2}; }

function colorCodeInk(color){ return [COL.G,COL.Y,COL.C,COL.W].includes(color)?'#000':'#fff'; }
function drawColorCode(color,x,y,size){
  if(!State.colorblind||color==null)return;
  ctx.save();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.globalAlpha=1;
  ctx.fillStyle=colorCodeInk(color);ctx.font=`900 ${Math.max(9,Math.round(size))}px Arial,system-ui,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(COLLETTER[color]||'?',Math.round(x),Math.round(y));ctx.restore();
}
function decorateColorControl(node,color){
  node.textContent=State.colorblind?(COLLETTER[color]||'?'):'';
  node.classList.toggle('color-code',State.colorblind);
  if(State.colorblind){
    const ink=colorCodeInk(color);node.style.setProperty('--color-code-ink',ink);
    node.style.textShadow=ink==='#000'?'none':'0 1px 2px #000b';
  }else{
    node.style.removeProperty('--color-code-ink');node.style.textShadow='';
  }
}

function lerpPos(r0,c0,r1,c1,t){ return {r:r0+(r1-r0)*t, c:c0+(c1-c0)*t}; }

function packetDisplayPos(p, frac){
  if(p.motionStartFrac!=null){
    frac = clamp((frac-p.motionStartFrac)/(1-p.motionStartFrac),0,1);
  }
  const fr = p.displayFromR!=null ? p.displayFromR : (p.fromR==null? p.r : p.fromR);
  const fc = p.displayFromC!=null ? p.displayFromC : (p.fromC==null? p.c : p.fromC);
  const tr = p.displayToR!=null ? p.displayToR : p.r;
  const tc = p.displayToC!=null ? p.displayToC : p.c;
  // Any packet with a mid-waypoint (animOutR/C) renders in two straight-line
  // halves through that point instead of one straight line — used for a
  // crystal's two-phase entry/exit (crosses at normal speed, then at half
  // speed, or vice versa, meeting exactly at the crystal's own edge).
  if(p.animOutR!=null){
    if(frac<0.5){
      const tt=frac/0.5;
      return lerpPos(fr,fc,p.animOutR,p.animOutC,tt);
    } else {
      const tt=(frac-0.5)/0.5;
      return lerpPos(p.animOutR,p.animOutC,tr,tc,tt);
    }
  }
  return lerpPos(fr,fc,tr,tc,frac);
}

function drawPacket(p, cell, frac){
  const f = frac==null?1:frac;
  if(p.exiting && f>=.5)return;
  if(p.showFromFrac!=null && f<p.showFromFrac) return;
  if(p.hideAtFrac!=null && f>=p.hideAtFrac) return;
  const pos = packetDisplayPos(p, p.exiting?Math.min(f/.5,1):f);
  const x = pos.c*cell+cell/2, y = pos.r*cell+cell/2;
  const rad = cell*0.19;
  const showColor = (p.crossFrac!=null && p.preCrossColor!=null && f < p.crossFrac) ? p.preCrossColor : p.color;
  ctx.save();
  ctx.shadowColor = COLHEX[showColor];
  ctx.shadowBlur = p.holding? 4 : 12;
  ctx.fillStyle = COLHEX[showColor];
  ctx.beginPath();
  ctx.arc(x,y,rad,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  drawColorCode(showColor,x,y,rad*1.3);
  if(p.holding){
    ctx.strokeStyle='#ffffff88'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,rad+3,0,Math.PI*2); ctx.stroke();
  }
  if(p.violating && (p.violatingFromFrac==null || f>=p.violatingFromFrac)){
    // Marks exactly the packet(s) that caused a failed run to fail — drawn
    // on top of everything else so it's unmistakable which one(s) to blame.
    ctx.save();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=2.5; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.arc(x,y,rad+5,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawElement(el,r,c,cell,frac){
  if(frac==null) frac=1;
  if(State.showElementSequences && !State.runStarted){
    const sequence=el.type==='mirrorHalf'?halfMirrorEffectiveSequence(el)
      :el.type==='prism'?prismEffectiveSequence(el):null;
    if(sequence && sequence.length>1){
      drawElementSequence(el,sequence,r,c,cell);
      return;
    }
  }
  const x=c*cell, y=r*cell;
  const cx=x+cell/2, cy=y+cell/2;
  const beforeFlipBoundary = el.flipFrom!=null && frac < 0.5;
  ctx.save();
  ctx.translate(0,0);
  if(el.type==='emitter'){
    ctx.fillStyle='#1a2230'; ctx.strokeStyle='#3a4560'; ctx.lineWidth=1.5;
    roundRect(x+4,y+4,cell-8,cell-8,6); ctx.fill(); ctx.stroke();
    const nextColor = el.colors[el.emitIndex!=null?el.emitIndex:0];
    if(nextColor!=null){
      ctx.fillStyle=COLHEX[nextColor];
      ctx.beginPath(); ctx.arc(cx,cy,cell*0.14,0,Math.PI*2); ctx.fill();
    }
    const multipleExits=new Set(el.dirs||[]).size>1;
    const nextExit=(el.emitIndex||0)<el.colors.length?(el.dirCursor||firstEnabledDir(el.dirs)):null;
    (el.dirs||[]).forEach(d=>drawArrow(cx,cy,d,cell,
      multipleExits?(d===nextExit?'#b7f3ff':'#3f7583'):'#6ee7ff', true));
    drawQueueDots(x,y,cell,el.colors,el.emitIndex||0);
  } else if(el.type==='receiver'){
    const rejected=el.failVisibleAt&&(State.tick>el.failVisibleAt.tick||
      (State.tick===el.failVisibleAt.tick&&frac>=el.failVisibleAt.frac));
    const failed=!!(el.incomplete||el.failed||rejected);
    ctx.fillStyle=failed?'#321b25':'#241a2e'; ctx.strokeStyle=failed?'#ff3b3b':'#523a68'; ctx.lineWidth=failed?3:1.5;
    roundRect(x+4,y+4,cell-8,cell-8,6); ctx.fill(); ctx.stroke();
    if(failed){ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,cell-4,cell-4);}
    ctx.strokeStyle='#e0a6ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.rect(cx-cell*0.14,cy-cell*0.14,cell*0.28,cell*0.28); ctx.stroke();
    const multipleEntries=new Set(el.dirs||[]).size>1;
    const nextEntry=(el.pointer||0)<el.colors.length?receiverEntryForPacket(el):null;
    (el.dirs||[]).forEach(d=>drawArrow(cx,cy,d,cell,
      multipleEntries?(d===nextEntry?'#f4cbff':'#785a8e'):'#e0a6ff', false));
    drawQueueDots(x,y,cell,el.colors,el.pointer||0,el.marks);
  } else if(el.type==='mirrorDiag'){
    const orient = beforeFlipBoundary ? el.flipFrom : el.curOrient;
    ctx.strokeStyle=COLHEX[mirrorColorFor(el)]||'#dcefff'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath();
    if(orient==='NE_SW'){ ctx.moveTo(x+cell*0.15,y+cell*0.85); ctx.lineTo(x+cell*0.85,y+cell*0.15); }
    else { ctx.moveTo(x+cell*0.15,y+cell*0.15); ctx.lineTo(x+cell*0.85,y+cell*0.85); }
    ctx.stroke();
    if(el.switching) drawSwitchMark(cx,cy,cell);
    drawMirrorColorBadge(ctx,cx,cy,cell,mirrorColorFor(el));
  } else if(el.type==='mirrorHalf'){
    const facing=beforeFlipBoundary?el.flipFrom:halfMirrorFacing(el);
    drawHalfMirrorLines(ctx,cx,cy,cell,facing,mirrorColorFor(el));
    if(halfMirrorEffectiveSequence(el).length>1) drawSwitchMark(cx,cy,cell);
    drawMirrorColorBadge(ctx,cx,cy,cell,mirrorColorFor(el));
  } else if(el.type==='crystal'){
    if(el.filterColor==null){
      ctx.strokeStyle=PIECE_STYLE.clearStroke; ctx.fillStyle=PIECE_STYLE.clearFill; ctx.lineWidth=2;
      roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
      ctx.fill(); ctx.stroke();
    } else {
      const hex = COLHEX[el.filterColor];
      ctx.strokeStyle=el.filterColor===COL.K?PIECE_STYLE.blackStroke:hex;
      ctx.fillStyle=el.filterColor===COL.K?PIECE_STYLE.blackFill:hex+'33'; ctx.lineWidth=2.5;
      roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
      ctx.fill(); ctx.stroke();
      if(el.filterColor!==COL.K){
        ctx.fillStyle=hex;
        ctx.beginPath(); ctx.arc(cx,cy,cell*0.16,0,Math.PI*2); ctx.fill();
      }
    }
    if(el.maxHits!=='inf'){
      const remaining=el.hitsRemaining!=null?el.hitsRemaining:el.maxHits;
      ctx.fillStyle='#f5f6fa';ctx.font=`700 ${Math.max(9,cell*.18)}px "JetBrains Mono",monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=3;
      ctx.fillText(String(Math.max(0,remaining)),x+cell*.72,y+cell*.27);ctx.shadowBlur=0;
    }
  } else if(el.type==='transformer'){
    ctx.strokeStyle='#ff9d4d'; ctx.fillStyle='#2a2018'; ctx.lineWidth=2;
    roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
    ctx.fill(); ctx.stroke();
    // The strip itself carries the configured order; the transformer no
    // longer uses an up/down arrow because packet travel direction is irrelevant.
    const stripY = cy - cell*0.05, stripH = cell*0.1, stripX = x+cell*0.22, stripW = cell*0.56;
    const shownSpectrum=el.direction==='up'?SPECTRUM:SPECTRUM.slice().reverse(), n=shownSpectrum.length;
    for(let i=0;i<n;i++){ctx.fillStyle=COLHEX[shownSpectrum[i]];ctx.fillRect(stripX+stripW*i/n,stripY,stripW/n+0.5,stripH);}
  } else if(el.type==='prism'){
    const D = beforeFlipBoundary ? el.flipFrom : el.curBase;
    drawPrismBody(ctx,cx,cy,cell,D);
    if(prismEffectiveSequence(el).length>1) drawSwitchMark(cx,cy,cell);
  }
  ctx.restore();
}
// Idle sequence panes read the configured program, including held steps.
// Playback (even when paused or finished) keeps the normal single-piece view.
function drawElementSequence(el,sequence,r,c,cell){
  const x=c*cell,y=r*cell,half=cell/2;
  ctx.save();
  ctx.strokeStyle='#444957';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x+half,y+1);ctx.lineTo(x+half,y+cell-1);
  ctx.moveTo(x+1,y+half);ctx.lineTo(x+cell-1,y+half);
  ctx.stroke();
  sequence.forEach((pose,i)=>{
    ctx.save();
    ctx.translate(x+(i%2)*half+half/2,y+Math.floor(i/2)*half+half/2);
    ctx.scale(.5,.5);
    if(el.type==='mirrorHalf'){
      drawHalfMirrorLines(ctx,0,0,cell,pose,mirrorColorFor(el));
      drawMirrorColorBadge(ctx,0,0,cell,mirrorColorFor(el));
    }
    else drawPrismBody(ctx,0,0,cell,pose);
    ctx.restore();
  });
  ctx.restore();
}
function drawPrismBody(target,cx,cy,size,base){
  target.fillStyle=PIECE_STYLE.prismFill;target.strokeStyle=PIECE_STYLE.prismStroke;target.lineWidth=2;
  const pts=trianglePts(cx,cy,size*.36,base);
  target.beginPath();target.moveTo(pts[0].x,pts[0].y);target.lineTo(pts[1].x,pts[1].y);target.lineTo(pts[2].x,pts[2].y);target.closePath();
  target.fill();target.stroke();
}
// A prism's rotation program: slot 1 is its own base direction (always
// "on"); slots 2-4 (el.seq, 3 entries) are each either null ("off" — holds
// whatever the previous slot showed) or a direction. The program runs up
// to the LAST slot that's on, then loops back to slot 1 — trailing off
// slots after that point simply aren't part of the cycle at all.
function prismEffectiveSequence(el){
  const raw = [el.base, ...(Array.isArray(el.seq) ? el.seq : [null,null,null])];
  let lastIdx = 0;
  for(let i=1;i<4;i++){ if(raw[i]!=null) lastIdx = i; }
  const seq = []; let carry = raw[0];
  for(let i=0;i<=lastIdx;i++){ if(raw[i]!=null) carry = raw[i]; seq.push(carry); }
  return seq;
}
function halfMirrorEffectiveSequence(el){
  const raw=[el.facing||legacyHalfMirrorFacing(el),...(Array.isArray(el.seq)?el.seq:[null,null,null])];
  let lastIdx=0;
  for(let i=1;i<4;i++){if(raw[i]!=null)lastIdx=i;}
  const seq=[];let carry=raw[0];
  for(let i=0;i<=lastIdx;i++){if(raw[i]!=null)carry=raw[i];seq.push(carry);}
  return seq;
}
function nextHalfMirrorSeqStep(cur){
  if(cur==null)return 'NW';
  return cur==='SW'?null:CORNER_CW[cur];
}
function halfMirrorVectors(facing){
  const corner={NW:{x:-1,y:-1},NE:{x:1,y:-1},SE:{x:1,y:1},SW:{x:-1,y:1}}[facing]||{x:-1,y:-1};
  const inv=Math.SQRT1_2;
  const face={x:corner.x*inv,y:corner.y*inv};
  return {face,tangent:{x:-face.y,y:face.x}};
}
function halfMirrorLineColors(mirrorColor){
  const color=COLHEX[mirrorColor];
  if(!color)return ['#dcefff','#8d99aa','#626b79','#414854'];
  const channels=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));
  return [1,.65,.46,.30].map(factor=>'#'+channels.map(channel=>Math.round(channel*factor).toString(16).padStart(2,'0')).join(''));
}
function drawHalfMirrorLines(target,cx,cy,size,facing,mirrorColor=null){
  const {face,tangent}=halfMirrorVectors(facing);
  const colors=halfMirrorLineColors(mirrorColor);
  target.lineCap='round';
  const lines=[
    {offset:0,half:.47,color:colors[0],width:3},
    {offset:.11,half:.38,color:colors[1],width:2.4},
    {offset:.20,half:.30,color:colors[2],width:2.1},
    {offset:.27,half:.22,color:colors[3],width:1.8}
  ];
  for(const line of lines){
    // The short backing lines recede away from the reflective-facing corner,
    // making the opposite (transparent) side visible without a filled shape.
    const mx=cx-face.x*size*line.offset, my=cy-face.y*size*line.offset;
    const dx=tangent.x*size*line.half, dy=tangent.y*size*line.half;
    target.strokeStyle=line.color;target.lineWidth=line.width;target.beginPath();
    target.moveTo(mx-dx,my-dy);target.lineTo(mx+dx,my+dy);target.stroke();
  }
}
// A badge distinguishes a white-selective mirror from an ordinary mirror.
// Sequence panes repeat the same fixed color; blank panes remain empty.
function drawMirrorColorBadge(target,cx,cy,size,color){
  if(color==null)return;
  target.save();
  const x=cx-size*.29,y=cy+size*.29,rad=size*.115;
  target.fillStyle=COLHEX[color];target.strokeStyle='#0d0f16';target.lineWidth=2;
  target.beginPath();target.arc(x,y,rad,0,Math.PI*2);target.fill();target.stroke();
  if(State.colorblind){
    target.fillStyle=colorCodeInk(color);target.font=`900 ${Math.max(11,size*.15)}px Arial,system-ui,sans-serif`;
    target.textAlign='center';target.textBaseline='middle';target.fillText(COLLETTER[color],x,y);
  }
  target.restore();
}
// Slots 2-4's click cycle: off -> N -> E -> S -> W -> off -> ...
function nextSeqStep(cur){
  if(cur==null) return 'N';
  if(cur==='N') return 'E';
  if(cur==='E') return 'S';
  if(cur==='S') return 'W';
  return null;
}
function miniMirrorIconSVG(orientation,mirrorColor=null){
  const diagonal=orientation==='NE_SW'
    ? '<line x1="8" y1="32" x2="32" y2="8"/>'
    : '<line x1="8" y1="8" x2="32" y2="32"/>';
  return `<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><g fill="none" stroke="${COLHEX[mirrorColor]||'#f4fbff'}" stroke-width="3.4" stroke-linecap="round">${diagonal}</g></svg>`;
}
function miniPrismIconSVG(dir){
  const size=40, cx=20, cy=20, r=13;
  if(dir==null){
    return `<svg viewBox="0 0 ${size} ${size}" width="34" height="34"><rect x="5" y="5" width="30" height="30" rx="7" fill="none" stroke="#6b6f7b" stroke-width="2" stroke-dasharray="4 3"/></svg>`;
  }
  const pts = trianglePts(cx,cy,r,dir);
  const ptsStr = pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" width="34" height="34"><polygon points="${ptsStr}" fill="${PIECE_STYLE.prismFill}" stroke="${PIECE_STYLE.prismStroke}" stroke-width="2"/></svg>`;
}
function miniHalfMirrorIconSVG(facing,mirrorColor=null){
  if(facing==null){
    return '<svg viewBox="0 0 40 40" width="34" height="34"><rect x="5" y="5" width="30" height="30" rx="7" fill="none" stroke="#4a4658" stroke-width="2" stroke-dasharray="4 3"/></svg>';
  }
  const {face,tangent}=halfMirrorVectors(facing);
  const colors=halfMirrorLineColors(mirrorColor);
  const lines=[{o:0,h:13.5,c:colors[0],w:2.6},{o:3.5,h:10.5,c:colors[1],w:2.1},{o:6.5,h:7.5,c:colors[2],w:1.8},{o:9,h:5,c:colors[3],w:1.5}];
  const paths=lines.map(l=>{
    const mx=20-face.x*l.o,my=20-face.y*l.o,dx=tangent.x*l.h,dy=tangent.y*l.h;
    return `<line x1="${(mx-dx).toFixed(1)}" y1="${(my-dy).toFixed(1)}" x2="${(mx+dx).toFixed(1)}" y2="${(my+dy).toFixed(1)}" stroke="${l.c}" stroke-width="${l.w}" stroke-linecap="round"/>`;
  }).join('');
  return `<svg viewBox="0 0 40 40" width="34" height="34">${paths}</svg>`;
}
function trianglePts(cx,cy,r,base){
  // base direction = flat side; apex points opposite
  const apexVec = VEC[OPP[base]];
  const apex = {x:cx+apexVec.dc*r, y:cy+apexVec.dr*r};
  const baseVec = VEC[base];
  const baseCenter = {x:cx+baseVec.dc*r, y:cy+baseVec.dr*r};
  const perp = (base==='N'||base==='S') ? {x:1,y:0} : {x:0,y:1};
  const b1 = {x:baseCenter.x+perp.x*r, y:baseCenter.y+perp.y*r};
  const b2 = {x:baseCenter.x-perp.x*r, y:baseCenter.y-perp.y*r};
  return [apex,b1,b2];
}
function drawArrow(cx,cy,dir,cell,color,outward){
  const v=VEC[dir]; const len=cell*0.4;
  let sx,sy,ex,ey;
  if(outward){ sx=cx; sy=cy; ex=cx+v.dc*len; ey=cy+v.dr*len; }
  else { sx=cx+v.dc*len; sy=cy+v.dr*len; ex=cx+v.dc*len*0.42; ey=cy+v.dr*len*0.42; }
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  const ang = Math.atan2(ey-sy,ex-sx);
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-6*Math.cos(ang-0.4), ey-6*Math.sin(ang-0.4));
  ctx.lineTo(ex-6*Math.cos(ang+0.4), ey-6*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
function drawSwitchMark(cx,cy,cell){
  ctx.strokeStyle='#ffd94d'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx+cell*0.3,cy-cell*0.3,4,0,Math.PI*1.5); ctx.stroke();
}
function drawQueueDots(x,y,cell,colors,idx,marks){
  if(!colors||!colors.length) return;
  const n=Math.min(colors.length,MAX_PACKET_SEQUENCE); const dotR=Math.max(2,cell*0.055);
  for(let i=0;i<n;i++){
    const slot=i%5, row=i<5?0:1;
    const dx=x+cell*(0.16+slot*(0.68/4));
    const yy=y+cell*(row===0?0.16:0.84);
    ctx.beginPath();
    ctx.fillStyle = COLHEX[colors[i]];
    ctx.globalAlpha = i<idx ? 0.25 : 1;
    ctx.arc(dx,yy,dotR,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    if(marks && marks[i]==='fail'){
      ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(dx,yy,dotR+2,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(dx-dotR-2,yy+dotR+2); ctx.lineTo(dx+dotR+2,yy-dotR-2); ctx.stroke();
    }
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================== EDIT HISTORY ============================== */
// Session-only, per-document history. Design snapshots include the solutions
// reconciliation can change, so an undo restores the entire edit atomically.
const editHistories=new Map();
const EDIT_HISTORY_LIMIT=100,EDIT_HISTORY_BYTES=8*1024*1024,EDIT_HISTORY_DOCUMENTS=20;
let activeEditHistory=null;
function editHistorySnapshot(){
  const puzzle=getCurrentPuzzle();
  if(!puzzle||!isEditScreen())return null;
  if(State.screen==='puzzleEdit')return JSON.stringify({puzzle,
    solutions:State.solutions.filter(s=>s.puzzleId===canonicalPuzzleId(puzzle))});
  const solution=getCurrentSolution();
  return JSON.stringify({puzzleHash:puzzleConfigurationHash(puzzle),solution:solution.id==='BLANK'?null:solution});
}
function editHistoryKey(){
  return `${State.screen}:${State.currentPuzzleId}:${State.screen==='solutionEdit'?(State.currentSolutionId||'BLANK'):''}`;
}
function trimEditHistories(){
  const bytes=()=>[...editHistories.values()].reduce((n,h)=>n+h.frames.reduce((sum,frame)=>sum+frame.length*2,0),0);
  // Evict inactive documents first, then the oldest undo states. One current
  // snapshot is retained even if a particularly large board exceeds the cap.
  while(editHistories.size>EDIT_HISTORY_DOCUMENTS||bytes()>EDIT_HISTORY_BYTES){
    const inactive=[...editHistories].find(([,h])=>h!==activeEditHistory);
    if(inactive){editHistories.delete(inactive[0]);continue;}
    const h=activeEditHistory;if(!h||h.frames.length<2)break;
    if(h.index>0){h.frames.shift();h.index--;}
    else h.frames.pop();
  }
}
function syncEditHistory(){
  if(!isEditScreen()||!getCurrentPuzzle()){activeEditHistory=null;return;}
  const key=editHistoryKey(),snapshot=editHistorySnapshot();
  // Undo of the first edit returns to the virtual blank without abandoning
  // the history that can redo the original attempt with its original ID.
  const undoneBlank=State.screen==='solutionEdit'&&getCurrentSolution().id==='BLANK'&&
    activeEditHistory?.puzzleId===State.currentPuzzleId&&activeEditHistory?.screen===State.screen&&
    activeEditHistory.frames[activeEditHistory.index]===snapshot;
  let h=undoneBlank?activeEditHistory:editHistories.get(key);
  if(!h||h.frames[h.index]!==snapshot){
    // A replay, import, or edit in another board changed this document. Its
    // previous history must not overwrite those newer changes.
    h={key,puzzleId:State.currentPuzzleId,screen:State.screen,
      solutionId:State.screen==='solutionEdit'?getCurrentSolution().id:null,frames:[snapshot],index:0};
  }
  editHistories.delete(h.key);editHistories.set(h.key,h);activeEditHistory=h;
  trimEditHistories();
}
function adoptBlankEditHistory(solutionId){
  const h=activeEditHistory;
  if(!h||h.screen!=='solutionEdit'||h.puzzleId!==State.currentPuzzleId||JSON.parse(h.frames[h.index]).solution!==null)return;
  editHistories.delete(h.key);h.solutionId=solutionId;h.key=editHistoryKey();editHistories.set(h.key,h);
}
function recordEditHistory(){
  const h=activeEditHistory;if(!h||h.puzzleId!==State.currentPuzzleId||h.screen!==State.screen)return;
  const snapshot=editHistorySnapshot();if(snapshot===h.frames[h.index])return;
  h.frames.splice(h.index+1);h.frames.push(snapshot);h.index++;
  if(h.frames.length>EDIT_HISTORY_LIMIT+1){h.frames.shift();h.index--;}
  trimEditHistories();updateEditHistoryControls();
}
function editHistoryAllowed(){
  return isEditScreen()&&!!getCurrentPuzzle()&&
    (State.screen==='puzzleEdit'?!getCurrentPuzzle()._builtIn:!currentSolutionIsLocked());
}
function updateEditHistoryControls(root=document){
  const h=activeEditHistory,allowed=editHistoryAllowed();
  root.querySelectorAll('[data-edit-history]').forEach(button=>{
    const undo=button.dataset.editHistory==='undo';
    button.disabled=!allowed||!h||(undo?h.index===0:h.index===h.frames.length-1);
    button.title=currentSolutionIsLocked()?SOLVED_LOCK_MESSAGE:
      (undo?'Undo (⌘Z / Ctrl+Z)':'Redo (⇧⌘Z / Ctrl+Shift+Z / Ctrl+Y)');
  });
}
function appendEditHistoryControls(row){
  syncEditHistory();
  const group=document.createElement('div');group.className='edit-history-controls';
  group.setAttribute('role','group');group.setAttribute('aria-label','Edit history');
  for(const [action,icon,label] of [['undo','↶','Undo'],['redo','↷','Redo']]){
    const button=document.createElement('button');button.type='button';button.className='edit-history-button';
    button.dataset.editHistory=action;button.setAttribute('aria-label',label);
    button.setAttribute('aria-keyshortcuts',action==='undo'?'Meta+Z Control+Z':'Meta+Shift+Z Control+Shift+Z Control+Y');
    const symbol=document.createElement('span');symbol.className='edit-history-icon';symbol.textContent=icon;symbol.setAttribute('aria-hidden','true');
    const text=document.createElement('span');text.className='edit-history-label';text.textContent=label;
    button.append(symbol,text);button.addEventListener('click',()=>stepEditHistory(action==='undo'?-1:1));group.appendChild(button);
  }
  row.appendChild(group);updateEditHistoryControls(group);
}
function replaceHistoryDocument(target,source){
  for(const key of Object.keys(target))delete target[key];Object.assign(target,source);return target;
}
function stepEditHistory(direction){
  syncEditHistory();
  const h=activeEditHistory,next=h?h.index+direction:-1;
  if(!editHistoryAllowed()||!h||next<0||next>=h.frames.length)return false;
  pausePlayback();dismissCelebration();closeBoardNameMenus();
  pointerDown=null;dragState=null;State.dragOver=null;lastHandledBoardGesture=null;
  const snapshot=JSON.parse(h.frames[next]);
  if(h.screen==='puzzleEdit'){
    const puzzle=getCurrentPuzzle();replaceHistoryDocument(puzzle,snapshot.puzzle);
    const restored=new Map(snapshot.solutions.map(s=>[s.id,s]));
    State.solutions=State.solutions.filter(s=>s.puzzleId!==canonicalPuzzleId(puzzle)||restored.has(s.id)).map(s=>{
      const saved=restored.get(s.id);if(!saved)return s;restored.delete(s.id);return replaceHistoryDocument(s,saved);
    });
    State.solutions.push(...restored.values());
  }else{
    const old=State.solutions.find(s=>s.id===h.solutionId);
    if(snapshot.solution){
      if(old)replaceHistoryDocument(old,snapshot.solution);else State.solutions.push(snapshot.solution);
      State.currentSolutionId=snapshot.solution.id;
    }else{
      State.solutions=State.solutions.filter(s=>s.id!==h.solutionId);State.currentSolutionId='BLANK';
    }
  }
  h.index=next;State.selectedCell=null;State.cloneSource=null;State.cloneSourceCell=null;
  closeInspectorSheet();persistData();renderScreen();updateEditHistoryControls();
  return true;
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||!(event.metaKey||event.ctrlKey))return;
  const key=event.key.toLowerCase();
  if(key!=='z'&&!(key==='y'&&event.ctrlKey&&!event.metaKey&&!event.shiftKey))return;
  const target=event.target;
  if(target?.closest?.('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))return;
  // Text editors keep native undo. Only the Arrange dialog shares board
  // history; other modal surfaces own their keyboard interaction.
  const modal=document.querySelector('.dialog-backdrop,#puzzleIntroOverlay,.online-backdrop,.celebration-layer');
  if(modal&&!modal.querySelector('.arrange-dialog'))return;
  if(document.getElementById('helpBackdrop')?.classList.contains('show')||aboutBackdrop.classList.contains('show'))return;
  if(!isEditScreen())return;
  event.preventDefault();
  if(stepEditHistory(key==='y'||event.shiftKey?1:-1)){
    document.querySelector('.arrange-dialog')?._refreshHistory?.();
  }
});


/* ============================== CANVAS INTERACTION ============================== */
function isEditScreen(){ return State.screen==='puzzleEdit' || State.screen==='solutionEdit'; }
function currentSolutionIsLocked(){
  if(State.screen!=='solutionEdit')return false;
  const solution=getCurrentSolution();
  return !!(solution&&solution.id!=='BLANK'&&solution.status==='solved');
}
// Once play or step has actually been pressed, the board is frozen —
// covers actively playing, paused partway through (or even paused before
// the very first tick has landed), and stopped after a crash or a solve
// alike. Saved solved solutions remain permanently frozen; an explicit
// restart only unlocks an unfinished attempt.
function canEditNow(){
  if(State.screen==='puzzleEdit') return true;
  if(State.screen==='solutionEdit') return !State.runStarted&&!currentSolutionIsLocked();
  return false;
}
function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const cell = canvas._cell;
  const c = Math.floor((e.clientX-rect.left)/cell);
  const r = Math.floor((e.clientY-rect.top)/cell);
  return {r,c};
}
const ROTATABLE = {mirrorDiag:1, prism:1};
function currentElementsArray(){ return State.screen==='puzzleEdit' ? getCurrentPuzzle().elements : promoteBlankIfNeeded().elements; }
function isReadOnlyEl(el){ return !!(el && el.fixed && State.screen==='solutionEdit'); }

let pointerDown = null; // {r,c,pointerId}
let dragState = null;   // {r0,c0,moved,cfg}
let lastHandledBoardGesture = null; // suppresses the click following a handled pointer gesture

function syncPlacementToolFromMenu(){
  const select=boardChrome.querySelector('.board-select');
  if(!select)return;
  if(!select.value){State.selectedTool=null;return;}
  let allowed;
  if(State.screen==='puzzleEdit') allowed=['emitter','receiver','crystal','transformer','mirrorDiag','mirrorHalf','prism','cloneElement','eraser'];
  else {
    const puzzle=getCurrentPuzzle();
    allowed=['mirrorDiag','mirrorHalf','cloneElement','eraser'];
    if(puzzle&&puzzle.noHalfMirrors)allowed=allowed.filter(type=>type!=='mirrorHalf');
    if(!puzzle || !puzzle.noPrisms)allowed.splice(allowed.includes('mirrorHalf')?2:1,0,'prism');
  }
  if(allowed.includes(select.value))State.selectedTool=select.value;
}

canvas.addEventListener('pointerdown', (e)=>{
  if(!isEditScreen()) return;
  // Read the select itself at the start of the gesture. Some mobile browsers
  // defer its input/change event until the following interaction; this keeps
  // that very first board tap from becoming a no-op.
  syncPlacementToolFromMenu();
  e.preventDefault();
  const {r,c} = cellFromEvent(e);
  if(!inBounds(r,c,State.gridRows,State.gridCols)) return;
  const el = State.grid[r][c];
  // Placement and erasing are single-tap actions, so commit them on the
  // initial press. Waiting for a window-level pointerup allowed the first
  // board interaction after a native Tools selection to be swallowed on
  // some browsers. Existing pieces still wait for pointerup so a drag does
  // not open the details panel.
  if(canEditNow() && State.selectedTool && (!el || State.selectedTool==='eraser')){
    onCellClick(r,c);
    lastHandledBoardGesture={r,c,at:Date.now()};
    pointerDown=null; dragState=null;
    return;
  }
  if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  pointerDown = {r,c,pointerId:e.pointerId};
  if(canEditNow() && el && !isReadOnlyEl(el) && !['eraser','cloneElement'].includes(State.selectedTool)){
    const arr = currentElementsArray();
    const cfg = arr.find(x=>x.r===r&&x.c===c);
    if(cfg) dragState = {r0:r,c0:c,moved:false,cfg};
  }
});
window.addEventListener('pointermove', (e)=>{
  if(!dragState || !pointerDown || e.pointerId!==pointerDown.pointerId) return;
  e.preventDefault();
  const {r,c} = cellFromEvent(e);
  if(r!==dragState.r0 || c!==dragState.c0) dragState.moved = true;
  if(dragState.moved && inBounds(r,c,State.gridRows,State.gridCols)){
    const occupied = State.grid[r][c] && !(r===dragState.r0 && c===dragState.c0);
    State.dragOver = {r,c, ok: !occupied};
    render();
  }
});
window.addEventListener('pointerup', (e)=>{
  if(!pointerDown || e.pointerId!==pointerDown.pointerId){ return; }
  e.preventDefault();
  const startedAt = pointerDown; pointerDown = null;
  const ds = dragState; dragState = null;
  State.dragOver = null;
  const target = cellFromEvent(e);
  if(!ds || !ds.moved){
    if(inBounds(target.r,target.c,State.gridRows,State.gridCols)){
      onCellClick(target.r,target.c);
      lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
    }
    else render();
    return;
  }
  if(inBounds(target.r,target.c,State.gridRows,State.gridCols)){
    const occupied = State.grid[target.r][target.c] && !(target.r===ds.r0 && target.c===ds.c0);
    if(!occupied && (target.r!==ds.r0 || target.c!==ds.c0)){
      if(e.altKey){
        const dup = JSON.parse(JSON.stringify(ds.cfg));
        dup.r=target.r; dup.c=target.c;
        currentElementsArray().push(dup);
      } else {
        ds.cfg.r = target.r; ds.cfg.c = target.c;
      }
      saveCurrentDoc();
      buildWorkingGrid();
      State.selectedCell=null;
      closeInspectorSheet();
      render();
      lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
      return;
    }
  }
  // invalid drop: nothing changed, element snaps back automatically
  lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
  render();
});
window.addEventListener('pointercancel', (e)=>{
  if(!pointerDown || e.pointerId!==pointerDown.pointerId) return;
  pointerDown=null; dragState=null; State.dragOver=null; render();
});

// Some browsers occasionally omit the canvas pointer sequence immediately
// after closing a native select. A separate click path makes that first board
// action reliable. Normal pointer-driven clicks are ignored here because they
// were already handled above.
canvas.addEventListener('click',(e)=>{
  const {r,c}=cellFromEvent(e);
  const recent=lastHandledBoardGesture;
  if(recent && recent.r===r && recent.c===c && Date.now()-recent.at<1000){
    lastHandledBoardGesture=null;
    return;
  }
  lastHandledBoardGesture=null;
  syncPlacementToolFromMenu();
  if(inBounds(r,c,State.gridRows,State.gridCols))onCellClick(r,c);
});

function onCellClick(r,c){
  const el = State.grid[r][c];
  if(State.selectedTool==='eraser'){
    if(canEditNow() && el && !isReadOnlyEl(el)) removeElementAt(r,c);
    return;
  }
  if(State.selectedTool==='cloneElement'){
    if(!canEditNow())return;
    if(el){
      if(isReadOnlyEl(el))return;
      const cfg=currentElementsArray().find(item=>item.r===r&&item.c===c);
      if(!cfg)return;
      State.cloneSource=JSON.parse(JSON.stringify(cfg));delete State.cloneSource.fixed;
      State.cloneSourceCell={r,c};State.selectedCell=null;closeInspectorSheet();render();
    } else if(State.cloneSource){
      cloneElementTo(r,c);
    }
    return;
  }
  if(!canEditNow()){
    if(el) selectCell(r,c);
    return;
  }
  if(State.screen==='puzzleEdit'){
    if(el){ selectCell(r,c); }
    else if(State.selectedTool){ placeElement(r,c,State.selectedTool, true); }
  } else if(State.screen==='solutionEdit'){
    if(el){ selectCell(r,c); }
    else if(State.selectedTool){ placeElement(r,c,State.selectedTool, false); }
  }
}

function cloneElementTo(r,c){
  if(!canEditNow())return;
  if(!State.cloneSource||State.grid[r][c])return;
  const copy=JSON.parse(JSON.stringify(State.cloneSource));copy.r=r;copy.c=c;delete copy.fixed;
  if(State.screen==='solutionEdit'&&!getCurrentPuzzle()?.includeMirrorColors&&isMirrorElement(copy))delete copy.mirrorColor;
  currentElementsArray().push(copy);saveCurrentDoc();State.selectedCell=null;
  if(State.screen==='solutionEdit')renderScreen();
  else {buildWorkingGrid();closeInspectorSheet();render();}
}

function removeElementAt(r,c){
  if(!canEditNow())return;
  const el=State.grid[r][c];
  if(!el || isReadOnlyEl(el)) return;
  const arr=currentElementsArray();
  const idx=arr.findIndex(e=>e.r===r&&e.c===c);
  if(idx>=0){arr.splice(idx,1);saveCurrentDoc();}
  State.selectedCell=null; closeInspectorSheet(); buildWorkingGrid(); render();
}

function rotateElementAt(r,c){
  mutateSelectedConfig(cfg=>{
    if(cfg.type==='mirrorDiag'){ cfg.orientation = cfg.orientation==='NE_SW' ? 'NW_SE' : 'NE_SW'; }
    else if(cfg.type==='prism'){ cfg.base = CW[cfg.base]; }
  });
}

document.addEventListener('keydown', (e)=>{
  if(e.key!=='Delete' && e.key!=='Backspace') return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || e.target?.closest?.('[contenteditable]:not([contenteditable="false"])') || e.target?.closest?.('[role="dialog"],.dialog')) return;
  if(!canEditNow() || !State.selectedCell) return;
  e.preventDefault();
  removeSelected();
});

function defaultConfigFor(type){
  if(type==='emitter') return {type,dirs:['E'],colors:[1]};
  if(type==='receiver') return {type,dirs:['W'],colors:[1]};
  if(type==='mirrorDiag') return {type,orientation:'NE_SW',switching:false};
  if(type==='mirrorHalf') return {type,facing:'NW',seq:[null,null,null]};
  if(type==='crystal') return {type,filterColor:null,maxHits:'inf',lastFiniteHits:99}; // clear by default
  if(type==='transformer') return {type, direction:'up'};
  if(type==='prism') return {type,base:'E',seq:[null,null,null]};
}

function placeElement(r,c,type,fixed){
  if(!canEditNow())return;
  const puzzle=getCurrentPuzzle();
  if(!fixed && puzzle && ((type==='prism'&&puzzle.noPrisms)||(type==='mirrorHalf'&&puzzle.noHalfMirrors))) return;
  const cfg = defaultConfigFor(type);
  cfg.r=r; cfg.c=c;
  const arr = fixed ? getCurrentPuzzle().elements : promoteBlankIfNeeded().elements;
  arr.push(cfg);
  saveCurrentDoc();
  State.selectedCell = null;
  if(State.screen==='solutionEdit') renderScreen();
  else buildWorkingGrid();
  selectCell(r,c);
}

function selectCell(r,c){
  State.selectedCell = {r,c};
  renderInspector();
  openInspectorSheet();
  render();
}

function removeSelected(){
  if(!State.selectedCell) return;
  const {r,c} = State.selectedCell;
  const el = State.grid[r][c];
  if(!el || (el.fixed && State.screen==='solutionEdit')) return; // can't remove fixed from solution editor
  const arr = currentElementsArray();
  const idx = arr.findIndex(e=>e.r===r&&e.c===c);
  if(idx>=0){ arr.splice(idx,1); saveCurrentDoc(); }
  State.selectedCell=null;
  if(State.screen==='solutionEdit'){ renderScreen(); }
  else { buildWorkingGrid(); renderInspector(); render(); }
}

function saveCurrentDoc(){
  if(State.screen==='puzzleEdit'){reconcilePuzzleSolutions(getCurrentPuzzle());recordEditHistory();persistData();}
  else if(State.screen==='solutionEdit'){ recordEditHistory();persistSolutions(); updateRunUI(); }
}

function mutateSelectedConfig(mutator){
  if(!canEditNow())return;
  if(!State.selectedCell) return;
  const {r,c}=State.selectedCell;
  const arr = currentElementsArray();
  const cfg = arr.find(e=>e.r===r&&e.c===c);
  if(!cfg) return;
  mutator(cfg);
  if(State.screen==='solutionEdit'&&!getCurrentPuzzle()?.includeMirrorColors&&isMirrorElement(cfg))delete cfg.mirrorColor;
  saveCurrentDoc();
  State.selectedCell={r,c};
  if(State.screen==='solutionEdit'){ renderScreen(); }
  else { buildWorkingGrid(); renderInspector(); render(); }
}

/* ============================== DATA HELPERS ============================== */
function getCurrentPuzzle(){ return findPuzzleByRuntimeId(State.currentPuzzleId); }
// A puzzle always has a virtual "blank" solution pinned above its real
// ones — nothing is actually created or persisted for it until the first
// edit happens (see promoteBlankIfNeeded). currentSolutionId is 'BLANK'
// (or unset) while that virtual slot is the one being shown.
function getCurrentSolution(){
  if(State.currentSolutionId && State.currentSolutionId!=='BLANK'){
    const s = State.solutions.find(x=>x.id===State.currentSolutionId);
    if(s) return s;
  }
  const p = getCurrentPuzzle();
  return {id:'BLANK', puzzleId:p?canonicalPuzzleId(p):null,puzzleHash:p?puzzleConfigurationHash(p):null,name:'New solution', elements:[], status:'in-progress', createdAt:null};
}
// Called right before an actual edit (placing/moving/deleting/configuring
// a solver-placed element) is about to happen. If the blank virtual slot
// is currently active, this is the moment it becomes a real, persisted
// solution — after which State.currentSolutionId points at it like any
// other. Already-real solutions pass through untouched.
function promoteBlankIfNeeded(){
  const cur = getCurrentSolution();
  if(cur.id!=='BLANK') return cur;
  const p = getCurrentPuzzle();
  const s = {id:uid(),puzzleId:canonicalPuzzleId(p),puzzleHash:puzzleConfigurationHash(p),name:'Attempt '+(solutionsForPuzzle(p).length+1),elements:[],status:'in-progress',createdAt:Date.now()};
  State.solutions.push(s);
  State.currentSolutionId = s.id;
  adoptBlankEditHistory(s.id);
  persistSolutions();
  return s;
}
// All solution edits are persisted when they happen. Writing again when
// leaving (especially during pagehide) could replace newer work in another tab.
function saveCurrentSolutionBeforeLeaving(){
  if(State.screen!=='solutionEdit'||!getCurrentPuzzle())return null;
  const current=getCurrentSolution();
  if(current.id==='BLANK')return null;
  return current;
}
function solutionsForPuzzle(puzzleRef){
  const p=typeof puzzleRef==='object'?puzzleRef:findPuzzleByRuntimeId(puzzleRef)||State.puzzles.find(x=>x.id===puzzleRef);
  if(!p)return [];
  const id=canonicalPuzzleId(p);
  return State.solutions.filter(s=>s.puzzleId===id);
}
function mostRecentSolutionForPuzzle(puzzleRef){
  const solutions=solutionsForPuzzle(puzzleRef);
  let latest=null,latestTime=-Infinity;
  for(const solution of solutions){
    const time=Number.isFinite(Number(solution.createdAt))?Number(solution.createdAt):0;
    if(!latest||time>=latestTime){latest=solution;latestTime=time;}
  }
  return latest;
}

function currentPuzzleSequence(){
  const puzzle=getCurrentPuzzle();
  if(!puzzle)return {puzzles:[],index:-1};
  // Flatten sets in display order, preserving each set's puzzle order.
  // Empty sets contribute nothing, so navigation naturally skips them.
  const puzzles=allSets().flatMap(set=>puzzlesForSet(set));
  return {puzzles,index:puzzles.findIndex(item=>item.id===puzzle.id)};
}
function renderHeaderNavigation(){
  const onlineDetail=isOnlinePuzzleDetail();
  const detail=State.screen==='puzzleEdit'||State.screen==='solutionEdit'||onlineDetail;
  appHeader.classList.toggle('detail-open',detail);
  appHeader.classList.toggle('create-mode',State.mode==='create');
  appHeader.classList.toggle('online-mode',State.mode==='online');
  detailListBtn.textContent=onlineDetail?'Online Puzzles':State.mode==='create'?'Design Puzzles':'Play Puzzles';
  document.querySelectorAll('nav.modes button').forEach(button=>button.classList.toggle('active',button.dataset.mode===State.mode));
  if(!detail)return;
  if(onlineDetail){
    const {puzzles,index}=onlinePuzzleSequence(),busy=onlineBrowse.navigationRequest?.detail===onlineBrowse.detail;
    previousPuzzleBtn.disabled=busy||index<=0;
    nextPuzzleBtn.disabled=busy||index<0||(index>=puzzles.length-1&&(!onlineBrowse.hasMore||onlineBrowse.offset>=10000));
    return;
  }
  const {puzzles,index}=currentPuzzleSequence();
  previousPuzzleBtn.disabled=index<=0;
  nextPuzzleBtn.disabled=index<0||index>=puzzles.length-1;
}
function navigateAdjacentPuzzle(offset){
  if(isOnlinePuzzleDetail()){navigateAdjacentOnlinePuzzle(offset);return;}
  const {puzzles,index}=currentPuzzleSequence();
  const target=puzzles[index+offset];
  if(!target)return;
  openPuzzleBoard(target,State.screen==='solutionEdit'?'BLANK':null);
}

    if(actionValues.includes(value))select.value='';
    setTimeout(()=>{committing=false;},0);

function serializePuzzleIntroEditor(editor){
  function read(node){
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||'';
    if(node.nodeType!==Node.ELEMENT_NODE)return '';
    if(node.classList.contains('puzzle-intro-token')&&node.dataset.token)return `[[${node.dataset.token}]]`;
    if(node.tagName==='BR')return '\n';
    let value='';for(const child of node.childNodes)value+=read(child);return value;
  }
  let value='',hasContent=false;
  for(const child of editor.childNodes){
    const block=child.nodeType===Node.ELEMENT_NODE&&(child.tagName==='DIV'||child.tagName==='P');
    if(block&&hasContent)value+='\n';
    let part=read(child);
    if(block&&part==='\n')part='';
    value+=part;hasContent=true;
  }
  return value.replace(/\u00a0/g,' ').replace(/\r/g,'');
}

  if(selection){selection.removeAllRanges();selection.addRange(range);}
}

// The same spatial map moves fixed controls and saved solution controls.
// Color programs and transformer spectrum order are intrinsic, not directions.
function puzzleArrangement(rows,cols,action){
  const maps={
    left:{point:(r,c)=>[cols-1-c,r],dirs:{N:'W',E:'N',S:'E',W:'S'},swap:true,square:true},
    right:{point:(r,c)=>[c,rows-1-r],dirs:{N:'E',E:'S',S:'W',W:'N'},swap:true,square:true},
    half:{point:(r,c)=>[rows-1-r,cols-1-c],dirs:{N:'S',E:'W',S:'N',W:'E'}},
    horizontal:{point:(r,c)=>[r,cols-1-c],dirs:{N:'N',E:'W',S:'S',W:'E'}},
    vertical:{point:(r,c)=>[rows-1-r,c],dirs:{N:'S',E:'E',S:'N',W:'W'}},
    diagonal:{point:(r,c)=>[c,r],dirs:{N:'W',E:'S',S:'E',W:'N'},swap:true},
    antiDiagonal:{point:(r,c)=>[cols-1-c,rows-1-r],dirs:{N:'E',E:'N',S:'W',W:'S'},swap:true}
  };
  const map=maps[action];
  if(!map||map.square&&rows!==cols)return null;
  const nextRows=map.swap?cols:rows,nextCols=map.swap?rows:cols;
  if(nextRows<5||nextRows>15||nextCols<5||nextCols>11)return null;
  return {...map,rows:nextRows,cols:nextCols};
}
function arrangePuzzleElement(element,map){
  const copy=JSON.parse(JSON.stringify(element));

  const corner=value=>{
    if(!CORNER_SIDES[value])return value;
    const sides=CORNER_SIDES[value].map(direction);
    return Object.keys(CORNER_SIDES).find(key=>CORNER_SIDES[key].every(side=>sides.includes(side)));
  };
  if(copy.type==='emitter'||copy.type==='receiver')copy.dirs=copy.dirs.map(direction);
  if(copy.type==='mirrorDiag'){
    const endpoint=corner(copy.orientation==='NW_SE'?'NW':'NE');
    copy.orientation=endpoint==='NW'||endpoint==='SE'?'NW_SE':'NE_SW';
  }else if(copy.type==='mirrorHalf'){

// Shown on the right in place of the inspector once a run has started (or
// finished) — the inspector's edit controls wouldn't do anything useful
// then anyway, so this is more relevant: live progress toward each
// receiver's expected sequence.
function renderReceiversPanel(){
  rightPanel.innerHTML = `<h2 class="side-title">Receivers</h2>`;
  const rlist = document.createElement('div');
  for(let r=0;r<State.gridRows;r++) for(let c=0;c<State.gridCols;c++){
    const el = State.grid[r][c];
    if(el && el.type==='receiver'){
      const card=document.createElement('div'); card.className='card';
      if(el.failed||el.incomplete)card.style.borderColor='#ff3b3b';
      const dots = el.colors.map((col,i)=>{
        const done = el.marks && el.marks[i]==='ok';
        const fail = el.marks && el.marks[i]==='fail';
        const entry=receiverEntryForPacket(el,i);
        return `<span title="${COLNAME[col]} from ${DIRWORD[entry]}" style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;margin-right:4px;background:${COLHEX[col]};color:${colorCodeInk(col)};font:800 10px 'JetBrains Mono',monospace;opacity:${done?0.3:1};box-shadow:${fail?'0 0 0 2px #ff3b3b':'none'};">${State.colorblind?COLLETTER[col]:''}</span>`;
      }).join('');
      const nextEntry=receiverEntryForPacket(el);
      const complete=(el.pointer||0)>=el.colors.length;
      const nextText=new Set(el.dirs||[]).size>1
        ? `<p data-receiver-next="${r},${c}" ${complete?'hidden':''} style="font-size:11.5px;color:var(--dim);margin:6px 0 0;">${complete?'':`Next: ${COLNAME[el.colors[el.pointer||0]]} from ${DIRWORD[nextEntry]}`}</p>`:'';
      card.innerHTML = `<p style="margin-bottom:6px;">Receiver @ (${r},${c})</p>${dots}${nextText}`;
      rlist.appendChild(card);
    }
  }
  if(!rlist.children.length) rlist.innerHTML=`<div class="empty-hint">No receivers on this board.</div>`;
  rightPanel.appendChild(rlist);
}

// Toggles the tool palette's disabled state in place (no full re-render),
// so it can be updated every frame during playback cheaply. Also drops
// whatever tool was armed the instant it becomes disabled, so a stale
// "active" tool can't linger into a state where it can't actually be used.
function updateToolButtonsEnabled(){
  if(State.screen!=='solutionEdit') return;
  const enabled = canEditNow();
  const solvedLocked=currentSolutionIsLocked();
  document.querySelectorAll('.btn.tool').forEach(b=>{
    b.classList.remove('locked-solution-tool');b.removeAttribute('aria-disabled');if(b.title===SOLVED_LOCK_MESSAGE)b.removeAttribute('title');
    if(solvedLocked)markToolLockedBySolution(b);else b.disabled=!enabled;
  });
  document.querySelectorAll('.mobile-tool-button').forEach(b=>{
    b.classList.remove('locked-solution-tool');b.removeAttribute('aria-disabled');if(b.title===SOLVED_LOCK_MESSAGE)b.removeAttribute('title');
    if(solvedLocked)markToolLockedBySolution(b);else b.disabled=!enabled;

function buildOrientationProgram(selected,choices,iconFor,readOnly,onChange){
  const program=document.createElement('div');program.className='orientation-program';
  selected.forEach((current,rowIndex)=>{
    const row=document.createElement('div');row.className='orientation-choice-row';
    const step=document.createElement('span');step.className='orientation-step';step.textContent=String(rowIndex+1);row.appendChild(step);
    for(const choice of choices){
      const button=document.createElement('button');button.type='button';button.className='orientation-choice'+(choice==null?' blank':'')+(choice===current?' selected':'');
      button.innerHTML=iconFor(choice);button.setAttribute('aria-pressed',choice===current?'true':'false');
      button.setAttribute('aria-label',choice==null?`Step ${rowIndex+1}: blank`:`Step ${rowIndex+1}: ${choice}`);
      button.title=choice==null?'No change':`Orientation ${choice}`;
      button.disabled=readOnly||(rowIndex===0&&choice==null);
      if(!button.disabled)button.addEventListener('click',()=>onChange(rowIndex,choice));
      row.appendChild(button);
    }
    program.appendChild(row);
  });
  return program;
}

    wrap.appendChild(buildOrientationProgram([facing,...seq],['NW','NE','SE','SW',null],value=>miniHalfMirrorIconSVG(value,mirrorColorFor(el)),readOnly,(rowIndex,value)=>mutateSelectedConfig(cfg=>{

    wrap.appendChild(p);

    clearSw.style.outline = (el.filterColor==null) ? '2px solid #fff' : 'none';
    clearSw.style.outlineOffset='1px';
    if(!readOnly) clearSw.addEventListener('click',()=>mutateSelectedConfig(cfg=>cfg.filterColor=null));

      const s=document.createElement('div'); s.className='swatch'; s.style.background=COLHEX[col]; s.title=COLNAME[col];
      decorateColorControl(s,col);

function buildDirEditor(el, readOnly){
  const wrap=document.createElement('div');
  const label = el.type==='emitter' ? 'Emits toward' : 'Receives from';
  wrap.innerHTML = `<label class="field">${label}</label>`;
  const grid=document.createElement('div'); grid.className='dirgrid';
  const positions = {N:[1,0],W:[0,1],E:[2,1],S:[1,2]};
  for(let y=0;y<3;y++) for(let x=0;x<3;x++){
    const cell=document.createElement('div');
    const found = Object.entries(positions).find(([k,v])=>v[0]===x&&v[1]===y);
    if(found){
      const d=found[0];
      const btn=document.createElement('button'); btn.className='dirbtn'+(el.dirs.includes(d)?' on':''); btn.textContent=d;
      btn.disabled=readOnly;
      btn.addEventListener('click',()=>{
        mutateSelectedConfig(cfg=>{
          const set = new Set(cfg.dirs);
          if(set.has(d)) set.delete(d); else set.add(d);
          cfg.dirs = DIRS.filter(x=>set.has(x));
        });
      });
      cell.appendChild(btn);
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  if(el.type==='receiver'&&new Set(el.dirs||[]).size>1){
    const hint=document.createElement('p');
    hint.style.cssText='font-size:11.5px;color:var(--dim);margin:4px 0 8px;line-height:1.4;';
    hint.textContent=`Entry order: ${DIRS.filter(d=>el.dirs.includes(d)).join(' → ')} → repeat. Each packet must arrive on a different tick; the next entry opens on the following tick.`;
    wrap.appendChild(hint);
  }
  return wrap;
}

const speedSlider = document.getElementById('speedSlider');

let playbackFrameId = null;

function pausePlayback(){
  State.running = false;
  State.lastFrameTime = null;
  if(playbackFrameId !== null){
    cancelAnimationFrame(playbackFrameId);
    playbackFrameId = null;
  }
  playBtn.textContent = '▶';
}
function schedulePlaybackFrame(){
  if(playbackFrameId === null) playbackFrameId = requestAnimationFrame(loop);
}

speedSlider.addEventListener('input', ()=>{
  // State.frac is already a normalized 0..1 "how far through the current
  // tick" value, independent of how long a tick currently takes — so
  // changing speed needs no rescaling at all; it just changes how fast
  // frac advances from here on.
  State.speed=Number(speedSlider.value);
  if(State.speed===0) pausePlayback();
});
playBtn.addEventListener('click', ()=>{
  if(State.running){
    pausePlayback();
    updateToolButtonsEnabled();
    return;
  }
  // Zero speed is a real pause: don't start a frame loop that cannot advance.
  if(State.speed===0) return;
  if(State.finished)renderScreen();
  ensureGameAudio();
  State.runStarted = true;
  closeInspectorSheet();
  State.running = true;
  render();
  playBtn.textContent = '⏸';
  updateToolButtonsEnabled();
  // Resuming must not disturb where a packet is mid-tick — only reset the
  // frame-timing reference (so the paused duration itself isn't counted as
  // elapsed time), never State.frac, which is what remembers how far
  // through the current tick everything already was.
  State.lastFrameTime=null;
  schedulePlaybackFrame();
});
stepBtn.addEventListener('click', ()=>{
  if(State.finished) return;
  pausePlayback();
  ensureGameAudio();
  State.runStarted = true;
  closeInspectorSheet();
  doTick();
  if(State.failureScene) finishFailureScene();
  else {
    // A final exit occupies only the first half of this interval.
    State.frac=State.finishAfterAnimation||1;
    if(State.finishAfterAnimation){State.finishAfterAnimation=false;finishRun();}
  }
  invalidateSolvedSolutionWhenFailureVisible(State.frac);
  playScheduledSoundsUpTo(1,true);

resetRunBtn.addEventListener('click', ()=>{
  // Restart playback from the very beginning — a full screen refresh is

  renderScreen();

// Preserve the old curve through 40, spread the useful middle speeds over
// 40–80, then accelerate to 1,000 ticks/sec. Cubic interpolation in log-rate
// keeps both the rate and its slope continuous at the joins.
function speedToTicksPerSecond(v){
  v=clamp(Number(v)||0,0,100);
  const oldRate=value=>0.94*Math.expm1(3.92*Math.pow(value/100,1.62));
  if(v<=40)return oldRate(v);
  const middleStart=Math.log1p(oldRate(40)),middleEnd=Math.log1p(oldRate(70));
  const startSlope=.94*Math.exp(3.92*Math.pow(.4,1.62))*3.92*1.62*Math.pow(.4,.62)/100/(1+oldRate(40));
  const a=v<=80?40:80,b=v<=80?80:100;
  const y0=v<=80?middleStart:middleEnd,y1=v<=80?middleEnd:Math.log1p(1000);
  const m0=v<=80?startSlope:.04,m1=v<=80?.04:.35;
  const u=(v-a)/(b-a),u2=u*u,u3=u2*u;
  return Math.expm1((2*u3-3*u2+1)*y0+(u3-2*u2+u)*(b-a)*m0+(-2*u3+3*u2)*y1+(u3-u2)*(b-a)*m1);
}

function loop(t){
  playbackFrameId=null;
  if(!State.running) return;
  if(State.speed===0){pausePlayback();return;}
  if(State.lastFrameTime==null) State.lastFrameTime=t;
  // Returning from a background tab should not try to process minutes of
  // ticks in one frame.
  const dt = Math.min(100,Math.max(0,t-State.lastFrameTime)); State.lastFrameTime=t;
  const rate = speedToTicksPerSecond(State.speed);

  if(State.failureScene){
    if(rate>0){
      const interval=(1000/rate)*State.failureScene.duration;
      State.frac += dt/interval;
      if(State.frac>=1) finishFailureScene();
    }
    State.frac=clamp(State.frac,0,1);
    invalidateSolvedSolutionWhenFailureVisible(State.frac);
    updateRunUI();
    render(State.frac);
    if(State.running && !State.finished) schedulePlaybackFrame();
    else { pausePlayback(); render(1); }
    return;
  }

  // At fast speeds, keep the highest-priority sound for this frame rather
  // than creating hundreds of overlapping audio voices.
  if(rate>60)playbackSoundBatch={chosen:null};
  if(rate>0){
    const interval = 1000/rate;
    State.frac += dt/interval;
    let safety=0;
    const batchStarted=performance.now();
    // Batch fast ticks between renders, but leave time for input and drawing.
    while(State.running && safety<256 && (safety===0||performance.now()-batchStarted<8)){
      if(State.finishAfterAnimation && State.frac>=State.finishAfterAnimation){
        State.frac=State.finishAfterAnimation;
        playScheduledSoundsUpTo(State.frac);
        State.finishAfterAnimation=false;
        finishRun();
        break;
      }
      if(State.frac<1)break;
      playScheduledSoundsUpTo(1);
      doTick(); State.frac-=1;
      playScheduledSoundsUpTo(Math.max(0,Math.min(1,State.frac)));
      safety++;
      if(State.finished || State.failureScene) break;
    }
    State.frac = clamp(State.frac, 0, 1);
    playScheduledSoundsUpTo(State.frac);
  }
  if(playbackSoundBatch){
    const chosen=playbackSoundBatch.chosen;
    playbackSoundBatch=null;
    if(chosen&&(chosen.priority>=90||t-lastFastPlaybackSoundAt>=80)){
      lastFastPlaybackSoundAt=t;playGameSound(chosen.type);
    }
  }
  invalidateSolvedSolutionWhenFailureVisible(State.frac);
  updateRunUI();
  render(State.frac);
  if(State.running && !State.finished) schedulePlaybackFrame();
  else { pausePlayback(); render(State.frac); }
}

function updateRunUI(){

function invalidateFailedSolvedSolution(){
  if(State.screen!=='solutionEdit')return;
  const s=getCurrentSolution();
  if(s.id==='BLANK'||s.status!=='solved')return;
  s.status='in-progress';
  delete s.ticksToSolve;

function onRunFinished(overflow, leftoverPackets, strictFail, hardFail){

/* ============================== ABOUT ============================== */
const aboutBackdrop=document.getElementById('aboutBackdrop');
const aboutCanvas=document.getElementById('aboutCanvas');
const aboutContent=document.querySelector('.about-content');
const aboutCtx=aboutCanvas.getContext('2d');
let aboutFrame=null,aboutPacket=null,aboutLastTime=0,aboutNextPacketAt=0,aboutMirrorSet=[],aboutResizeTimer=null;
let aboutGridStep=64;
let initialAboutDismissal=true;

function resizeAboutCanvas(){
  const rect=aboutBackdrop.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  aboutCanvas.width=Math.max(1,Math.round(rect.width*dpr));
  aboutCanvas.height=Math.max(1,Math.round(rect.height*dpr));
  aboutCanvas.style.width=rect.width+'px';aboutCanvas.style.height=rect.height+'px';
  aboutCtx.setTransform(dpr,0,0,dpr,0,0);
  aboutCanvas._cssWidth=rect.width;aboutCanvas._cssHeight=rect.height;
  randomizeAboutMirrors();
  aboutPacket=null;aboutNextPacketAt=performance.now()+250;
}
function randomizeAboutMirrors(){
  const w=aboutCanvas._cssWidth||window.innerWidth,h=aboutCanvas._cssHeight||window.innerHeight;
  // Choose random cells on an invisible square grid, with every chosen cell
  // wholly above or below the central card. Taking three from each region
  // avoids the old four-corners-of-a-rectangle arrangement.
  const card=aboutContent.getBoundingClientRect();
  const step=aboutGridStep=clamp(Math.min(w/7.2,h/10.5),48,84);
  const cols=Math.max(5,Math.floor(w/step));
  const rows=Math.max(6,Math.floor(h/step));
  const originX=(w-(cols-1)*step)/2,originY=(h-(rows-1)*step)/2;
  const top=[],bottom=[],clearance=step*.43;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const cell={x:originX+col*step,y:originY+row*step};
    if(cell.y+clearance<card.top)top.push(cell);
    else if(cell.y-clearance>card.bottom)bottom.push(cell);
  }
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  shuffle(top);shuffle(bottom);
  const picked=[...top.slice(0,Math.min(3,top.length)),...bottom.slice(0,Math.min(3,bottom.length))];
  // Very short landscape screens may not fit three cells in both regions;
  // fill any remaining slots from every still-safe grid cell.
  if(picked.length<5){
    const used=new Set(picked.map(p=>p.x+','+p.y));
    for(const cell of shuffle([...top,...bottom]))if(!used.has(cell.x+','+cell.y)){picked.push(cell);used.add(cell.x+','+cell.y);if(picked.length>=5)break;}
  }
  aboutMirrorSet=picked.map((p,i)=>({...p,id:i,orientation:Math.random()<.5?'NE_SW':'NW_SE'}));
}
function aboutMirrors(){return aboutMirrorSet;}
function drawAboutMirror(m){
  const length=aboutGridStep*.68;
  const d=length/2;
  aboutCtx.save();aboutCtx.lineCap='round';aboutCtx.lineWidth=4;
  aboutCtx.strokeStyle='#eaf7ff';aboutCtx.shadowColor='#6ee7ff';aboutCtx.shadowBlur=13;
  aboutCtx.beginPath();
  if(m.orientation==='NE_SW'){aboutCtx.moveTo(m.x-d,m.y+d);aboutCtx.lineTo(m.x+d,m.y-d);}
  else{aboutCtx.moveTo(m.x-d,m.y-d);aboutCtx.lineTo(m.x+d,m.y+d);}
  aboutCtx.stroke();aboutCtx.restore();
}
function startAboutPacket(now){
  const mirrors=aboutMirrors();
  if(!mirrors.length){aboutNextPacketAt=now+1000;return;}
  const mirror=mirrors[Math.floor(Math.random()*mirrors.length)];
  const dir=DIRS[Math.floor(Math.random()*DIRS.length)];
  const route=buildAboutRoute(mirror,dir);
  const colors=[COL.R,COL.G,COL.B,COL.Y,COL.M,COL.C,COL.W];
  const firstDir=aboutSegmentDir(route[0],route[1]);
  aboutPacket={x:route[0].x,y:route[0].y,dir:firstDir,route,segment:0,color:colors[Math.floor(Math.random()*colors.length)],speed:190+Math.random()*80,finished:false};
  aboutLastTime=now;
}
function aboutSegmentDir(a,b){
  if(Math.abs(b.x-a.x)>Math.abs(b.y-a.y))return b.x>a.x?'E':'W';
  return b.y>a.y?'S':'N';
}
function nextAboutMirror(x,y,dir){
  let hit=null,nearest=Infinity;
  for(const m of aboutMirrors()){
    const sameLane=(dir==='E'||dir==='W')?Math.abs(m.y-y)<.75:Math.abs(m.x-x)<.75;
    if(!sameLane)continue;
    const ahead=dir==='E'?m.x-x:dir==='W'?x-m.x:dir==='S'?m.y-y:y-m.y;
    if(ahead>.5&&ahead<nearest){nearest=ahead;hit=m;}
  }
  return hit;
}
function buildAboutRoute(target,initialDir){
  const w=aboutCanvas._cssWidth,h=aboutCanvas._cssHeight;
  let x=target.x,y=target.y,dir=initialDir;
  if(dir==='E')x=-30;else if(dir==='W')x=w+30;else if(dir==='S')y=-30;else y=h+30;
  const route=[{x,y}];
  // Plain mirror reflection is reversible. A ray that begins outside cannot
  // feed into a closed loop: every state in such a loop already has its one
  // unique predecessor. So simply follow each collision until the ray exits.
  while(true){
    const hit=nextAboutMirror(x,y,dir);
    if(!hit){
      if(dir==='E')x=w+110;else if(dir==='W')x=-110;else if(dir==='S')y=h+110;else y=-110;
      route.push({x,y});return route;
    }
    x=hit.x;y=hit.y;route.push({x,y});
    const map=hit.orientation==='NE_SW'?NE_SW_MAP:NW_SE_MAP;dir=map[dir];
  }
}
function moveAboutPacket(distance){
  const p=aboutPacket;if(!p)return;
  while(distance>0&&!p.finished){
    const end=p.route[p.segment+1];
    const dx=end.x-p.x,dy=end.y-p.y,remaining=Math.hypot(dx,dy);
    if(distance<remaining){p.x+=dx/remaining*distance;p.y+=dy/remaining*distance;distance=0;}
    else{
      p.x=end.x;p.y=end.y;distance-=remaining;p.segment++;
      if(p.segment>=p.route.length-1)p.finished=true;
      else p.dir=aboutSegmentDir(p.route[p.segment],p.route[p.segment+1]);
    }
  }
}
function drawAboutPacket(){
  const p=aboutPacket;if(!p)return;
  const v=VEC[p.dir],trail=58;
  const grad=aboutCtx.createLinearGradient(p.x-v.dc*trail,p.y-v.dr*trail,p.x,p.y);
  grad.addColorStop(0,COLHEX[p.color]+'00');grad.addColorStop(1,COLHEX[p.color]+'cc');
  aboutCtx.save();aboutCtx.strokeStyle=grad;aboutCtx.lineWidth=5;aboutCtx.lineCap='round';
  aboutCtx.beginPath();aboutCtx.moveTo(p.x-v.dc*trail,p.y-v.dr*trail);aboutCtx.lineTo(p.x,p.y);aboutCtx.stroke();
  aboutCtx.shadowColor=COLHEX[p.color];aboutCtx.shadowBlur=22;aboutCtx.fillStyle=COLHEX[p.color];
  aboutCtx.beginPath();aboutCtx.arc(p.x,p.y,11,0,Math.PI*2);aboutCtx.fill();aboutCtx.shadowBlur=0;
  if(State.colorblind){
    aboutCtx.fillStyle=colorCodeInk(p.color);aboutCtx.font='900 13px Arial,system-ui,sans-serif';
    aboutCtx.textAlign='center';aboutCtx.textBaseline='middle';aboutCtx.fillText(COLLETTER[p.color],Math.round(p.x),Math.round(p.y));
  }
  aboutCtx.restore();
}
function animateAbout(now){
  if(!aboutBackdrop.classList.contains('show')){aboutFrame=null;return;}
  const w=aboutCanvas._cssWidth,h=aboutCanvas._cssHeight;
  aboutCtx.clearRect(0,0,w,h);aboutMirrors().forEach(drawAboutMirror);
  if(!aboutPacket&&now>=aboutNextPacketAt)startAboutPacket(now);
  if(aboutPacket){
    const dt=Math.min(.05,Math.max(0,(now-aboutLastTime)/1000));aboutLastTime=now;
    moveAboutPacket(aboutPacket.speed*dt);drawAboutPacket();
    if(aboutPacket.x < -90||aboutPacket.x>w+90||aboutPacket.y < -90||aboutPacket.y>h+90){
      aboutPacket=null;aboutNextPacketAt=now+1000+Math.random()*2000;
    }
  }
  aboutFrame=requestAnimationFrame(animateAbout);
}
function showAbout(){
  hideHelp();if(aboutResizeTimer!=null){clearTimeout(aboutResizeTimer);aboutResizeTimer=null;}
  aboutBackdrop.classList.add('show');resizeAboutCanvas();aboutLastTime=performance.now();
  if(aboutFrame==null)aboutFrame=requestAnimationFrame(animateAbout);
  setTimeout(()=>aboutBackdrop.focus(),0);
}
function hideAbout(){
  const enteringApp=initialAboutDismissal&&aboutBackdrop.classList.contains('show');
  if(enteringApp)initialAboutDismissal=false;
  aboutBackdrop.classList.remove('show');if(aboutFrame!=null)cancelAnimationFrame(aboutFrame);
  if(aboutResizeTimer!=null)clearTimeout(aboutResizeTimer);
  aboutFrame=null;aboutResizeTimer=null;aboutPacket=null;
  if(enteringApp&&State.screen==='solutionEdit'){
    const puzzle=getCurrentPuzzle();
    warnIfStrictPacketTotalsMismatch(puzzle);
    if(State.currentSolutionId==='BLANK')schedulePuzzleIntro(puzzle);
  }
}
aboutBackdrop.addEventListener('click',hideAbout);
aboutBackdrop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hideAbout();}});
window.addEventListener('resize',()=>{
  if(!aboutBackdrop.classList.contains('show'))return;
  // A browser can fire dozens of resize events while a window or mobile
  // viewport is changing. Blank the animated scenery once, then rebuild it
  // only after the size has remained stable for a moment.
  aboutMirrorSet=[];aboutPacket=null;aboutNextPacketAt=Infinity;
  aboutCtx.clearRect(0,0,aboutCanvas._cssWidth||0,aboutCanvas._cssHeight||0);
  if(aboutResizeTimer!=null)clearTimeout(aboutResizeTimer);
  aboutResizeTimer=setTimeout(()=>{
    aboutResizeTimer=null;
    if(!aboutBackdrop.classList.contains('show'))return;
    resizeAboutCanvas();aboutLastTime=performance.now();
  },220);
});
